<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Địa chất kiến trúc – Học tương tác</title>
<style>
:root{
  --bg:#f6f7fb;--panel:#fff;--ink:#1c2333;--muted:#5d6780;--line:#dfe3ee;
  --brand:#1f5fbf;--brand2:#0f3d82;--accent:#e8912d;--ok:#1b9a5b;--bad:#d24545;
  --c1:#1f5fbf;--c2:#7a3fb8;--c3:#0e8a7d;
  --shadow:0 2px 10px rgba(20,30,60,.08);
}
:root[data-theme=dark]{
  --bg:#12151e;--panel:#1b2030;--ink:#e6e9f2;--muted:#9aa4bd;--line:#2c3348;
  --brand:#6ea3ff;--brand2:#9dc1ff;--accent:#f0a850;--shadow:0 2px 10px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:16px/1.65 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--brand)}
#app{display:grid;grid-template-columns:290px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;padding:16px 14px}
aside h1{font-size:18px;margin:0 0 2px;color:var(--brand2)}
aside .sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.chap{margin:6px 0}
.chap>button{width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;font:600 14px inherit;color:var(--ink);cursor:pointer;display:flex;gap:8px;align-items:center}
.chap>button:hover{background:var(--bg)}
.chap.open>button{background:var(--bg)}
.chap .num{width:24px;height:24px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:12px;flex:none}
.sec{display:none;margin:2px 0 6px 18px;border-left:2px solid var(--line)}
.chap.open .sec{display:block}
.sec a{display:flex;justify-content:space-between;padding:4px 10px;font-size:13px;color:var(--muted);text-decoration:none;border-radius:6px}
.sec a:hover{background:var(--bg);color:var(--ink)}
.sec a.active{color:var(--brand);font-weight:600;background:var(--bg)}
.sec a .tick{color:var(--ok)}
.tools{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.tools button,.btn{background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:6px 11px;border-radius:8px;cursor:pointer;font:13px inherit}
.tools button:hover,.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
main{padding:28px min(5vw,56px) 80px;max-width:1080px;width:100%}
.topbar{display:none}
.hero{background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;border-radius:16px;padding:28px;margin-bottom:22px}
.hero h2{margin:0 0 6px;font-size:26px}
.hero p{margin:0;opacity:.92}
.hero .pill{display:inline-block;background:rgba(255,255,255,.18);padding:2px 10px;border-radius:99px;font-size:12px;margin-bottom:8px}
h2.st{font-size:24px;margin:0 0 4px;color:var(--brand2)}
.crumb{font-size:13px;color:var(--muted);margin-bottom:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:16px 0;box-shadow:var(--shadow)}
.card h3{margin:0 0 8px;font-size:17px}
.card h4{margin:14px 0 6px;font-size:15px}
.note,.warn,.key,.check{border-radius:12px;padding:12px 16px;margin:14px 0;font-size:15px;border-left:5px solid}
.note{background:rgba(31,95,191,.08);border-color:var(--brand)}
.key{background:rgba(232,145,45,.12);border-color:var(--accent)}
.warn{background:rgba(210,69,69,.09);border-color:var(--bad)}
.check{background:rgba(27,154,91,.1);border-color:var(--ok)}
.note b:first-child,.key b:first-child,.warn b:first-child,.check b:first-child{display:block;margin-bottom:2px}
table{border-collapse:collapse;width:100%;font-size:14px;margin:10px 0}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:rgba(31,95,191,.1)}
.tw{overflow-x:auto}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.mini{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel)}
.mini h4{margin:0 0 4px}
.mini.click{cursor:pointer;transition:.15s}
.mini.click:hover,.mini.sel{border-color:var(--brand);transform:translateY(-1px);box-shadow:var(--shadow)}
.lab{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0;font-size:14px}
.lab input[type=range]{flex:1;min-width:140px}
.lab select,.lab input[type=number],.lab input[type=text]{padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.val{font-weight:700;color:var(--brand);min-width:52px}
canvas,svg.w{max-width:100%;background:var(--bg);border-radius:12px;border:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--line);margin:2px 3px 2px 0}
.tag.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.bar{height:14px;background:var(--bg);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#6ea3ff)}
.tl{position:relative;margin:14px 0 6px;padding-left:20px;border-left:3px solid var(--brand)}
.tl .ev{position:relative;margin:0 0 12px;padding:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.tl .ev:before{content:"";position:absolute;left:-30px;top:14px;width:14px;height:14px;border-radius:50%;background:var(--panel);border:3px solid var(--brand)}
.tl .ev.open{border-color:var(--brand)}
.tl .ev .d{display:none;color:var(--muted);font-size:14px;margin-top:4px}
.tl .ev.open .d{display:block}
.tl .ev b{color:var(--brand2)}
.pager{display:flex;justify-content:space-between;margin-top:30px;gap:10px}
.mtab{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.mtab button{padding:5px 11px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;cursor:pointer;font:13px inherit}
.mtab button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
sub,sup{line-height:0}
.ov{text-decoration:overline}
.res{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0}
.sw{display:inline-block;width:18px;height:18px;border-radius:4px;vertical-align:middle;border:1px solid var(--line)}
@media(max-width:860px){
  #app{grid-template-columns:1fr}
  aside{position:fixed;left:-310px;width:290px;z-index:20;transition:.2s;box-shadow:var(--shadow)}
  aside.on{left:0}
  .topbar{display:flex;position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 14px;gap:10px;align-items:center}
  .two{grid-template-columns:1fr}
}

.fig{margin:16px 0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 12px 8px;box-shadow:var(--shadow)}
.fig svg{width:100%;height:auto;display:block}
.fig figcaption{font-size:13px;color:var(--muted);text-align:center;margin-top:6px}

</style>

<script>
window.CHAPTERS = window.CHAPTERS || [];
window.CHAPTERS.push({
 id: 'c1', num: 1, title: 'Nhập môn: kiến tạo mảng & biến dạng',
 blurb: 'Địa chất kiến trúc học gì; ba kiểu ranh giới mảng; ứng suất, biến dạng đàn hồi – dẻo – phá huỷ.',
 sections: [
  { id: 'gioi-thieu', title: '1. Địa chất kiến trúc là gì?', html: `
   <p>Bài này trả lời ba câu hỏi: môn học nghiên cứu cái gì, học để làm gì và cần biết trước những gì.</p>
   <div class="key"><b>Địa chất kiến trúc (Structural Geology)</b>Nghiên cứu kiến trúc/cấu tạo của vỏ Trái Đất và các quá trình làm biến dạng nó: nếp uốn, đứt gãy, khe nứt… và hình thái không gian của các thể địa chất (thế nằm).</div>
   <h3>Học để làm gì?</h3>
   <p>Cấu trúc của đá quyết định nơi nước ngầm chứa và chảy, nơi dầu khí bị bẫy, nơi khoáng sản tập trung, độ ổn định của mái dốc, hầm và nền móng, và nơi xảy ra động đất. Vì thế kiến thức này dùng trong địa chất dầu khí, khoáng sản, địa chất công trình – thuỷ văn, quy hoạch xây dựng và đánh giá tai biến.</p>
   <h3>Ba chuẩn đầu ra của môn</h3>
   <div class="grid">
    <div class="mini"><h4>L.O.1</h4>Giải thích cơ chế hình thành các đặc điểm kiến trúc địa chất, từ đó khôi phục lịch sử phát triển địa chất của khu vực.</div>
    <div class="mini"><h4>L.O.2</h4>Xây dựng cơ sở dữ liệu từ số liệu đo đạc thực tế.</div>
    <div class="mini"><h4>L.O.3</h4>Phân tích, xử lý số liệu trong phòng, viết báo cáo và đánh giá.</div>
   </div>
   <h3>Đánh giá và tài liệu</h3>
   <div class="tw"><table><tr><th>Thành phần</th><th>Tỷ trọng</th></tr>
    <tr><td>Bài tập</td><td>10%</td></tr><tr><td>Thực hành</td><td>10%</td></tr><tr><td>Thực tập</td><td>30%</td></tr>
    <tr><td>Thi (cuối kì 40% + kiểm tra hằng tuần 10%)</td><td>50%</td></tr></table></div>
   <p>Giáo trình tham khảo: <i>Địa chất kiến trúc, đo vẽ bản đồ địa chất và một số vấn đề cơ bản của địa kiến tạo</i> (La Thị Chích – Phạm Huy Long, ĐHQG TP.HCM, tái bản lần II, 2011); <i>Structural Geology of Rocks and Regions</i> (Davis, Reynolds, Kluth, 3rd ed., 2012).</p>
   <h3>Kiến thức nền cần nhớ lại</h3>
   <ul><li>Kiến tạo mảng và ranh giới mảng; biến dạng, nếp uốn, đứt gãy (sẽ ôn ngay trong chương này).</li>
   <li>Các nguyên tắc địa tầng (chương 7); ba nhóm đá magma – trầm tích – biến chất.</li>
   <li>Đọc bản đồ địa hình và vẽ mặt cắt địa hình (chương 3).</li></ul>
   <div class="note"><b>Môn học nối tiếp</b>Địa chất khu vực; Địa mạo – Tân kiến tạo – Trầm tích Đệ Tứ; Trầm tích học và nhịp địa tầng; Cơ học đá.</div>` },

  { id: 'kien-tao-mang', title: '2. Kiến tạo mảng: ba kiểu ranh giới', html: `
   <p>Phần lớn biến dạng của vỏ Trái Đất xuất hiện dọc theo <b>rìa các mảng kiến tạo</b>, nên trước tiên cần nắm cách các mảng chuyển động tương đối với nhau.</p>
   <div data-w="fig" data-name="plates" data-cap="Ba kiểu ranh giới mảng: tách giãn, hội tụ (hút chìm) và chuyển dạng."></div>
   <div class="card"><h3>Chọn kiểu ranh giới</h3><div data-w="plates"></div></div>
   <div class="tw"><table><tr><th>Kiểu ranh giới</th><th>Chuyển động</th><th>Ví dụ</th></tr>
    <tr><td>Tách giãn</td><td>Hai mảng rời xa nhau</td><td>Sống núi giữa đại dương (bazan); tách giãn trên lục địa Đông Phi; mở biển Biển Đỏ – vịnh Aden</td></tr>
    <tr><td>Hội tụ – đại dương/lục địa</td><td>Thạch quyển đại dương hút chìm dưới lục địa</td><td>Dãy Andes và cung núi lửa (mảng Nazca – Nam Mỹ)</td></tr>
    <tr><td>Hội tụ – đại dương/đại dương</td><td>Một thạch quyển đại dương chìm dưới mảng kia</td><td>Cung núi lửa đảo Ryukyu (mảng Philippines chìm dưới mảng Á-Âu)</td></tr>
    <tr><td>Hội tụ – lục địa/lục địa</td><td>Hai thạch quyển lục địa va chạm, ép nhau</td><td>Mảng Ấn Độ – mảng Á-Âu (Himalaya)</td></tr>
    <tr><td>Chuyển dạng</td><td>Trượt ngang qua nhau, đổi hướng dịch chuyển</td><td>Đứt gãy San Andreas</td></tr></table></div>
   <div class="note"><b>Mở rộng</b>Thạch quyển đại dương có tỷ trọng lớn hơn thạch quyển lục địa nên luôn là bên bị hút chìm; hai thạch quyển lục địa đều nổi nên không chìm sâu mà bị nén, dày lên và nhô cao thành núi.</div>` },

  { id: 'ung-suat', title: '3. Lực, ứng suất và biến dạng', html: `
   <p>Đá bị biến dạng khi chịu lực. Bài này phân biệt ba đại lượng hay bị lẫn: <b>lực</b>, <b>ứng suất</b> và <b>biến dạng</b>.</p>
   <div class="key"><b>Định nghĩa</b><b>Biến dạng (deformation)</b>: mọi thay đổi về hình dạng/kích thước của đá so với ban đầu.<br><b>Ứng suất (stress)</b>: lực tác dụng trên một đơn vị diện tích.<br><b>Strain</b> (cũng dịch là biến dạng): sự thay đổi hình dạng hoặc kích thước của đá <i>do</i> ứng suất gây ra.</div>
   <h3>Ba kiểu ứng suất</h3>
   <div data-w="fig" data-name="stress3" data-cap="Nét đứt: khối đá ban đầu; khối màu: sau biến dạng. Mũi tên chỉ hướng lực tác dụng."></div>
   <div data-w="filtercards" data-items='[["Ứng suất ép (compressional)","Ép đá lại: khối đá ngắn đi theo phương ép và dày lên theo phương thẳng đứng. Sinh nếp uốn, đứt gãy nghịch.","Ép"],["Ứng suất kéo (tensional)","Kéo giãn đá: khối đá dài ra theo phương ngang và mỏng đi theo phương đứng. Sinh đứt gãy thuận.","Kéo"],["Ứng suất cắt (shear)","Hai phần đá bị đẩy trượt ngược chiều nhau. Sinh dịch chuyển dọc đới đứt gãy hoặc chảy dẻo; là kiểu biến dạng bảo toàn thể tích.","Cắt"]]'></div>
   <p>Ví dụ dễ hình dung cho biến dạng cắt là xấp bài: đẩy mặt trên, các lá bài trượt lên nhau, vòng tròn vẽ trên cạnh xấp bài biến thành elip nhưng thể tích không đổi. Các đá phân lớp (trầm tích) hoặc phân phiến (phiến mica trong đá biến chất) đặc biệt dễ biến dạng theo kiểu này vì chúng có sẵn các mặt yếu.</p>
   <div class="warn"><b>Hay nhầm</b>Ứng suất là “nguyên nhân” (lực trên diện tích), biến dạng là “kết quả” (thay đổi hình dạng, kích thước). Ứng suất không tự thể hiện thành nếp uốn hay đứt gãy nếu chưa vượt sức bền của đá.</div>
   <p>Khi ứng suất lớn hơn sức bền, đá bắt đầu biến dạng theo một trong ba cách: <b>uốn nếp (folding)</b>, <b>chảy (flowing)</b> hoặc <b>phá huỷ (fracturing)</b>. Bài kế tiếp giải thích vì sao.</p>` },

  { id: 'kieu-bien-dang', title: '4. Đàn hồi – dẻo – phá huỷ', html: `
   <p>Cùng một ứng suất nhưng đá có thể phản ứng rất khác nhau. Đồ thị ứng suất – biến dạng cho thấy ba giai đoạn liên tiếp.</p>
   <div class="card"><h3>Kéo thử một mẫu đá</h3><p style="margin-top:0">Kéo thanh trượt để tăng biến dạng; bật “Thôi tác dụng lực” để xem phần nào hồi phục.</p><div data-w="stressStrain"></div></div>
   <div class="tw"><table><tr><th>Kiểu</th><th>Đặc điểm</th><th>Sản phẩm</th></tr>
   <tr><td>Đàn hồi</td><td>Hình dạng, kích thước trở về gần như ban đầu khi thôi tác dụng lực</td><td>Không để lại cấu trúc</td></tr>
   <tr><td>Dẻo (ductile)</td><td>Vượt giới hạn đàn hồi: biến dạng vĩnh viễn nhưng chưa nứt</td><td>Nếp uốn, dòng chảy dẻo</td></tr>
   <tr><td>Phá huỷ (brittle)</td><td>Vượt giới hạn bền: đá nứt, vỡ</td><td>Khe nứt, đứt gãy</td></tr></table></div>
   <div class="key"><b>Ghi nhớ</b>Đàn hồi → (giới hạn đàn hồi) → dẻo → (điểm phá huỷ) → gãy. Sau biến dạng dẻo, nhả tải chỉ lấy lại phần đàn hồi; phần còn lại là <b>biến dạng dư (permanent strain)</b>.</div>
   <p>Hầu hết đá biến chất chịu tác dụng đồng thời của áp suất và nhiệt độ cao nên có xu hướng biến dạng dẻo, tạo những nếp uốn nhỏ li ti trong phiến đá. Ở vùng nông, lạnh, đá cứng hơn nên xu hướng phá huỷ chiếm ưu thế. Vì vậy nếp uốn (kết quả của biến dạng dẻo) và đứt gãy (kết quả của phá huỷ) là hai sản phẩm chính sẽ học ở các chương 5 và 6.</p>
   <div class="note"><b>Mở rộng</b>Ngoài áp suất và nhiệt độ, tốc độ biến dạng, thành phần đá và sự có mặt của nước cũng quyết định đá xử sự dẻo hay giòn: biến dạng càng chậm, càng nóng, càng sâu thì càng dễ dẻo.</div>` }
 ]
});

</script>
<script>
window.CHAPTERS.push({
 id: 'c2', num: 2, title: 'Thế nằm & các yếu tố thế nằm',
 blurb: 'Đường phương, hướng dốc, góc dốc; cách đo, cách ghi và ký hiệu trên bản đồ.',
 sections: [
  { id: 'the-nam', title: '1. Thế nằm là gì?', html: `
   <p>Muốn vẽ được bản đồ và mặt cắt địa chất, ta phải mô tả được <b>vị trí của một mặt đá trong không gian</b>. Đó là việc của “thế nằm”.</p>

  { id: 'bieu-kien', title: '2. Thế nằm thật từ hai thế nằm biểu kiến', html: `
   <p>Nhiều khi vách lộ chỉ cho thấy mặt lớp qua một mặt cắt <i>bất kỳ</i>, không vuông góc đường phương. Ta có các số đo “biểu kiến”, cần suy ra thế nằm thật.</p>
   <div class="key"><b>Định nghĩa</b><b>Đường dốc biểu kiến</b>: đường dốc bất kỳ trên mặt lớp, không trùng với đường dốc có góc dốc lớn nhất. <b>Hướng dốc biểu kiến</b>: hình chiếu của nó lên mặt phẳng nằm ngang. <b>Góc dốc biểu kiến</b>: góc giữa đường dốc biểu kiến và hình chiếu của nó. Luôn có <b>α<sub>bk</sub> &lt; α thật</b>.</div>
   <h3>Cách dựng hình (ví dụ: 140∠35 và 230∠65)</h3>
   <ol>
    <li>Vẽ vòng tròn tâm O. Từ O vẽ tia phương 140° (β₁) và 230° (β₂).</li>
    <li>Từ O vẽ hai đường thẳng vuông góc với β₁ và β₂ cắt vòng tròn tại D′ và D″.</li>
    <li>Vẽ các góc 90° − α₁ và 90° − α₂ (tại D′ và D″); cạnh của chúng cắt β₁, β₂ tại A và B.</li>
    <li>Nối AB: đó là <b>đường phương</b> của lớp.</li>
    <li>Từ O vẽ OC ⟂ AB: OC là hình chiếu của hướng dốc lên mặt phẳng nằm ngang, hướng của OC là <b>hướng dốc thật</b>.</li>
    <li>Từ O vẽ OD‴ ⟂ OC với OD‴ = OD′ (bán kính), nối CD‴: góc OCD‴ chính là <b>góc dốc thật α</b>.</li>
   </ol>
   <h3>Cách tính</h3>
   <div class="key"><b>Công thức</b>Với hướng có phương vị β<sub>bk</sub>: tan α<sub>bk</sub> = tan α · cos(β<sub>bk</sub> − β). Viết cho hai hướng ta được hệ hai phương trình, giải ra β và α.</div>
   <div class="card"><h3>Máy tính thế nằm thật</h3><p style="margin-top:0">Ví dụ 140∠35 và 230∠65 cho β ≈ 212°, α ≈ 66°. Kết quả này khớp với cách dựng hình ở trên.</p><div data-w="apparentDip"></div></div>
   <div class="warn"><b>Điều kiện</b>Hai hướng đo phải khác nhau rõ rệt. Nếu chúng trùng nhau hoặc ngược nhau thì hai số đo không cung cấp thêm thông tin và không giải được.</div>` },

  { id: 'lo-khoan', title: '3. Thế nằm thật từ tài liệu lỗ khoan', html: `
   <p>Ba lỗ khoan không thẳng hàng cùng gặp nóc của một vỉa cho ba điểm trong không gian; ba điểm xác định duy nhất một mặt phẳng. Đây là “bài toán ba điểm”.</p>
   <h3>Các bước</h3>
   <ol>
    <li>Tính <b>cao độ nóc vỉa</b> tại mỗi lỗ khoan = cao độ miệng lỗ khoan − độ sâu gặp nóc vỉa.</li>
    <li>Nối ba lỗ khoan thành tam giác; trên cạnh nối điểm cao nhất và thấp nhất, <b>nội suy</b> điểm có cùng cao độ với điểm trung gian.</li>
    <li>Nối hai điểm cùng cao độ: đó là <b>đường phương</b>. Vẽ thêm các đường phương song song, mỗi đường một cao độ (cách đều nhau).</li>
    <li>Từ điểm cao nhất kẻ đường vuông góc xuống đường phương thấp hơn (hướng cao độ giảm): đó là <b>hướng dốc</b>; đo phương vị bằng thước đo độ. </li>
    <li>Đo khoảng cách ngang a giữa hai đường phương cách nhau chênh cao h; góc dốc <b>tan α = h / a</b> (đổi a ra mét thực bằng cách nhân với mẫu số tỷ lệ bản đồ: AB = số đo × tỷ lệ).</li>
   </ol>
   <p>Ví dụ 1 (tỷ lệ 1/500): LK1 = 490 m / 350 m; LK2 = 530 m / 340 m; LK3 = 520 m / 410 m (cao độ miệng / độ sâu gặp nóc vỉa than). Cao độ nóc vỉa là 140 m, 190 m và 110 m. Ví dụ 2: LKa = 350/100, LKb = 300/100, LKc = 450/100 cho nóc vỉa ở 250 m, 200 m và 350 m.</p>
   <div class="card"><h3>Thử với ba lỗ khoan</h3><p style="margin-top:0">Kéo các điểm để đặt vị trí lỗ khoan. Đường cam là các đường phương (đồng mức của nóc vỉa) cách nhau 10 m.</p><div data-w="threePoint"></div></div>
   <div class="note"><b>Về số liệu</b>Chương trình chỉ cho số liệu cao độ, còn vị trí ba lỗ khoan phụ thuộc bản đồ; vì vậy trong hình trên bạn tự kéo vị trí và quan sát sự thay đổi của kết quả. Nếu đo được toạ độ ngoài bản đồ thì chỉ cần nhập vào đúng như vậy.</div>` },

  { id: 'cu-ly-chieu', title: '4. Cự ly chiếu và đường phương chiếu', html: `
   <p>Bề rộng vết lộ của một lớp nghiêng trên bản đồ phụ thuộc vào góc dốc lớp và độ nghiêng địa hình. Công cụ để nghiên cứu là <b>cự ly chiếu</b> và <b>đường phương chiếu</b>.</p>
   <div class="key"><b>Cự ly chiếu a</b>Là hình chiếu, lên mặt phẳng nằm ngang, của khoảng cách giữa hai đường phương của mặt nóc (hoặc mặt đáy) của lớp nằm nghiêng ứng với hai mặt nằm ngang song song cách đều nhau khoảng h.</div>
   <div class="key"><b>Công thức</b>a = h · cot α · T (với T là tỷ lệ bản đồ dạng phân số, ví dụ 1/2000), nghĩa là tan α = h · T / a.</div>
   <ul>
    <li>a tỷ lệ <b>nghịch</b> với α: lớp càng dốc thì a càng nhỏ, các đường phương chiếu càng sít nhau.</li>
    <li>a tỷ lệ <b>thuận</b> với h và với T (tỷ lệ bản đồ càng lớn thì a vẽ ra càng dài).</li>
   </ul>
   <div class="card"><h3>Tính cự ly chiếu</h3><p style="margin-top:0">Ví dụ minh hoạ: h = 10 m, α = 23°, tỷ lệ 1/2000 cho a ≈ 11,8 mm (ứng với h = 5 mm trên bản đồ).</p><div data-w="projDist"></div></div>` },

  { id: 'tam-giac-via', title: '5. Tam giác vỉa và vết lộ', html: `
   <p>Trên bản đồ tỷ lệ lớn, hình dạng vết lộ của lớp cho biết thế nằm của nó, đặc biệt khi lớp cắt qua thung lũng hoặc sống núi.</p>
   <div class="key"><b>Tam giác vỉa</b>Vết lộ có dạng chữ V trên bản đồ, do lớp nghiêng cắt qua thung lũng hoặc sống núi. Mũi nhọn của chữ V cho biết hướng dốc của lớp.</div>
   <ul>
    <li>Tại vị trí thấp nhất của địa hình (thung lũng, điểm M): vết lộ cho biết góc hướng và <b>hướng dốc</b> của lớp (chữ V chỉ theo hướng dốc).</li>
    <li>Tại vị trí cao nhất của địa hình (sống núi, điểm N): góc hướng <b>ngược chiều</b> với hướng dốc của lớp.</li>
   </ul>
   <h3>Góc dốc và hình dạng vết lộ (cùng một địa hình)</h3>
   <div class="tw"><table><tr><th>Lớp</th><th>Vết lộ trên bản đồ</th></tr>
    <tr><td>Dốc thẳng đứng</td><td>Đường thẳng</td></tr><tr><td>Dốc nhiều</td><td>Góc tù (V mở rộng)</td></tr><tr><td>Dốc thoải</td><td>Góc nhọn (V hẹp, uốn theo đường đồng mức)</td></tr><tr><td>Nằm ngang</td><td>Trùng đường đồng mức</td></tr></table></div>
   <div data-w="fig" data-name="vRule" data-cap="Cùng một thung lũng: lớp càng dốc, vết lộ càng thẳng (chữ V càng tù); lớp càng thoải, chữ V càng nhọn."></div>
   <div class="key"><b>Khi bản đồ không có đường đồng mức</b>Dùng quy luật chung: trong trường hợp bình thường lớp luôn nghiêng về phía trầm tích trẻ.</div>
   <div class="note"><b>Mở rộng</b>Quy tắc chữ V có ngoại lệ: khi lớp dốc cùng chiều với dòng chảy và thoải hơn độ dốc lòng suối thì mũi V có thể chỉ ngược dòng. Nếu tính toán cho kết quả khác với đoán nhanh bằng chữ V, hãy tin vào phép tính.</div>` },

  { id: 'the-nam-dao', title: '6. Thế nằm đảo', html: `
   <p>Trong điều kiện bình thường lớp trẻ nằm trên, lớp cổ nằm dưới. Nhưng khi đá bị biến dạng mạnh, thứ tự này có thể lộn ngược.</p>
   <div class="key"><b>Thế nằm bình thường</b>Nóc ở trên, đáy ở dưới. <b>Thế nằm đảo</b>: lớp bị quay quá 90°, đáy nằm cao hơn nóc (mặt lớp cũ “nằm lộn ngược”). Xác định được điều này rất quan trọng trong nghiên cứu địa tầng, trầm tích và kiến tạo, vì nếu bỏ sót sẽ đảo ngược thứ tự tuổi.</div>
   <p>Trong sơ đồ mặt cắt của một nếp uốn, nửa trên của đường AB đáy lớp nằm cao hơn nóc nên có thế nằm đảo; nửa dưới, lớp có thế nằm bình thường.</p>
   <h3>Năm dấu hiệu phân biệt thế nằm bình thường và đảo</h3>
   <div data-w="timeline" data-items='[["1. Tuổi","Dựa vào hóa thạch hoặc xác định tuổi tuyệt đối: lớp trẻ hơn phải nằm trên. Nếu lớp cổ hơn lại nằm trên thì thế nằm đảo."],["2. Hố, lõm ở mặt bào mòn","Trên mặt bào mòn của lớp có những hố, lõm (thấu kính) chứa vật liệu vụn thô như cuội. Vật liệu thô lấp vào hố từ phía trên: hố mở về phía nóc lớp bình thường."],["3. Phân lớp xiên chéo","Các lớp xiên bị cắt cụt ở phía nóc (bị bào mòn) và uốn cong thoải dần, tiếp xúc tiệm cận với mặt đáy lớp; nhìn hình dạng đó để biết đâu là nóc, đâu là đáy."],["4. Vết nứt nguyên sinh, dấu vết sinh vật, dấu hạt mưa","Vết nứt bùn khô (nứt nẻ nguyên sinh) hở rộng ở phía trên và thu hẹp nhọn dần xuống dưới; dấu vết sinh vật và dấu hạt mưa in trên mặt lớp bên dưới. Nếu vết nứt hở về phía dưới thì lớp đã bị lộn ngược."],["5. Bọt khí trong đá phun trào","Magma phun trào tiếp xúc không khí, nguội nhanh nên bọt khí thường tập trung ở bề mặt trên của lớp dung nham."]]'></div>
   <div class="warn"><b>Lưu ý</b>Chỉ dùng một dấu hiệu là chưa chắc chắn; nên đối chiếu nhiều dấu hiệu. Dấu hiệu tuổi (hóa thạch, tuổi tuyệt đối) là cơ sở chắc chắn nhất.</div>` },

  { id: 'ranh-gioi', title: '7. Vẽ ranh giới địa chất một mặt lớp', html: `
   <p>Đây là ví dụ tổng hợp: biết ba điểm của một mặt lớp (một ranh giới) cùng cao độ, ta vẽ vết lộ của nó trên bản đồ địa hình như sau.</p>
   <ol>
    <li>Cho ba điểm A (150 m), B (170 m), C (210 m) trên bản đồ có đường đồng mức. Nối ba điểm thành tam giác.</li>
    <li>Nội suy trên các cạnh để tìm các điểm có cao độ tròn (160, 170, 180, 190, 200 m…). Nối các điểm cùng cao độ: đó là các <b>đường phương</b> của mặt lớp (song song và cách đều nhau, vì mặt lớp là mặt phẳng).</li>
    <li>Trên bản đồ, đánh dấu các giao điểm của đường phương có cao độ x với đường đồng mức địa hình cùng cao độ x. Đó là những điểm mà mặt lớp cắt địa hình.</li>
    <li>Nối các giao điểm liên tiếp bằng đường cong trơn: đường thu được là <b>ranh giới địa chất (vết lộ)</b> của mặt lớp.</li>
   </ol>
   <div class="check"><b>Kiểm tra</b>Vết lộ phải cắt qua đúng các cặp đồng mức và đường phương cùng cao độ, và có dạng chữ V ở chỗ cắt thung lũng, sống núi (bài 5).</div>
   <p>Bước cuối của việc “đọc thế nằm từ bản đồ”: từ vết lộ, xác định đường phương (nối hai điểm cùng cao độ), hướng dốc (về phía đồng mức giảm/trầm tích trẻ) và góc dốc (bằng tan α = h/a).</p>` }
 ]

 sections: [
  { id: 'thanh-phan', title: '1. Nếp uốn và các thành phần', html: `
   <p>Sau khi đá biến dạng dẻo, các lớp vốn phẳng bị uốn cong thành nếp uốn. Để mô tả, đo đạc và so sánh, cần thống nhất các thuật ngữ hình học.</p>
   <div class="key"><b>Nếp uốn (fold)</b>Là kết quả của biến dạng dẻo: các lớp đá (hoặc các mặt có sẵn như phân lớp, phân phiến) bị uốn cong nhưng vẫn liên tục.</div>
   <div class="tw"><table><tr><th>Thuật ngữ</th><th>Ý nghĩa</th></tr>
    <tr><td>Cánh (limb)</td><td>Hai bên của nếp uốn, phần tương đối phẳng nằm giữa hai đường uốn cong nhất kế tiếp</td></tr>
    <tr><td>Bản lề / đới bản lề (hinge zone), đường bản lề (hinge line)</td><td>Phần uốn cong mạnh nhất của nếp uốn; đường bản lề nối các điểm bản lề (hinge points) trên một mặt lớp</td></tr>
    <tr><td>Trục nếp uốn (fold axis)</td><td>Đường thẳng vạch dọc theo các điểm có độ cong lớn nhất của mỗi lớp (đường bản lề, xét cho nếp trụ)</td></tr>
    <tr><td>Mặt trục (axial plane / axial surface)</td><td>Bề mặt chia nếp uốn thành hai phần đối xứng; đi qua các đường bản lề của các lớp. Giao của mặt trục với mặt đất là vết mặt trục (axial trace)</td></tr>
    <tr><td>Điểm / đường uốn (inflection point/line)</td><td>Nơi độ cong đổi dấu, nằm giữa hai bản lề kế tiếp</td></tr>
    <tr><td>Bước sóng (wavelength), biên độ (amplitude)</td><td>Khoảng cách giữa hai bản lề cùng loại kế tiếp; độ cao nửa dao động</td></tr>
    <tr><td>Góc giữa hai cánh (interlimb angle)</td><td>Góc kẹp giữa hai cánh; nhỏ nghĩa là nếp uốn chặt</td></tr>
    <tr><td>Nếp trụ / không trụ (cylindrical / non-cylindrical)</td><td>Nếp trụ có thể tạo bằng cách quét một đường thẳng song song với trục; nếp không trụ thì không</td></tr></table></div>
   <div data-w="fig" data-name="foldAnatomy" data-cap="Giải phẫu một nếp uốn trong mặt cắt: cánh, bản lề, điểm uốn, mặt trục, bước sóng, biên độ."></div>
   <h3>Nếp uốn đối xứng: trục nằm ngang hay nghiêng</h3>
   <ul><li><b>A – Nếp lồi đối xứng:</b> trục nếp uốn song song với mặt phẳng nằm ngang.</li>
   <li><b>B – Nếp lồi có trục cắm (plunging):</b> mặt trục vẫn thẳng đứng nhưng trục nếp uốn nghiêng một góc (góc cắm, plunge) so với mặt phẳng ngang. Trên bản đồ, vết lộ của các lớp quanh đầu nếp cắm khép lại thành hình chữ U hoặc chữ V.</li></ul>
   <div class="note"><b>Mở rộng</b>Nếp uốn có trục cắm, vẽ trên bản đồ nhìn xuống, cho các vết lộ khép kín ở đầu cắm: với nếp lồi cắm, các lớp cổ ở giữa và mũi chữ V chỉ theo hướng cắm; với nếp lõm cắm, mũi chữ V chỉ ngược hướng cắm.</div>` },

  { id: 'phan-loai', title: '2. Phân loại nếp uốn', html: `
   <p>Có nhiều cách phân loại, mỗi cách trả lời một câu hỏi khác nhau: nếp uốn <i>lồi hay lõm</i>, <i>đối xứng hay không</i>, <i>khép chặt hay mở</i>.</p>
   <h3>Theo hình dạng: lồi và lõm</h3>
   <div class="grid">
    <div class="mini"><h4>Nếp lồi (anticline)</h4>Tạo vòm; hai cánh dốc ra xa trục; đá cổ ở nhân (giữa), đá trẻ ở hai bên.</div>
    <div class="mini"><h4>Nếp lõm (syncline)</h4>Tạo trũng; hai cánh dốc vào phía trục; đá trẻ ở nhân, đá cổ ở hai bên.</div>
    <div class="mini"><h4>Đơn nghiêng (monocline)</h4>Nếp uốn dạng bậc thang: các lớp nằm ngang hoặc gần ngang ở hai bên bị uốn dốc ở giữa (xem bài 3).</div>
   </div>
   <div class="note"><b>Antiform / synform</b>Antiform (lồi) và synform (lõm) chỉ hình học “lồi/lõm” của nếp uốn mà không quan tâm tuổi các lớp. Anticline/syncline dùng khi biết trình tự tuổi (nếp lồi: cổ ở giữa; nếp lõm: trẻ ở giữa). Khi lớp bị đảo thì hai khái niệm có thể không trùng nhau. Trong tài liệu tiếng Anh còn có <b>neutral fold</b> (nếp uốn đóng sang bên, trục nằm ngang, không lồi cũng không lõm) và <b>vertical fold</b> (nếp trung tính mà mọi mặt lớp cắm thẳng đứng).</div>
   <h3>Theo tính đối xứng của mặt trục</h3>
   <ul>
    <li><b>Đối xứng (symmetrical):</b> mặt trục là mặt đối xứng, hai cánh dốc bằng nhau nhưng ngược chiều.</li>
    <li><b>Bất đối xứng (asymmetrical):</b> mặt trục không phải mặt đối xứng, hai cánh dốc không bằng nhau.</li>
    <li><b>Đảo (overturned):</b> một cánh bị lộn ngược, dốc quá 90°; cả hai cánh cùng dốc về một phía.</li>
   </ul>
   <div data-w="fig" data-name="foldTypes" data-cap="Bốn dạng nếp uốn: đối xứng, bất đối xứng, đảo và đơn nghiêng."></div>
   <div class="card"><h3>Dựng nếp uốn</h3><p style="margin-top:0">Chọn nếp lồi/lõm rồi chỉnh góc dốc hai cánh. Khi cánh phải &gt; 90° thì nếp uốn bị đảo.</p><div data-w="foldExplorer"></div></div>
   <div class="warn"><b>Hay nhầm</b>“Nếp lồi” không có nghĩa là địa hình lồi. Sau bào mòn, nếp lồi có thể nằm trong thung lũng và nếp lõm nằm trên đỉnh núi; hãy nhận biết bằng tuổi các lớp và hướng dốc, không bằng hình dạng địa hình.</div>
   <div class="note"><b>Mở rộng</b>Có thể mô tả độ khép của nếp uốn theo góc giữa hai cánh: thoải (180°–120°), mở (120°–70°), khép (70°–30°), chặt (30°–0°), đồng tà/isoclinal (0°, hai cánh song song).</div>` },

  { id: 'vom-bon', title: '3. Vòm, bồn trũng và đơn nghiêng', html: `
   <p>Không phải nếp uốn nào cũng kéo dài thành dải. Khi nếp uốn có dạng tròn hoặc hơi kéo dài, ta có vòm và bồn trũng.</p>
   <div class="tw"><table><tr><th></th><th>Vòm (dome)</th><th>Bồn trũng (basin)</th></tr>
    <tr><td>Hình dạng</td><td>Cấu trúc tròn hoặc hơi kéo dài; đá được nâng lên ở giữa</td><td>Cấu trúc tròn hoặc hơi kéo dài; đá võng xuống ở trung tâm</td></tr>

   <h3>Đơn nghiêng (monocline)</h3>

  { id: 'co-che', title: '4. Cơ chế hình thành: uốn gập', html: `
   <p>Vì sao một lớp phẳng lại cong thành sóng đều đặn? Cơ chế chính là <b>uốn gập (buckling)</b>.</p>
   <div class="key"><b>Điều kiện</b>1) Lớp chịu <b>rút ngắn song song với mặt lớp</b> (parallel shortening). 2) Có <b>tương phản độ nhớt (viscosity contrast)</b> giữa lớp và môi trường bao quanh (nền/matrix): lớp cứng hơn nền.</div>
   <div data-w="fig" data-name="buckling" data-cap="Uốn gập: lớp cứng nằm trong nền mềm bị rút ngắn song song với lớp và cong dần thành nếp uốn."></div>
   <p>Khi bị ép dọc theo lớp, trạng thái phẳng của lớp cứng mất ổn định: chỉ cần một nhiễu nhỏ ban đầu thì lớp bắt đầu cong, và nếp uốn phát triển theo một <b>bước sóng ưu thế</b> phụ thuộc vào bề dày lớp và tỷ số độ nhớt lớp/nền. Sự mất ổn định vật liệu này có thể tạo ra nếp uốn có nhiều bước sóng khác nhau trong cùng một đá (thấy rõ ở lớp mỏng và lớp dày xen kẽ).</p>

    <li>Lớp càng cứng hơn nền, bước sóng càng lớn so với bề dày lớp.</li>
   </ul>
   <div class="note"><b>Mở rộng</b>Ngoài uốn gập còn có các cơ chế khác như uốn cong do trượt dọc phân lớp, do chảy dẻo hoặc do đứt gãy bên dưới kéo lớp phủ cong theo (nếp uốn liên quan đứt gãy), nhưng bài giảng tập trung vào uốn gập.</div>` },

   <div data-w="filtercards" data-items='[["Phân tích ảnh viễn thám","Dùng ảnh hàng không và ảnh vệ tinh để nhận ra các dải lớp cong, vẽ vết trục nếp uốn và ranh giới lớp trước khi ra thực địa.","Gián tiếp"],["Mặt cắt địa chất","Vẽ mặt cắt từ bản đồ địa chất theo một tuyến để thấy hình dạng nếp uốn theo chiều sâu.","Bản đồ"],["Khảo sát địa vật lý","Tuyến địa chấn phản xạ cho hình ảnh các mặt phản xạ (ranh giới lớp) uốn cong dưới sâu, dùng để dựng nếp uốn và đứt gãy trong thăm dò dầu khí.","Gián tiếp"],["Đo thế nằm của đá","Đo thế nằm tại nhiều điểm lộ liên tiếp: chuỗi góc dốc thay đổi chiều cho thấy vị trí trục nếp lồi, nếp lõm và độ dốc hai cánh.","Thực địa"],["Khoan địa chất","Các lỗ khoan cho vị trí nóc/đáy các lớp tại từng điểm; nối các điểm để dự báo hình dạng lớp. Nhiều khả năng nối vỉa: nếp uốn, thấu kính hoặc bị đứt gãy cắt.","Thực địa"],["Dự báo từ khoan và thế nằm","Kết hợp số đo thế nằm với tài liệu khoan để dự báo hình dạng nếp uốn ở nơi chưa có lộ hoặc chưa khoan.","Tổng hợp"]]'></div>

 sections: [
  { id: 'khe-nut', title: '1. Khe nứt', html: `
   <p>Nứt là dạng phá huỷ “nhỏ” và phổ biến nhất của đá. Bài này gom các khái niệm về khe nứt để phân biệt với đứt gãy.</p>
   <div class="key"><b>Khe nứt (fracture)</b>Là mặt gián đoạn (discontinuity) trong đá có <b>độ dịch chuyển hạn chế</b>. Nếu dịch chuyển đủ lớn để nhận thấy và có ý nghĩa cấu trúc thì gọi là đứt gãy (bài 2).</div>
   <h3>Khe nứt tách (extension fracture)</h3>
   <p>Các khối kề nhau dịch chuyển <b>vuông góc</b> với mặt nứt, tức là rời xa nhau theo phương của <b>ứng suất nhỏ nhất (σ₃)</b>; mặt nứt song song với phương ứng suất lớn nhất (σ₁). Khe nứt tách thường được lấp bằng khoáng vật (thạch anh, calcit…) thành mạch. Khi nhiều khe nứt tách xếp so le nhau theo hàng, ta gọi là <b>dãy xếp bậc (en échelon)</b>; dãy này cho biết hướng cắt của đới ứng suất.</p>
   <h3>Khe nứt stylolite</h3>
   <ul>
    <li>Là mặt gián đoạn hình thành từ cơ chế biến dạng <b>hoà tan do áp suất (pressure-solution)</b>.</li>
    <li>Hình thành nhờ sự hoà tan dọc theo bề mặt khe nứt khi ứng suất nén tác dụng vuông góc với mặt đó.</li>
    <li>Thường <b>sẫm màu</b> hơn đá chủ vì hạt không hoà tan bao oxit sắt tích tụ lại. Trên mặt cắt, khe nứt có dạng răng cưa (các nón nhọn).</li>
    <li>Các nón răng cưa luôn chỉ về <b>hướng của ứng suất lớn nhất</b>.</li>
   </ul>
   <div class="note"><b>Mở rộng</b>Bài giảng nêu “hai loại khe nứt” nhưng chi tiết chỉ giới thiệu loại thứ nhất (khe nứt tách). Loại còn lại trong phân loại chuẩn là <b>khe nứt cắt (shear fracture)</b>: hai khối dịch chuyển <i>song song</i> với mặt nứt; khi dịch chuyển lớn thì đó là đứt gãy.</div>` },

  { id: 'dut-gay', title: '2. Đứt gãy: khái niệm và phân loại', html: `
   <p>Khi đá phá huỷ và các khối hai bên mặt nứt trượt qua nhau một khoảng đáng kể thì có <b>đứt gãy</b>.</p>
   <div class="key"><b>Đứt gãy (fault)</b>Bề mặt phá huỷ/đới nứt kéo dài mà dọc theo đó đá dịch chuyển. Chuyển động nhanh dọc đứt gãy có thể gây <b>động đất</b>.</div>
   <h3>Các yếu tố</h3>
   <ul>
    <li><b>Mặt đứt gãy (fault plane):</b> mặt dọc theo đó xảy ra dịch chuyển; có đường phương, hướng dốc, góc dốc như mặt lớp (chương 2).</li>
    <li><b>Vách treo (hanging wall):</b> khối nằm <i>phía trên</i> mặt đứt gãy. <b>Vách nằm (footwall):</b> khối nằm <i>phía dưới</i> mặt đứt gãy.</li>
   </ul>
   <h3>Phân loại theo dịch chuyển tương đối</h3>
   <p>Dịch chuyển có thể theo phương đứng, ngang hoặc hỗn hợp:</p>
   <div class="tw"><table><tr><th>Loại</th><th>Dịch chuyển</th><th>Ứng suất chủ đạo</th></tr>

    <tr><td>Đứt gãy nghịch (reverse) / chờm nghịch (thrust)</td><td>Vách treo trượt <b>lên</b> so với vách nằm</td><td>Ép</td></tr>

  { id: 'ba-loai', title: '3. Thuận – nghịch – bằng', html: `
   <p>Ba loại chính có hình học và bối cảnh kiến tạo khác nhau.</p>
   <div data-w="fig" data-name="faultTypes" data-cap="Ba loại đứt gãy chính: thuận, nghịch (mặt cắt) và bằng phải (bình đồ)."></div>
   <h3>Đứt gãy thuận (normal fault)</h3>
   <p>Hình thành do <b>ứng suất kéo</b>, vỏ bị kéo giãn. Vách treo trượt xuống. Khi nhiều đứt gãy thuận xuất hiện cạnh nhau thì tạo <b>địa luỹ (horst)</b> – phần nâng cao – xen với <b>địa hào (graben)</b> – phần sụt thấp, cùng các bán địa hào (half graben). Ví dụ điển hình: vùng Basin and Range (Bắc Mỹ), nơi vỏ bị kéo giãn khi mảng Bắc Mỹ trườn lên mảng Thái Bình Dương đang chìm.</p>
   <div data-w="fig" data-name="horstGraben" data-cap="Các đứt gãy thuận kề nhau tạo địa luỹ và địa hào xen kẽ."></div>
   <h3>Đứt gãy nghịch (reverse fault) và chờm nghịch</h3>
   <p>Hình thành do <b>ứng suất ép</b>, vỏ rút ngắn và dày lên. Vách treo bị đẩy lên. Khi mặt đứt gãy rất thoải (góc cắm &lt; 15° theo cách nêu trong bài) ta có <b>đứt gãy chờm nghịch (overthrust)</b>; đá có thể bị chờm đi hàng chục km. Ví dụ Lewis Overthrust gần Vườn quốc gia Glacier: đá Tiền Cambri cổ chờm lên trên đá Creta trẻ hơn nhiều.</p>

   <h3>Đứt gãy bằng (strike-slip fault)</h3>
   <p>Dịch chuyển chủ yếu theo phương ngang, song song với đường phương đứt gãy. Cách gọi phải/trái:</p>
   <div class="grid">
    <div class="mini"><h4>Bằng phải (right-lateral / dextral)</h4>Đứng ở một bên nhìn sang: khối đối diện dịch chuyển về phía <b>bên phải</b>.</div>
    <div class="mini"><h4>Bằng trái (left-lateral / sinistral)</h4>Đứng ở một bên nhìn sang: khối đối diện dịch chuyển về phía <b>bên trái</b>.</div>
   </div>
   <p>Cách xác định này cho cùng một kết quả dù bạn đứng ở bên nào. Ví dụ: đứt gãy San Andreas (bằng phải), khu vực hồ Mead (nam Nevada).</p>` },

  { id: 'nhan-biet', title: '4. Nhận biết đứt gãy và khoảng dịch chuyển', html: `
   <p>Ngoài thực địa, đứt gãy không luôn hiện rõ. Phải dựa vào dấu hiệu gián tiếp.</p>
   <h3>Dấu hiệu nhận biết</h3>
   <div data-w="timeline" data-items='[["Lớp bị cắt và dịch chuyển","Một tập lớp đánh dấu bị cắt đứt đột ngột, hai bên dịch lệch nhau: đo được khoảng cách dịch chuyển bằng cách nối lại lớp chuẩn ở hai bên. Xác định loại đứt gãy từ chiều dịch chuyển của vách treo."],["Địa hình dạng tuyến","Thung lũng thẳng (linear valley), vách dốc thẳng tắp, sườn thềm; chứng tỏ có đới nứt yếu bị xói mòn."],["Sông suối bị lệch","Dòng chảy bị cắt và dịch chuyển (offset drainage) khi đi qua đứt gãy bằng."],["Ao sụt (sag pond) và vết đứt gãy hoạt động","Vũng nước tích tụ trong chỗ sụt dọc đứt gãy bằng; vết đứt gãy hoạt động (active traces) khác vết đã ngừng hoạt động (inactive)."],["Chờm đá cổ lên đá trẻ","Trên mặt cắt, đá cổ nằm trên đá trẻ mà không phải thế nằm đảo: dấu hiệu đứt gãy chờm nghịch."],["Bản đồ đứt gãy khu vực","Ở quy mô lớn (ví dụ bản đồ đứt gãy Việt Nam) các đứt gãy được phân cấp I, II, III kèm các đới phát sinh động đất."]]'></div>
   <div class="note"><b>Quy trình xác định trên ảnh mặt cắt</b>(1) Tìm lớp chuẩn bị cắt; (2) xác định khối lên/xuống (thuận hay nghịch) hay trượt ngang (bằng); (3) đo khoảng dịch chuyển bằng cách nối lại lớp chuẩn hai bên; (4) xét mặt đứt gãy dốc về phía nào để biết đâu là vách treo.</div>
   <p>Sau khi xác định đường phương, hướng dốc, góc dốc của mặt đứt gãy (chương 2) và chiều dịch chuyển của vách treo, bạn có thể gọi tên loại đứt gãy và biểu diễn lên bản đồ bằng ký hiệu đứt gãy kèm vạch dốc.</p>` },

   <p>Khe nứt và đứt gãy quyết định ổn định của mái dốc đá. Ví dụ tính toán dưới đây dùng phép chiếu lập thể (stereographic projection).</p>
   <div class="tw"><table><tr><th>Yếu tố</th><th>Giá trị</th></tr>
    <tr><td>Hệ khe nứt 1</td><td>Đường phương N32°E, góc dốc 65° về phía tây (W)</td></tr>

   <p>Giao tuyến của hai mặt cắt đá thành một <b>nêm</b>. Trong phân tích ổn định, nêm có khả năng trượt dọc giao tuyến khi giao tuyến cắm dốc hơn góc ma sát (28° &gt; 25°) và lộ ra ngoài mái dốc (“daylight”). Ở đây góc cắm giao tuyến lớn hơn ma sát nên có nguy cơ trượt nêm nếu mái dốc cắt qua giao tuyến.</p>

  { id: 'tuong-doi', title: '2. Kế tục, nằm ngang, liên tục, xuyên cắt', html: `
   <h3>Tính kế tục địa tầng – Steno (1638–1686)</h3>
   <p>Trong chuỗi chưa bị đảo lộn, đá cổ nhất ở dưới cùng. Nguyên tắc này là cơ sở để sắp xếp tuổi tương đối của trầm tích.</p>
   <h3>Lớp nằm ngang nguyên thuỷ – Steno</h3>
   <p>Lớp trầm tích lắng đọng theo trọng lực nên ban đầu gần như nằm ngang (có ngoại lệ như trầm tích lắng trên sườn dốc hoặc cồn cát). Vì vậy khi thấy lớp nghiêng, lớp đã bị nâng, nghiêng hoặc uốn sau khi thành tạo (chương 4, 5).</p>
   <h3>Tính liên tục theo phương ngang</h3>
   <p>Một lớp lắng đọng rồi trải rộng đến khi <b>thu hẹp dần ở rìa bồn</b> hoặc <b>chuyển tướng sang loại trầm tích khác</b>. Nếu sau đó sông cắt qua tạo thung lũng, hai bên vẫn là cùng một lớp: nhờ vậy nối được lớp ở hai bờ.</p>
   <h3>Quan hệ xuyên cắt – Hutton (1726–1797)</h3>
   <p>Thể địa chất cắt qua thể khác thì <b>trẻ hơn</b> thể bị cắt: mạch đá, khối xâm nhập, đứt gãy, bề mặt bào mòn đều trẻ hơn những gì chúng cắt qua.</p>
   <div data-w="fig" data-name="crossCut" data-cap="Mặt cắt minh hoạ quan hệ xuyên cắt: mỗi thể địa chất trẻ hơn những gì nó cắt qua hoặc phủ lên."></div>
   <div class="card"><h3>Ví dụ: sắp xếp từ trẻ đến cổ</h3>
    <p>Khối lập phương có: A – tầng đá uốn nếp; B – khối xâm nhập; C – đá trầm tích; D – đá mạch (dyke); E – đá trầm tích; F – đứt gãy thuận.</p>
    <div data-w="timeline" data-items='[["Bước 1 – F trẻ nhất","Đứt gãy thuận F cắt qua A, B, C (và theo hình cả lớp trầm tích trên cùng E) ⇒ F trẻ hơn tất cả những gì nó cắt."],["Bước 2 – E","Lớp trầm tích E nằm phủ lên C và mạch D ⇒ E trẻ hơn C và D."],["Bước 3 – D","Mạch D cắt xuyên qua A, B và C ⇒ D trẻ hơn A, B, C, nhưng cổ hơn E."],["Bước 4 – C","Lớp trầm tích C nằm phủ trên mặt bào mòn cắt cụt A và B ⇒ C trẻ hơn A và B."],["Bước 5 – B","Khối xâm nhập B cắt qua tầng đá uốn nếp A ⇒ B trẻ hơn A."],["Đáp án: F, E, D, C, B, A","Thứ tự từ trẻ đến cổ. Tầng đá uốn nếp A cổ nhất."]]'></div></div>
   <div class="note"><b>Xác định hướng dịch chuyển của đứt gãy trên ảnh mặt cắt</b>(1) Tìm một lớp chuẩn bị cắt; (2) xem khối nào đi xuống hoặc lên so với lớp chuẩn; (3) nếu vách treo trượt xuống thì là đứt gãy thuận, trượt lên là nghịch; nếu lớp chuẩn lệch ngang trên bình đồ thì là đứt gãy bằng.</div>` },

  { id: 'bat-chinh-hop', title: '3. Bất chỉnh hợp', html: `
   <p>Bất chỉnh hợp là “trang giấy bị xé” trong nhật ký địa chất: một khoảng thời gian không có ghi chép (không lắng đọng hoặc đã bị bào mòn).</p>
   <div class="key"><b>Bất chỉnh hợp (unconformity)</b>Là bề mặt bào mòn hoặc gián đoạn trầm tích bị chôn vùi, ngăn cách hai khối đá hoặc hai tập lớp có tuổi khác nhau, chứng tỏ sự lắng đọng không liên tục. Có ba kiểu.</div>
   <div class="tw"><table><tr><th>Kiểu</th><th>Đặc điểm</th><th>Hình thành</th></tr>
    <tr><td><b>Bất chỉnh hợp góc</b><br>(angular unconformity)</td><td>Các lớp bên dưới nghiêng/uốn nếp và bị cắt cụt, các lớp phủ trên nằm ngang hoặc nghiêng khác góc</td><td>Lắng đọng A, B, C → nâng, nghiêng, uốn nếp và bào mòn → hạ thấp, lắng đọng F, G</td></tr>
    <tr><td><b>Giả chỉnh hợp</b><br>(disconformity)</td><td>Các lớp trên và dưới song song nhau, nhưng ngăn cách bởi mặt bào mòn (thiếu lớp)</td><td>Lắng đọng 1–4 → nâng và bào mòn 3, 4 → hạ thấp, lắng đọng 6, 7</td></tr>
    <tr><td><b>Không chỉnh hợp</b><br>(nonconformity)</td><td>Trầm tích phủ trực tiếp lên đá magma xâm nhập hoặc đá biến chất bị bào mòn</td><td>Đá magma/biến chất lộ ra, bị bào mòn → hạ thấp, lắng đọng trầm tích P, Q phủ lên</td></tr></table></div>
   <div data-w="fig" data-name="unconform" data-cap="Ba kiểu bất chỉnh hợp và cuội kết cơ sở."></div>
   <h3>Cuội kết cơ sở (basal conglomerate)</h3>
   <p>Là tầng cuội kết nằm ngay trên mặt bất chỉnh hợp, gồm mảnh vụn của đá bên dưới bị bào mòn. Nó là dấu hiệu nhận ra bất chỉnh hợp ngoài thực địa; ví dụ lộ ở Phan Sơn, Bắc Bình, Bình Thuận.</p>
   <div class="card"><h3>Ví dụ: cấu trúc bất chỉnh hợp góc hình thành thế nào?</h3>
   <div data-w="timeline" data-items='[["A. Lắng đọng","Các lớp trầm tích 1, 2, 3, … lắng đọng nằm ngang dưới biển."],["B. Nâng lên và uốn nếp","Chịu ép, các lớp bị uốn nếp và nâng lên khỏi mực biển."],["C. Bào mòn","Phần đỉnh nếp uốn bị bào mòn, tạo mặt cắt cụt các lớp."],["D. Hạ thấp và lắng đọng lại","Vùng hạ thấp dưới mực biển, các lớp mới 6, 7… lắng đọng nằm ngang phủ lên mặt bào mòn. Kết quả là bất chỉnh hợp góc."]]'></div></div>
   <div class="warn"><b>Ý nghĩa</b>Khi vẽ mặt cắt, không được “nối liền” các lớp qua bất chỉnh hợp: hai bên chênh nhau về tuổi và lịch sử biến dạng.</div>` },

  { id: 'bat-tu-dong-vat', title: '4. Bắt tù & kế tục động vật', html: `
   <h3>Quan hệ bắt tù (law of included fragments)</h3>
   <p>Mảnh đá bị bao bọc trong đá khác thì <b>già hơn</b> đá bao quanh, vì chúng phải tồn tại trước khi bị bao lấy.</p>
   <div class="card"><h3>Ví dụ: đá nào cổ hơn, granit hay cát kết?</h3>
   <div data-w="timeline" data-items='[["Trường hợp A","Các mảnh granit nằm trong cát kết (trầm tích nằm ở trên, mảnh granit bị vùi trong đó) ⇒ <b>granit cổ hơn</b> cát kết."],["Trường hợp B","Các mảnh cát kết nằm trong granit ⇒ <b>cát kết cổ hơn</b>; granit xâm nhập sau, bao lấy mảnh cát kết."]]'></div></div>
   <h3>Kế tục động vật (law of faunal succession)</h3>
   <p>Các dạng hoá thạch cổ thường đơn giản hơn dạng trẻ, và dạng trẻ càng giống dạng hiện nay. Mỗi nhóm hoá thạch xuất hiện, tiến hoá rồi tuyệt chủng theo một trật tự nhất định, nên hoá thạch giống nhau chứng tỏ các lớp có cùng tuổi dù ở cách xa hàng dặm.</p>
   <div class="key"><b>Đối sánh (liên kết) các cột địa tầng</b>Tìm các lớp chứa cùng hoá thạch chỉ thị ở hai cột, rồi nối chúng lại. Chỗ nào thiếu lớp nghĩa là có bất chỉnh hợp hoặc lớp bị bào mòn. Ví dụ điển hình: liên kết hai cột địa tầng ở hai nơi cách xa nhau bằng hoá thạch.</div>` },

<script>
/* Thư viện hình tương tác dùng chung. Gắn vào trang bằng <div data-w="tên"></div>.
   Thêm widget riêng cho từng môn: W.tenMoi = el => { ... }  (xem các mẫu bên dưới). */
const W = {};
const D2R = Math.PI / 180;
function ink() { return getComputedStyle(document.body).color; }
function mk(el, html) { el.innerHTML = html; return el; }
function q(el, s) { return el.querySelector(s); }
function qa(el, s) { return [...el.querySelectorAll(s)]; }
function slider(id, label, min, max, step, val, unit) {
  return `<label class="lab"><span style="min-width:120px">${label}</span><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"><span class="val" id="${id}v">${val}${unit || ''}</span></label>`;
}
function bindSlider(el, id, fn, unit) {
  const s = q(el, '#' + id), v = q(el, '#' + id + 'v');
  s.addEventListener('input', () => { v.textContent = s.value + (unit || ''); fn(+s.value); });
  return s;
}
function mountWidgets(root) {
  qa(root, '[data-w]').forEach(el => {
    if (el.dataset.mounted) return; el.dataset.mounted = 1;
    const f = W[el.dataset.w]; if (f) try { f(el); } catch (e) { el.textContent = 'Lỗi hình: ' + e.message; console.error(e); }
  });
}
// Xoay 3D bằng chuột: rotXY(điểm,[rx],[ry]) + drag3(canvas, state, vẽLại)
function rotXY(p, rx, ry) {
  let [x, y, z] = p;
  const cy = Math.cos(ry), sy = Math.sin(ry); [x, z] = [x * cy + z * sy, -x * sy + z * cy];
  const cx = Math.cos(rx), sx = Math.sin(rx); [y, z] = [y * cx - z * sx, y * sx + z * cx];
  return [x, y, z];
}
function drag3(c, st, redraw) {
  let d = null;
  c.addEventListener('pointerdown', e => { d = [e.clientX, e.clientY]; c.setPointerCapture(e.pointerId); });
  c.addEventListener('pointermove', e => { if (!d) return; st.ry += (e.clientX - d[0]) * .01; st.rx += (e.clientY - d[1]) * .01; d = [e.clientX, e.clientY]; redraw(); });
  c.addEventListener('pointerup', () => d = null);
  c.style.cursor = 'grab'; c.style.touchAction = 'none';
}
// Vòng lặp hoạt hình an toàn: tự dừng khi widget bị gỡ khỏi trang (đổi bài)
function loop(el, fn) { const t = () => { if (!el.isConnected) return; fn(); requestAnimationFrame(t); }; t(); }

/* ---- Mẫu 1: dòng thời gian / danh sách bấm để mở (dữ liệu trong thuộc tính data-items dạng JSON: [["Tiêu đề","Chi tiết"],...]) ---- */
W.timeline = el => {
  const items = JSON.parse(el.dataset.items || '[]');
  mk(el, `<div class="tl">${items.map((x, i) => `<div class="ev ${i === 0 ? 'open' : ''}"><b>${x[0]}</b><div class="d">${x[1]}</div></div>`).join('')}</div>`);
  qa(el, '.ev').forEach(e => e.onclick = () => e.classList.toggle('open'));
};
/* ---- Mẫu 2: thẻ có lọc theo nhóm: data-items = [["Tiêu đề","Mô tả","Nhóm"],...] ---- */
W.filtercards = el => {
  const A = JSON.parse(el.dataset.items || '[]'), tags = ['Tất cả', ...new Set(A.map(a => a[2]))];
  mk(el, `<div class="mtab">${tags.map((t, i) => `<button class="${i ? '' : 'on'}" data-t="${t}">${t}</button>`).join('')}</div><div class="grid" id="fg"></div>`);
  const draw = t => q(el, '#fg').innerHTML = A.filter(a => t === 'Tất cả' || a[2] === t).map(a => `<div class="mini"><h4>${a[0]}</h4><span style="font-size:14px">${a[1]}</span></div>`).join('');
  draw('Tất cả');
  qa(el, '.mtab button').forEach(b => b.onclick = () => { qa(el, '.mtab button').forEach(x => x.classList.toggle('on', x === b)); draw(b.dataset.t); });
};
/* ---- Mẫu 3: máy tính có thanh trượt + canvas (sao chép làm khuôn cho mô phỏng mới) ---- */
W.demoSlider = el => {
  mk(el, `<canvas width="560" height="200" style="width:100%"></canvas>` + slider('k', 'Giá trị', 0, 100, 1, 40, '') + `<div class="res" id="out"></div>`);
  const g = q(el, 'canvas').getContext('2d');
  const draw = v => { g.clearRect(0, 0, 560, 200); g.fillStyle = '#1f5fbf'; g.fillRect(20, 80, v * 5, 40); q(el, '#out').textContent = 'Giá trị = ' + v; };
  bindSlider(el, 'k', draw); draw(40);
};

<script>
/* Widget riêng cho môn Địa chất kiến trúc & Đo vẽ bản đồ địa chất */
const COMPASS8 = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
const mod = (a, n) => ((a % n) + n) % n;
const vec = az => [Math.sin(az * D2R), -Math.cos(az * D2R)]; // phương vị -> hướng trên canvas (bắc ở trên)
function num(el, id) { return +q(el, '#' + id).value; }
function arrow(g, x1, y1, x2, y2, col, w) {
  g.strokeStyle = g.fillStyle = col; g.lineWidth = w || 2;
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
  const a = Math.atan2(y2 - y1, x2 - x1), h = 9;
  g.beginPath(); g.moveTo(x2, y2); g.lineTo(x2 - h * Math.cos(a - .4), y2 - h * Math.sin(a - .4)); g.lineTo(x2 - h * Math.cos(a + .4), y2 - h * Math.sin(a + .4)); g.closePath(); g.fill();
}
function txt(g, s, x, y, col, size, al) { g.fillStyle = col || ink(); g.font = (size || 13) + 'px Segoe UI,sans-serif'; g.textAlign = al || 'left'; g.fillText(s, x, y); }
function quadName(dd) { dd = mod(Math.round(dd), 360); if (dd % 90 === 0) return ['N', 'E', 'S', 'W'][dd / 90]; return (dd < 90 || dd > 270 ? 'N' : 'S') + (dd < 180 ? 'E' : 'W'); }
function strikeQuad(s) { s = mod(Math.round(s), 180); return s === 0 ? 'N–S' : s === 90 ? 'E–W' : (s < 90 ? 'N' + s + '°E' : 'N' + (180 - s) + '°W'); }
function fmtAge(y) { return y >= 1e9 ? (y / 1e9).toFixed(2) + ' Ga (tỉ năm)' : y >= 1e6 ? (y / 1e6).toFixed(1) + ' Ma (triệu năm)' : y >= 1e3 ? (y / 1e3).toFixed(1) + ' ka (nghìn năm)' : y.toFixed(0) + ' năm'; }

/* ---------- Ch1: ba kiểu ranh giới mảng ---------- */
W.plates = el => {
  const T = {
    div: ['Tách giãn (phân kỳ)', 'Hai mảng tách xa nhau, magma (bazan) trồi lên lấp khe hở, tạo vỏ đại dương mới. Ví dụ: sống núi giữa đại dương; tách giãn trên lục địa (Đông Phi) có thể phát triển thành mở biển (Biển Đỏ, vịnh Aden). Ứng suất chủ đạo: kéo.'],
    conv: ['Hội tụ (hút chìm)', 'Hai mảng tiến lại gần nhau. Thạch quyển đại dương nặng hơn bị hút chìm xuống dưới, sinh rãnh đại dương và cung núi lửa (Andes – hút chìm đại dương/lục địa; Ryukyu – đại dương/đại dương). Khi hai thạch quyển lục địa va nhau (Ấn Độ – Á-Âu) không bên nào chìm hẳn, đá bị ép nhăn thành dãy núi. Ứng suất chủ đạo: ép.'],
    trans: ['Chuyển dạng (trượt bằng)', 'Hai mảng trượt ngang qua nhau, không tạo cũng không huỷ vỏ; hướng dịch chuyển bị đổi tại đứt gãy chuyển dạng (ví dụ đứt gãy San Andreas). Ứng suất chủ đạo: cắt.']
  };
  mk(el, `<div class="mtab">${Object.keys(T).map((k, i) => `<button data-k="${k}" class="${i ? '' : 'on'}">${T[k][0]}</button>`).join('')}</div><canvas width="600" height="230" style="width:100%"></canvas><div class="res" id="d"></div>`);
  const c = q(el, 'canvas'), g = c.getContext('2d');
  function draw(k) {
    const I = ink(); g.clearRect(0, 0, 600, 230);
    if (k === 'div') {
      g.fillStyle = '#c9b48a'; g.fillRect(20, 60, 250, 40); g.fillRect(330, 60, 250, 40);
      g.fillStyle = '#8a8f9c'; g.fillRect(20, 100, 250, 50); g.fillRect(330, 100, 250, 50);
      g.fillStyle = '#e0651f'; g.beginPath(); g.moveTo(270, 60); g.lineTo(330, 60); g.lineTo(330, 175); g.lineTo(270, 175); g.fill();
      arrow(g, 250, 40, 150, 40, I); arrow(g, 350, 40, 450, 40, I);
      txt(g, 'Magma', 278, 125, '#fff', 13); txt(g, 'Thạch quyển', 90, 132, '#fff'); txt(g, 'Thạch quyển', 400, 132, '#fff'); txt(g, 'Quyển mềm', 250, 205, I);
    } else if (k === 'conv') {
      g.fillStyle = '#4b83c3'; g.fillRect(20, 60, 260, 22);
      g.fillStyle = '#c9b48a'; g.fillRect(300, 45, 280, 37);
      g.fillStyle = '#8a8f9c'; g.beginPath(); g.moveTo(20, 82); g.lineTo(280, 82); g.lineTo(440, 200); g.lineTo(400, 215); g.lineTo(280, 105); g.lineTo(20, 105); g.fill();
      g.fillRect(300, 82, 280, 40);
      g.fillStyle = '#d24545'; g.beginPath(); g.moveTo(450, 45); g.lineTo(470, 15); g.lineTo(490, 45); g.fill();
      arrow(g, 60, 40, 160, 40, I); arrow(g, 560, 25, 480, 25, I);
      txt(g, 'Vỏ đại dương', 40, 55, I, 12); txt(g, 'Cung núi lửa', 500, 15, I, 12, 'left'); txt(g, 'Rãnh', 262, 50, I, 12); txt(g, 'Mảng chìm', 330, 190, I, 12);
    } else {
      g.fillStyle = '#c9b48a'; g.fillRect(40, 30, 240, 90); g.fillRect(320, 110, 240, 90);
      g.strokeStyle = '#d24545'; g.lineWidth = 3; g.beginPath(); g.moveTo(300, 15); g.lineTo(300, 215); g.stroke();
      arrow(g, 160, 100, 160, 45, I, 3); arrow(g, 440, 130, 440, 185, I, 3);
      txt(g, 'Nhìn từ trên xuống (bắc ở trên)', 40, 20, I, 12); txt(g, 'Đứt gãy chuyển dạng', 306, 30, '#d24545', 12);
    }
    q(el, '#d').innerHTML = '<b>' + T[k][0] + '.</b> ' + T[k][1];
  }
  qa(el, '.mtab button').forEach(b => b.onclick = () => { qa(el, '.mtab button').forEach(x => x.classList.toggle('on', x === b)); draw(b.dataset.k); });
  draw('div');
};

/* ---------- Ch1: đường cong ứng suất – biến dạng ---------- */
W.stressStrain = el => {
  mk(el, `<canvas width="600" height="300" style="width:100%"></canvas>` + slider('e', 'Biến dạng (strain)', 0, 100, 1, 20, '%') +
    `<label class="lab"><input type="checkbox" id="rel"> Thôi tác dụng lực (nhả tải)</label><div class="res" id="o"></div>`);
  const g = q(el, 'canvas').getContext('2d'), EL = 30, FR = 100;
  const S = e => e <= EL ? 2 * e : 60 + 25 * (1 - Math.exp(-(e - EL) / 25));
  const X = e => 60 + e * 5, Y = s => 260 - s * 2.6;
  function draw() {
    const e = num(el, 'e'), rel = q(el, '#rel').checked, I = ink(); g.clearRect(0, 0, 600, 300);
    g.strokeStyle = I; g.lineWidth = 1.5; g.beginPath(); g.moveTo(60, 20); g.lineTo(60, 260); g.lineTo(570, 260); g.stroke();
    txt(g, 'Ứng suất', 8, 18, I, 12); txt(g, 'Biến dạng →', 500, 282, I, 12);
    g.lineWidth = 3; g.strokeStyle = '#1b9a5b'; g.beginPath(); g.moveTo(X(0), Y(0)); g.lineTo(X(EL), Y(S(EL))); g.stroke();
    g.strokeStyle = '#e8912d'; g.beginPath(); for (let k = EL; k <= FR; k++) g[k === EL ? 'moveTo' : 'lineTo'](X(k), Y(S(k))); g.stroke();
    txt(g, 'Đàn hồi', 90, 190, '#1b9a5b', 13); txt(g, 'Dẻo', 320, Y(S(65)) - 12, '#e8912d', 13);
    g.fillStyle = '#d24545'; g.beginPath(); g.arc(X(FR), Y(S(FR)), 5, 0, 7); g.fill(); txt(g, 'Phá huỷ', X(FR) - 55, Y(S(FR)) - 10, '#d24545', 13);
    g.strokeStyle = I; g.setLineDash([4, 4]); g.beginPath(); g.moveTo(X(EL), Y(S(EL))); g.lineTo(X(EL), 260); g.stroke(); g.setLineDash([]);
    txt(g, 'giới hạn đàn hồi', X(EL) - 40, 276, I, 11);
    let msg, perm = 0;
    const s = S(e);
    g.fillStyle = '#1f5fbf'; g.beginPath(); g.arc(X(e), Y(s), 6, 0, 7); g.fill();
    if (rel) {
      perm = e <= EL ? 0 : e - s / 2;
      g.strokeStyle = '#1f5fbf'; g.setLineDash([5, 4]); g.lineWidth = 2; g.beginPath(); g.moveTo(X(e), Y(s)); g.lineTo(X(perm), Y(0)); g.stroke(); g.setLineDash([]);
      g.fillStyle = '#1f5fbf'; g.beginPath(); g.arc(X(perm), Y(0), 5, 0, 7); g.fill();
    }
    if (e <= EL) msg = 'Vùng <b>đàn hồi</b>: bỏ lực đá trở về hình dạng, kích thước gần như ban đầu' + (rel ? ' (biến dạng dư = 0).' : '.');
    else if (e < FR) msg = 'Đã vượt giới hạn đàn hồi: vùng <b>biến dạng dẻo</b> (ductile) – đá chảy/uốn nếp mà chưa nứt' + (rel ? '. Nhả tải chỉ hồi phục phần đàn hồi, còn lại <b>biến dạng dư ≈ ' + perm.toFixed(0) + '%</b> là vĩnh viễn.' : '.');
    else msg = 'Đến điểm <b>phá huỷ</b> (brittle): đá nứt gãy – tạo khe nứt, đứt gãy.';

/* ---------- Ch3: nội suy đường đồng mức ---------- */
W.contour = el => {
  mk(el, `<div class="mtab"><button id="pre">Ví dụ: điểm 345 và 209, khoảng cao đều 50</button></div>` +
    slider('za', 'Cao độ điểm A', 0, 500, 1, 345, ' m') + slider('zb', 'Cao độ điểm B', 0, 500, 1, 209, ' m') +
    `<label class="lab"><span style="min-width:120px">Khoảng cao đều</span><select id="ci"><option>10</option><option>20</option><option selected>50</option><option>100</option></select></label>` +
    slider('L', 'Khoảng cách A–B', 20, 100, 1, 100, ' mm') + `<canvas width="600" height="130" style="width:100%"></canvas><div class="res" id="o"></div>`);
  const g = q(el, 'canvas').getContext('2d');
  function draw() {
    const za = num(el, 'za'), zb = num(el, 'zb'), ci = +q(el, '#ci').value, L = num(el, 'L'), I = ink(); g.clearRect(0, 0, 600, 130);
    const x0 = 50, x1 = 550, y = 70;
    g.strokeStyle = I; g.lineWidth = 3; g.beginPath(); g.moveTo(x0, y); g.lineTo(x1, y); g.stroke();
    g.fillStyle = '#1f5fbf'; [x0, x1].forEach(x => { g.beginPath(); g.arc(x, y, 7, 0, 7); g.fill(); });
    txt(g, 'A ' + za, x0 - 20, y + 28, I, 13); txt(g, 'B ' + zb, x1 - 20, y + 28, I, 13);
    const lo = Math.min(za, zb), hi = Math.max(za, zb), rows = [];
    for (let c = Math.ceil(lo / ci) * ci; c <= hi; c += ci) {
      if (za === zb) break;
      const t = (c - za) / (zb - za), x = x0 + t * (x1 - x0);
      g.strokeStyle = '#e8912d'; g.lineWidth = 2; g.beginPath(); g.moveTo(x, y - 25); g.lineTo(x, y + 25); g.stroke();
      txt(g, '' + c, x - 10, y - 32, '#e8912d', 13);
      rows.push([c, (t * L).toFixed(1), (t * 100).toFixed(0) + '%']);
    }
    q(el, '#o').innerHTML = za === zb ? 'Hai điểm cùng cao độ: đường đồng mức nối thẳng hai điểm (nếu trùng giá trị đồng mức).' :
      'Chênh cao Δz = <b>' + Math.abs(zb - za) + ' m</b>. Đường đồng mức cắt đoạn A–B (nội suy tuyến tính, độ dốc đều) tại:<div class="tw"><table><tr><th>Đồng mức (m)</th><th>Cách A (mm)</th><th>Tỉ lệ đoạn</th></tr>' +
      (rows.length ? rows.map(r => '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td><td>' + r[2] + '</td></tr>').join('') : '<tr><td colspan="3">Không có đường đồng mức nào đi qua giữa hai điểm này.</td></tr>') + '</table></div>' +
      '<small>Công thức: khoảng cách từ A = (z<sub>đồng mức</sub> − z<sub>A</sub>) / (z<sub>B</sub> − z<sub>A</sub>) × AB.</small>';
  }
  ['za', 'zb', 'L'].forEach(i => bindSlider(el, i, draw, i === 'L' ? ' mm' : ' m')); q(el, '#ci').onchange = draw;
  q(el, '#pre').onclick = () => { [['za', 345], ['zb', 209], ['L', 100]].forEach(([i, v]) => { q(el, '#' + i).value = v; q(el, '#' + i + 'v').textContent = v + (i === 'L' ? ' mm' : ' m'); }); q(el, '#ci').value = 50; draw(); };
  draw();
};

/* ---------- Ch4: thế nằm thật từ hai thế nằm biểu kiến ---------- */
W.apparentDip = el => {
  mk(el, `<div class="mtab"><button id="pre">Ví dụ 140∠35 và 230∠65</button></div>` +
    slider('b1', 'Hướng dốc biểu kiến β₁', 0, 359, 1, 140, '°') + slider('a1', 'Góc dốc biểu kiến α₁', 1, 89, 1, 35, '°') +
    slider('b2', 'Hướng dốc biểu kiến β₂', 0, 359, 1, 230, '°') + slider('a2', 'Góc dốc biểu kiến α₂', 1, 89, 1, 65, '°') +
    `<canvas width="600" height="260" style="width:100%"></canvas><div class="res" id="o"></div>`);
  const g = q(el, 'canvas').getContext('2d');
  function draw() {
    const b1 = num(el, 'b1'), a1 = num(el, 'a1'), b2 = num(el, 'b2'), a2 = num(el, 'a2'), I = ink(); g.clearRect(0, 0, 600, 260);
    const t1 = Math.tan(a1 * D2R), t2 = Math.tan(a2 * D2R), det = Math.sin((b2 - b1) * D2R);
    const cx = 150, cy = 135, R = 110;
    g.strokeStyle = I; g.lineWidth = 1; g.beginPath(); g.arc(cx, cy, R, 0, 7); g.stroke(); txt(g, 'B', cx - 4, cy - R - 6, I, 13);
    const o = q(el, '#o');
    if (Math.abs(det) < 0.02) { o.innerHTML = '<span style="color:var(--bad)">Hai hướng biểu kiến gần trùng nhau hoặc ngược nhau (lệch ~0° hoặc ~180°) nên không đủ để xác định – cần hai phương khác nhau rõ rệt.</span>'; return; }
    const a = (t1 * Math.sin(b2 * D2R) - t2 * Math.sin(b1 * D2R)) / det, b = (Math.cos(b1 * D2R) * t2 - Math.cos(b2 * D2R) * t1) / det;
    const T = Math.hypot(a, b), al = Math.atan(T) / D2R, be = mod(Math.atan2(b, a) / D2R, 360), st = mod(be - 90, 180);
    [[b1, '#1f5fbf', 'β₁'], [b2, '#7a3fb8', 'β₂']].forEach(([v, c, n]) => { const [x, y] = vec(v); arrow(g, cx, cy, cx + x * R, cy + y * R, c, 2); txt(g, n + '=' + v + '°', cx + x * (R + 6) - 14, cy + y * (R + 14), c, 12); });
    const [tx, ty] = vec(be); arrow(g, cx, cy, cx + tx * R * .85, cy + ty * R * .85, '#e8912d', 4);
    const [sx, sy] = vec(st); g.strokeStyle = '#1b9a5b'; g.lineWidth = 2; g.setLineDash([6, 4]); g.beginPath(); g.moveTo(cx - sx * R, cy - sy * R); g.lineTo(cx + sx * R, cy + sy * R); g.stroke(); g.setLineDash([]);
    txt(g, 'Cam: hướng dốc thật · xanh lá nét đứt: đường phương', 300, 40, I, 12);
    txt(g, 'Xanh dương/tím: hướng biểu kiến', 300, 60, I, 12);
    o.innerHTML = 'Thế nằm thật: hướng dốc <b>β = ' + be.toFixed(1) + '°</b>, góc dốc <b>α = ' + al.toFixed(1) + '°</b> (ghi ' + be.toFixed(0) + '∠' + al.toFixed(0) + '), đường phương ' + st.toFixed(0) + '° / ' + mod(st + 180, 360).toFixed(0) + '°.' +
      '<br><small>Cơ sở: tanα<sub>bk</sub> = tanα · cos(β<sub>bk</sub> − β). Viết cho hai hướng ta được hệ hai phương trình tuyến tính, giải ra tanα·cosβ và tanα·sinβ. Góc dốc thật luôn lớn hơn mọi góc dốc biểu kiến (α<sub>bk</sub> &lt; α).</small>';
  }
  ['b1', 'a1', 'b2', 'a2'].forEach(i => bindSlider(el, i, draw, '°'));
  q(el, '#pre').onclick = () => { [['b1', 140], ['a1', 35], ['b2', 230], ['a2', 65]].forEach(([i, v]) => { q(el, '#' + i).value = v; q(el, '#' + i + 'v').textContent = v + '°'; }); draw(); };
  draw();
};

/* ---------- Ch4: bài toán ba lỗ khoan ---------- */
W.threePoint = el => {
  mk(el, `<div class="mtab"><button id="p1">Bài 1: 490/350 · 530/340 · 520/410</button><button id="p2">Bài 2: 350/100 · 300/100 · 450/100</button></div>` +
    `<div class="lab">Cao độ miệng lỗ khoan (m): <input type="number" id="m1" value="490" style="width:74px"> <input type="number" id="m2" value="530" style="width:74px"> <input type="number" id="m3" value="520" style="width:74px"></div>` +
    `<div class="lab">Độ sâu gặp nóc vỉa (m): <input type="number" id="d1" value="350" style="width:74px"> <input type="number" id="d2" value="340" style="width:74px"> <input type="number" id="d3" value="410" style="width:74px"></div>` +
    `<canvas width="600" height="300" style="width:100%"></canvas><div class="res" id="o"></div><small>Kéo các điểm LK1, LK2, LK3 trên hình (đơn vị: mét ngoài thực địa, lưới 50 m). Kết quả phụ thuộc vị trí các lỗ khoan.</small>`);
  const c = q(el, 'canvas'), g = c.getContext('2d'), P = [[80, 130], [290, 235], [430, 60]], SC = 1; // canvas px = mét
  let drag = -1;
  const val = id => +q(el, '#' + id).value;
  function draw() {
    const I = ink(); g.clearRect(0, 0, 600, 300);
    g.strokeStyle = 'rgba(128,128,128,.25)'; g.lineWidth = 1; for (let x = 0; x <= 600; x += 50) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 300); g.stroke(); } for (let y = 0; y <= 300; y += 50) { g.beginPath(); g.moveTo(0, y); g.lineTo(600, y); g.stroke(); }
    const z = [1, 2, 3].map(i => val('m' + i) - val('d' + i)), X = P.map(p => p[0] / SC), Y = P.map(p => (300 - p[1]) / SC), o = q(el, '#o');
    const dx2 = X[1] - X[0], dy2 = Y[1] - Y[0], dx3 = X[2] - X[0], dy3 = Y[2] - Y[0], det = dx2 * dy3 - dx3 * dy2;
    if (Math.abs(det) < 1) { o.innerHTML = '<span style="color:var(--bad)">Ba lỗ khoan thẳng hàng – không xác định được mặt phẳng (cần ba lỗ khoan không thẳng hàng).</span>'; }
    else {
      const A = ((z[1] - z[0]) * dy3 - (z[2] - z[0]) * dy2) / det, B = (dx2 * (z[2] - z[0]) - dx3 * (z[1] - z[0])) / det, gm = Math.hypot(A, B);
      const dip = Math.atan(gm) / D2R, dd = gm < 1e-9 ? 0 : mod(Math.atan2(-A, -B) / D2R, 360);
      if (gm > 1e-9) {
        const ux = -B / gm, uy = A / gm; // hướng đường phương
        const zmin = Math.min(...z) - 300, zmax = Math.max(...z) + 300;
        for (let lv = Math.ceil(zmin / 10) * 10; lv <= zmax; lv += 10) {
          const t = (lv - z[0]) / (gm * gm), px = X[0] + t * A, py = Y[0] + t * B;
          g.strokeStyle = lv % 50 === 0 ? 'rgba(232,145,45,.9)' : 'rgba(232,145,45,.35)'; g.lineWidth = lv % 50 === 0 ? 1.6 : 1;
          g.beginPath(); g.moveTo((px - ux * 900) * SC, 300 - (py - uy * 900) * SC); g.lineTo((px + ux * 900) * SC, 300 - (py + uy * 900) * SC); g.stroke();
          const lx = (px * SC), ly = 300 - py * SC; if (lv % 50 === 0 && lx > 0 && lx < 600 && ly > 0 && ly < 300) txt(g, '' + lv, lx + 3, ly - 3, '#e8912d', 11);
        }
      }
      g.strokeStyle = I; g.lineWidth = 1.2; g.beginPath(); P.forEach((p, i) => g[i ? 'lineTo' : 'moveTo'](p[0], p[1])); g.closePath(); g.stroke();
      if (gm > 1e-9) { const [vx, vy] = vec(dd); const mx = (P[0][0] + P[1][0] + P[2][0]) / 3, my = (P[0][1] + P[1][1] + P[2][1]) / 3; arrow(g, mx, my, mx + vx * 60, my + vy * 60, '#d24545', 3); }
      o.innerHTML = 'Cao độ nóc vỉa tại LK1, LK2, LK3 = ' + z.join(' ; ') + ' m (miệng lỗ khoan − độ sâu). Đường phương là đường nối các điểm cùng cao độ (đường cam, cách nhau 10 m).<br>' +
        (gm < 1e-9 ? 'Ba điểm cùng cao độ: vỉa <b>nằm ngang</b>.' : 'Hướng dốc <b>β = ' + dd.toFixed(0) + '°</b> (mũi tên đỏ, hướng cao độ giảm nhanh nhất) · góc dốc <b>α = ' + dip.toFixed(1) + '°</b> · đường phương ' + mod(dd - 90, 180).toFixed(0) + '° / ' + (mod(dd - 90, 180) + 180).toFixed(0) + '° · tanα = h/a (h: chênh cao, a: khoảng cách ngang giữa hai đường phương).');
    }
    P.forEach((p, i) => { g.fillStyle = '#1f5fbf'; g.beginPath(); g.arc(p[0], p[1], 8, 0, 7); g.fill(); txt(g, 'LK' + (i + 1) + ' (' + z[i] + ')', p[0] + 11, p[1] - 8, I, 12); });
  }
  const pos = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * 600 / r.width, (e.clientY - r.top) * 300 / r.height]; };
  c.style.touchAction = 'none';
  c.addEventListener('pointerdown', e => { const [x, y] = pos(e); drag = P.findIndex(p => Math.hypot(p[0] - x, p[1] - y) < 18); if (drag >= 0) c.setPointerCapture(e.pointerId); });
  c.addEventListener('pointermove', e => { if (drag < 0) return; const [x, y] = pos(e); P[drag] = [Math.max(10, Math.min(590, x)), Math.max(10, Math.min(290, y))]; draw(); });
  c.addEventListener('pointerup', () => drag = -1);
  qa(el, 'input').forEach(i => i.oninput = draw);
  const setv = a => { ['m1', 'm2', 'm3', 'd1', 'd2', 'd3'].forEach((id, k) => q(el, '#' + id).value = a[k]); draw(); };
  q(el, '#p1').onclick = () => setv([490, 530, 520, 350, 340, 410]);
  q(el, '#p2').onclick = () => setv([350, 300, 450, 100, 100, 100]);
  draw();
};

W.projDist = el => {
  mk(el, slider('h', 'Khoảng cao đều h', 1, 100, 1, 10, ' m') + slider('al', 'Góc dốc α', 1, 89, 1, 23, '°') +

    g.strokeStyle = I; g.lineWidth = 1.5; g.beginPath(); g.moveTo(50, 20); g.lineTo(50, 210); g.lineTo(580, 210); g.stroke();
    txt(g, 'a (mm)', 6, 18, I, 12); txt(g, 'α (độ) →', 520, 232, I, 12);
    g.strokeStyle = '#1f5fbf'; g.lineWidth = 3; g.beginPath(); for (let a = 3; a <= 89; a++) g[a === 3 ? 'moveTo' : 'lineTo'](X(a), Y(f(a))); g.stroke();
    g.fillStyle = '#e8912d'; g.beginPath(); g.arc(X(al), Y(cur), 7, 0, 7); g.fill();

  }
  ['h', 'al'].forEach((i, k) => bindSlider(el, i, draw, k ? '°' : ' m')); q(el, '#N').onchange = draw; draw();

/* ---------- Ch5: nếp uốn mặt cắt ---------- */
W.foldExplorer = el => {
  mk(el, `<div class="mtab"><button data-k="a" class="on">Nếp lồi (anticline)</button><button data-k="s">Nếp lõm (syncline)</button></div><canvas width="600" height="300" style="width:100%"></canvas>` +
    slider('a1', 'Góc dốc cánh trái', 15, 85, 1, 45, '°') + slider('a2', 'Góc dốc cánh phải', 15, 120, 1, 45, '°') + `<div class="res" id="o"></div>`);
  const g = q(el, 'canvas').getContext('2d'); let kind = 'a';
  function draw() {
    const a1 = num(el, 'a1'); let a2 = num(el, 'a2'); const I = ink();
    if (a1 + a2 > 175) { a2 = 175 - a1; q(el, '#a2').value = a2; q(el, '#a2v').textContent = a2 + '°'; }
    g.clearRect(0, 0, 600, 300); g.save();
    if (kind === 's') { g.translate(0, 300); g.scale(1, -1); }
    const cols = ['#c9a86a', '#a7773f', '#d8c08e', '#8c5a2b', '#e0cfa2', '#b98d55'], hx = 300, hy = 55, L = 125, r = 22;
    for (let k = 5; k >= 0; k--) {
      const y = hy + k * 18, u1 = [-Math.cos(a1 * D2R), Math.sin(a1 * D2R)], u2 = [Math.cos(a2 * D2R), Math.sin(a2 * D2R)]; // y hướng xuống
      g.strokeStyle = cols[k]; g.lineWidth = 15; g.lineJoin = 'round'; g.lineCap = 'butt';
      g.beginPath(); g.moveTo(hx + u1[0] * L, y + u1[1] * L); g.lineTo(hx + u1[0] * r, y + u1[1] * r);
      g.quadraticCurveTo(hx, y, hx + u2[0] * r, y + u2[1] * r); g.lineTo(hx + u2[0] * L, y + u2[1] * L); g.stroke();
    }
    const u1 = [-Math.cos(a1 * D2R), Math.sin(a1 * D2R)], u2 = [Math.cos(a2 * D2R), Math.sin(a2 * D2R)];
    let bx = u1[0] + u2[0], by = u1[1] + u2[1], bl = Math.hypot(bx, by); bx /= bl; by /= bl;
    g.strokeStyle = '#d24545'; g.lineWidth = 2; g.setLineDash([6, 4]); g.beginPath(); g.moveTo(hx - bx * 40, hy - by * 40); g.lineTo(hx + bx * 150, hy + by * 150); g.stroke(); g.setLineDash([]);
    g.restore();
    const tilt = Math.atan2(bx, by) / D2R, inter = 180 - (a1 + a2);
    const cls = a2 > 90 || a1 > 90 ? 'nếp uốn <b>đảo</b> (một cánh bị lộn ngược, cánh dốc quá 90°)' : (a1 === a2 ? 'nếp uốn <b>đối xứng</b> (mặt trục là mặt đối xứng, hai cánh dốc bằng nhau)' : 'nếp uốn <b>bất đối xứng</b> (hai cánh dốc khác nhau)');
    const ia = inter > 120 ? 'thoải' : inter > 70 ? 'mở' : inter > 30 ? 'khép' : inter > 0 ? 'chặt' : 'đồng tà';
    q(el, '#o').innerHTML = (kind === 'a' ? 'Nếp lồi' : 'Nếp lõm') + ': ' + cls + '.<br>Góc giữa hai cánh (interlimb angle) = 180° − (α₁ + α₂) = <b>' + inter + '°</b> → nếp uốn ' + ia + '. Mặt trục (đường đỏ nét đứt) nghiêng <b>' + Math.abs(tilt).toFixed(0) + '°</b> so với phương thẳng đứng.' +
      (kind === 'a' ? '<br><small>Nếp lồi: đá cổ nằm ở nhân (giữa), hai cánh dốc ra xa trục.</small>' : '<br><small>Nếp lõm: đá trẻ nằm ở nhân, hai cánh dốc vào phía trục.</small>');
  }
  ['a1', 'a2'].forEach(i => bindSlider(el, i, draw, '°'));
  qa(el, '.mtab button').forEach(b => b.onclick = () => { kind = b.dataset.k; qa(el, '.mtab button').forEach(x => x.classList.toggle('on', x === b)); draw(); });
  draw();
};

/* ---------- Ch6: đứt gãy ---------- */
W.faultDemo = el => {
  mk(el, `<div class="mtab"><button data-k="n" class="on">Đứt gãy thuận</button><button data-k="r">Đứt gãy nghịch</button><button data-k="R">Bằng phải</button><button data-k="L">Bằng trái</button></div>` +
    `<canvas width="600" height="280" style="width:100%"></canvas>` + slider('d', 'Độ dịch chuyển', 0, 100, 1, 60, '') + `<div class="res" id="o"></div>`);
  const g = q(el, 'canvas').getContext('2d'); let kind = 'n';
  const cols = ['#e0cfa2', '#c9a86a', '#a7773f', '#d8c08e', '#8c5a2b', '#c9a86a', '#e0cfa2'];
  function bands(x0, y0, x1, y1) { for (let k = 0; k < 8; k++) { g.fillStyle = cols[k % cols.length]; g.fillRect(x0, 80 + k * 28, x1 - x0, 28); } }
  function draw() {
    const d = num(el, 'd'), I = ink(); g.clearRect(0, 0, 600, 280); const o = q(el, '#o');
    if (kind === 'n' || kind === 'r') {
      const sgn = kind === 'n' ? 1 : -1, dl = Math.tan(30 * D2R), fx = y => 300 + (y - 80) / Math.tan(60 * D2R);
      g.save(); g.beginPath(); g.rect(0, 0, 600, 260); g.clip();
      g.fillStyle = '#7d8290'; g.fillRect(0, 0, 600, 260);
      g.save(); g.beginPath(); g.moveTo(40, 80); g.lineTo(300, 80); g.lineTo(fx(400), 400); g.lineTo(40, 400); g.closePath(); g.clip(); bands(40, 80, 600, 400); g.restore();
      g.save(); g.translate(sgn * d * .5, sgn * d * .866); g.beginPath(); g.moveTo(300, 80); g.lineTo(560, 80); g.lineTo(560, 400); g.lineTo(fx(400), 400); g.closePath(); g.clip(); bands(40, 80, 600, 400); g.restore();
      g.strokeStyle = '#d24545'; g.lineWidth = 2.5; g.beginPath(); g.moveTo(300, 80); g.lineTo(fx(260), 260); g.stroke(); g.restore();
      txt(g, 'Vách nằm (footwall)', 60, 250, '#fff', 13); txt(g, 'Vách treo (hanging wall)', 400, 40, I, 13);
      if (kind === 'n') { arrow(g, 330, 20, 390, 20, I); arrow(g, 60, 20, 10, 20, I); txt(g, 'Ứng suất kéo', 120, 20, I, 12); } else { arrow(g, 80, 30, 140, 30, I); arrow(g, 560, 30, 500, 30, I); txt(g, 'Ứng suất ép', 190, 30, I, 12); }
      o.innerHTML = kind === 'n' ? '<b>Đứt gãy thuận</b>: vách treo trượt <b>xuống</b> so với vách nằm; kéo dãn vỏ (ứng suất kéo). Nhiều đứt gãy thuận tạo cặp địa luỹ (horst) – địa hào (graben) như vùng Basin and Range.' :
        '<b>Đứt gãy nghịch</b>: vách treo bị đẩy <b>lên</b> trên vách nằm; rút ngắn vỏ (ứng suất ép). Khi mặt đứt gãy thoải (góc cắm &lt; 15° theo bài giảng) gọi là đứt gãy chờm nghịch (overthrust), đá cổ có thể chờm lên đá trẻ (Lewis Overthrust).';
    } else {
      const s = (kind === 'R' ? 1 : -1) * d * .8;
      g.fillStyle = '#ddd2b3'; g.fillRect(40, 40, 260, 210); g.fillRect(300, 40 + s * 0, 260, 210);
      g.fillStyle = '#7d8290'; g.fillRect(40, 130, 260, 16); g.fillRect(300, 130 + s, 260, 16);
      g.strokeStyle = '#d24545'; g.lineWidth = 3; g.beginPath(); g.moveTo(300, 30); g.lineTo(300, 260); g.stroke();
      arrow(g, 430, 190, 430, 190 + (kind === 'R' ? 50 : -50), I, 3); arrow(g, 170, 190, 170, 190 + (kind === 'R' ? -50 : 50), I, 3);
      txt(g, 'Bình đồ (bắc ở trên) · lớp chuẩn: dải xám', 46, 30, I, 12);
      o.innerHTML = kind === 'R' ? '<b>Đứt gãy bằng phải (right-lateral)</b>: đứng ở một bên nhìn sang khối đối diện, khối đó dịch chuyển về phía <b>bên phải</b> (ở đây khối phía đông dịch về phía nam). Dải xám bị lệch sang phải.' :
        '<b>Đứt gãy bằng trái (left-lateral)</b>: khối đối diện dịch chuyển về phía <b>bên trái</b> (khối phía đông dịch về phía bắc). Kiểm tra bằng cách đứng phía đông nhìn sang: kết quả không đổi – đó là điểm hay của cách định nghĩa này.';
    }
  }
  bindSlider(el, 'd', draw, '');
  qa(el, '.mtab button').forEach(b => b.onclick = () => { kind = b.dataset.k; qa(el, '.mtab button').forEach(x => x.classList.toggle('on', x === b)); draw(); });
  draw();
};

W.geotime = el => {
  mk(el, `<div class="mtab"><button id="back" style="display:none">← Về toàn bộ lịch sử</button></div><div id="bar" style="display:flex;height:70px;border-radius:10px;overflow:hidden;border:1px solid var(--line)"></div><div class="res" id="o">Bấm vào một liên đại (Eon) để xem các kỷ bên trong. Chiều rộng tỉ lệ với thời gian thật.</div>`);
  const bar = q(el, '#bar'), o = q(el, '#o'), back = q(el, '#back');
  function show(items, a, b, isTop) {
    const tot = a - b; bar.innerHTML = '';
    items.forEach((it, i) => {
      const [nm, s, e] = it, dv = document.createElement('div');
      dv.style.cssText = 'flex:' + (s - e) + ' 1 0;min-width:0;background:' + (it[3] || `hsl(${(i * 47 + 200) % 360},45%,${isTop ? 45 : 55}%)`) + ';color:#fff;font-size:12px;display:grid;place-items:center;cursor:pointer;border-right:1px solid rgba(255,255,255,.5);overflow:hidden';
      dv.innerHTML = '<span style="writing-mode:' + ((s - e) / tot < .07 ? 'vertical-rl' : 'horizontal-tb') + ';padding:2px">' + nm + '</span>';
      dv.onclick = () => {
        const pct = ((s - e) / 4567 * 100).toFixed(1);
        o.innerHTML = '<b>' + nm + '</b>: từ ' + s + ' Ma đến ' + (e === 0 ? 'nay' : e + ' Ma') + ' · kéo dài ≈ ' + (s - e).toFixed(s - e < 10 ? 2 : 0) + ' triệu năm (' + pct + '% tuổi Trái Đất ≈ 4567 Ma).' + (it[4] ? '<br>' + it[4] : '');
        const K = it[5]; if (K && isTop) { back.style.display = ''; show(K, s, e, false); }
      };
      bar.appendChild(dv);
    });
  }
  const top = GT.kids.map(k => [k.name, k.a, k.b, k.c, k.note, k.kids]);
  back.onclick = () => { back.style.display = 'none'; show(top, 4567, 0, true); o.textContent = 'Bấm vào một liên đại để xem các kỷ bên trong.'; };

};

/* ---------- Ch7: phân rã phóng xạ ---------- */
W.decay = el => {
  const ISO = [['²³⁸U → ²⁰⁶Pb', 4.5e9, 'đá magma, khoáng vật'], ['²³⁵U → ²⁰⁷Pb', 704e6, 'đá magma, khoáng vật'], ['²³²Th → ²⁰⁸Pb', 14e9, 'đá magma, khoáng vật'], ['⁴⁰K → ⁴⁰Ar & ⁴⁰Ca', 1.25e9, 'đá magma, khoáng vật'], ['⁸⁷Rb → ⁸⁷Sr', 49e9, 'đá magma, khoáng vật'], ['¹⁴C → ¹⁴N', 5730, 'vật chất hữu cơ']];
  mk(el, `<label class="lab"><span style="min-width:120px">Cặp đồng vị</span><select id="iso">${ISO.map((x, i) => `<option value="${i}" ${i === 5 ? 'selected' : ''}>${x[0]} (T½ = ${fmtAge(x[1])})</option>`).join('')}</select></label>` +
    slider('p', 'Đồng vị mẹ còn lại', 1, 100, 1, 25, '%') + `<canvas width="600" height="220" style="width:100%"></canvas><div class="res" id="o"></div>`);
  const g = q(el, 'canvas').getContext('2d');
  function draw() {
    const [nm, T, rk] = ISO[+q(el, '#iso').value], p = num(el, 'p'), n = Math.log2(100 / p), age = n * T, I = ink(); g.clearRect(0, 0, 600, 220);
    const X = t => 50 + t / 6 * 520, Y = f => 190 - f * 170;
    g.strokeStyle = I; g.lineWidth = 1.5; g.beginPath(); g.moveTo(50, 15); g.lineTo(50, 190); g.lineTo(580, 190); g.stroke();
    txt(g, 'Số chu kỳ bán rã →', 450, 212, I, 12); txt(g, 'mẹ', 22, 30, '#1f5fbf', 12);
    g.lineWidth = 3; g.strokeStyle = '#1f5fbf'; g.beginPath(); for (let t = 0; t <= 6; t += .05) g[t ? 'lineTo' : 'moveTo'](X(t), Y(Math.pow(2, -t))); g.stroke();
    g.strokeStyle = '#e8912d'; g.beginPath(); for (let t = 0; t <= 6; t += .05) g[t ? 'lineTo' : 'moveTo'](X(t), Y(1 - Math.pow(2, -t))); g.stroke(); txt(g, 'con', 555, Y(.98) + 14, '#e8912d', 12);
    for (let k = 1; k <= 6; k++) txt(g, '' + k, X(k) - 3, 205, I, 11);
    g.fillStyle = '#d24545'; g.beginPath(); g.arc(X(Math.min(n, 6)), Y(p / 100), 6, 0, 7); g.fill();
    q(el, '#o').innerHTML = 'Còn ' + p + '% đồng vị mẹ ⇒ đã trải qua <b>' + n.toFixed(2) + '</b> chu kỳ bán rã ⇒ tuổi = n × T½ = <b>' + fmtAge(age) + '</b> (con = ' + (100 - p) + '%). Áp dụng cho ' + rk + '.' +
      (nm.startsWith('¹⁴C') && age > 5e4 ? '<br><b style="color:var(--bad)">C-14 chỉ tin cậy với mẫu trẻ hơn khoảng 50 ka</b> – lượng ¹⁴C còn lại quá nhỏ để đo chính xác.' : '');
  }
  bindSlider(el, 'p', draw, '%'); q(el, '#iso').onchange = draw; draw();
};

<script>

/* ---- Ch2: ký hiệu thế nằm trên bản đồ ---- */
FIGS.symbols = u => {
  let s = F_defs(u), pos = [95, 305, 515];
  const box = (x, t) => `<rect x="${x - 90}" y="34" width="180" height="150" rx="10" fill="var(--bg)" stroke="var(--line)"/>` + F_ti(x, 22, t);
  const v = az => [Math.sin(az * Math.PI / 180), -Math.cos(az * Math.PI / 180)];
  // nghiêng
  let x = pos[0], c = [x, 108], sv = v(50), dv = v(320);
  s += box(x, 'Lớp nghiêng') + `<line x1="${c[0] - sv[0] * 45}" y1="${c[1] - sv[1] * 45}" x2="${c[0] + sv[0] * 45}" y2="${c[1] + sv[1] * 45}" stroke="currentColor" stroke-width="3"/><line x1="${c[0]}" y1="${c[1]}" x2="${c[0] + dv[0] * 20}" y2="${c[1] + dv[1] * 20}" stroke="currentColor" stroke-width="3"/>` + F_t(c[0] + dv[0] * 20 - 22, c[1] + dv[1] * 20 - 4, '40', 'font-size="15" font-weight="700"') + F_tm(x, 172, '320∠40 · α ≠ 0', 'font-size="12"');
  // thẳng đứng
  x = pos[1]; c = [x, 108]; sv = v(45);
  s += box(x, 'Lớp thẳng đứng') + `<line x1="${c[0] - sv[0] * 45}" y1="${c[1] - sv[1] * 45}" x2="${c[0] + sv[0] * 45}" y2="${c[1] + sv[1] * 45}" stroke="currentColor" stroke-width="3"/><line x1="${c[0] - dv[0] * 0 - v(315)[0] * 16}" y1="${c[1] - v(315)[1] * 16}" x2="${c[0] + v(315)[0] * 16}" y2="${c[1] + v(315)[1] * 16}" stroke="currentColor" stroke-width="3"/>` + F_tm(x, 172, 'α = 90° · chỉ đo đường phương', 'font-size="12"');
  // nằm ngang
  x = pos[2]; c = [x, 108];
  s += box(x, 'Lớp nằm ngang') + `<line x1="${x - 22}" y1="108" x2="${x + 22}" y2="108" stroke="currentColor" stroke-width="3.5"/><line x1="${x}" y1="86" x2="${x}" y2="130" stroke="currentColor" stroke-width="3.5"/>` + F_tm(x, 172, 'α ≈ 0° · ký hiệu “+”', 'font-size="12"');
