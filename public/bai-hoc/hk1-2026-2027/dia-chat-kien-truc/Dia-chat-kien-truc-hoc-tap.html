/* ---- Ch3: thế nằm ngang – bình đồ và mặt cắt ---- */
FIGS.horizMap = u => {
  const cols = ['#96593a', '#b57444', '#cf9a58', '#e2c17c', '#f3e8bf'], R = [114.7, 83, 57, 25.7], lv = [100, 200, 300, 400], cx = 165, cy = 150;
  let s = F_defs(u);
  s += F_ti(165, 20, 'Bình đồ (nhìn từ trên xuống)') + F_ti(530, 20, 'Mặt cắt A–A′');
  s += `<clipPath id="pc${u}"><rect x="30" y="30" width="270" height="240"/></clipPath><g clip-path="url(#pc${u})"><rect x="30" y="30" width="270" height="240" fill="${cols[0]}"/>`;
  R.forEach((r, i) => { s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${cols[i + 1]}" stroke="#4a2f1c" stroke-width="1.2" stroke-dasharray="${i % 2 ? '' : ''}"/>`; });
  s += '</g>';
  R.forEach((r, i) => { s += F_t(cx + r * 0.72 + 2, cy - r * 0.72 - 2, lv[i], 'font-size="11" font-weight="700" fill="#3a2414"'); });
  s += `<line x1="30" y1="${cy}" x2="300" y2="${cy}" stroke="#d24545" stroke-width="2"/>` + F_t(12, cy + 4, 'A', 'font-weight="700" fill="#d24545"') + F_t(304, cy + 4, 'A′', 'font-weight="700" fill="#d24545"');
  // mặt cắt
  const x0 = 350, x1 = 710, cm = 530, base = 262, zs = 0.56, g = x => 430 * Math.exp(-Math.pow((x - cm) / 95, 2));
  const pts = F_ex(x => base - zs * g(x), [x0, x1, 4]);
  s += `<clipPath id="gc${u}"><polygon points="${x0},${base} ${PT(pts)} ${x1},${base}"/></clipPath><g clip-path="url(#gc${u})">`;
  const zz = [0, 100, 200, 300, 400, 460];
  for (let i = 0; i < 5; i++) s += `<rect x="${x0}" y="${base - zs * zz[i + 1]}" width="${x1 - x0}" height="${zs * (zz[i + 1] - zz[i])}" fill="${cols[i]}"/>`;
  s += '</g>';
  s += `<polyline points="${PT(pts)}" fill="none" stroke="#3a2414" stroke-width="2"/>`;
  lv.forEach(z => { s += `<line x1="${x0}" y1="${base - zs * z}" x2="${x1}" y2="${base - zs * z}" stroke="currentColor" stroke-opacity=".35" stroke-dasharray="4 4"/>` + F_t(x0 - 30, base - zs * z + 4, z, 'font-size="11"'); });
  s += F_t(x0 - 30, base + 4, '0', 'font-size="11"') + F_t(x0 - 32, 32, 'z (m)', 'font-size="11"');
  s += `<line x1="${x0}" y1="${base}" x2="${x1}" y2="${base}" stroke="currentColor" stroke-width="1.5"/>`;
  s += F_t(cm - 10, 26, 'A′', 'display="none"');
  // chú giải
  const names = ['1 – cổ nhất', '2', '3', '4', '5 – trẻ nhất'];
  names.forEach((n, i) => { s += `<rect x="${60 + i * 118}" y="290" width="16" height="16" rx="3" fill="${cols[i]}" stroke="#4a2f1c"/>` + F_t(80 + i * 118, 303, 'Lớp ' + n, 'font-size="12"'); });
  return [720, 316, s];
};

/* ---- Ch4: quy tắc chữ V ---- */
FIGS.vRule = u => {
  const sc = 0.72, py = y => 150 - y * sc, px = x => 6 + x * sc, cases = [[90, 'Dốc thẳng đứng', 'vết lộ là đường thẳng'], [40, 'Dốc nhiều (40°)', 'V góc tù'], [10, 'Dốc thoải (10°)', 'V góc nhọn']];
  let s = F_defs(u);
  cases.forEach((cs, i) => {
    const ox = i * 240, t = cs[0] === 90 ? Infinity : Math.tan(cs[0] * Math.PI / 180);
    s += `<g transform="translate(${ox},0)">${F_ti(115, 20, cs[1])}<clipPath id="vc${u}${i}"><rect x="2" y="34" width="226" height="230"/></clipPath><rect x="2" y="34" width="226" height="230" rx="8" fill="var(--bg)" stroke="var(--line)"/><g clip-path="url(#vc${u}${i})">`;
    for (let L = 5; L <= 50; L += 5) {
      const xa = Math.max(0, (L - 48) / 0.05), xb = Math.min(300, L / 0.05), tp = [], bt = [];
      for (let x = xa; x <= xb; x += 5) { const y = (L - 0.05 * x) / 0.4; tp.push([px(x), py(y)]); bt.push([px(x), py(-y)]); }
      if (xb < 300) { tp.push([px(xb), py(0)]); s += `<polyline points="${PT(tp.concat(bt.reverse()))}" fill="none" stroke="#8a8f9c" stroke-width="1"/>`; }
      else s += `<polyline points="${PT(tp)}" fill="none" stroke="#8a8f9c" stroke-width="1"/><polyline points="${PT(bt)}" fill="none" stroke="#8a8f9c" stroke-width="1"/>`;
    }
    s += `<line x1="${px(300)}" y1="${py(0)}" x2="${px(0)}" y2="${py(0)}" stroke="#5b9bd5" stroke-width="2.5" stroke-dasharray="6 3"/>`;
    let pts = [];
    if (t === Infinity) pts = [[px(200), py(120)], [px(200), py(-120)]];
    else { const k = (t + 0.05) / 0.4, xs = Math.max(0, 200 - 120 / k); pts = [[px(xs), py((200 - xs) * k)], [px(200), py(0)], [px(xs), py(-(200 - xs) * k)]]; }
    s += `<polyline points="${PT(pts)}" fill="none" stroke="#e8912d" stroke-width="4" stroke-linejoin="round"/>`;
    s += F_ar(u, px(205), py(32), px(250), py(32), 'r', 3) + `</g>` + F_t(px(212), py(46), 'dốc về đông', 'font-size="10.5" fill="#d24545"') + F_tm(115, 280, cs[2], 'font-size="13"') + '</g>';
  });
  s += F_t(20, 297, 'Đường xám: đồng mức địa hình (thung lũng, suối chảy về tây) · Đường cam: vết lộ của một mặt lớp · Cùng một địa hình', 'font-size="12" fill-opacity=".8"');
  return [720, 304, s];
};

/* ---- Ch5: giải phẫu nếp uốn ---- */
FIGS.foldAnatomy = u => {
  let s = F_defs(u); const y = (x, k) => 118 + 24 * k - 55 * Math.cos(2 * Math.PI * (x - 100) / 280), n = 5;
  for (let k = 0; k < n; k++) {
    const top = F_ex(x => y(x, k), [30, 690, 5]), bot = F_ex(x => y(x, k + 1), [30, 690, 5]).reverse();
    s += `<polygon points="${PT(top.concat(bot))}" fill="${STR[k % STR.length]}" stroke="#6b4226" stroke-opacity=".5"/>`;
  }
  s += `<polyline points="${PT(F_ex(x => y(x, 0), [30, 690, 5]))}" fill="none" stroke="#3a2414" stroke-width="2.2"/>`;
  s += `<line x1="380" y1="34" x2="380" y2="270" stroke="#d24545" stroke-width="2" stroke-dasharray="7 5"/><line x1="240" y1="34" x2="240" y2="270" stroke="#d24545" stroke-width="2" stroke-dasharray="7 5" stroke-opacity=".55"/>`;
  s += `<line x1="30" y1="118" x2="690" y2="118" stroke="currentColor" stroke-opacity=".4" stroke-dasharray="3 4"/>`;
  const halo = 'style="paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round"';
  s += F_ar(u, 380, 20, 660, 20, 'b', 2) + F_ar(u, 660, 20, 380, 20, 'b', 2) + F_tm(520, 14, 'Bước sóng (wavelength)', `font-weight="700" fill="#1f5fbf" ${halo}`);
  s += F_ar(u, 412, 118, 412, 66, 'g', 2.5) + F_ar(u, 412, 66, 412, 118, 'g', 0) + F_t(420, 96, 'Biên độ', `font-weight="700" fill="#1b9a5b" ${halo}`);
  s += `<circle cx="450" cy="118" r="6" fill="#fff" stroke="#000" stroke-width="2"/>` + F_t(462, 137, 'Điểm uốn (inflection)', `font-weight="700" ${halo}`);
  s += F_t(268, 190, 'Cánh (limb)', `font-weight="700" font-size="14" ${halo}`);
  s += `<circle cx="380" cy="63" r="6" fill="#fff" stroke="#c0392b" stroke-width="2.5"/>` + F_t(392, 50, 'Điểm bản lề (hinge point)', `font-weight="700" font-size="12" ${halo}`);
  s += F_t(388, 300, 'Mặt trục (axial plane) đi qua các bản lề', `font-weight="700" fill="#d24545" ${halo}`);
  s += F_tm(100, 46, 'Nếp lồi (anticline)', `font-size="13" font-weight="700" ${halo}`) + F_tm(240, 168, 'Nếp lõm', `font-size="13" font-weight="700" ${halo}`) + F_tm(520, 184, '(syncline)', `font-size="12" font-weight="700" ${halo}`);
  return [720, 318, s];
};

/* ---- Ch5: các dạng nếp uốn ---- */
FIGS.foldTypes = u => {
  let s = F_defs(u); const A = 28, k = 2 * Math.PI / 180;
  const panels = [['Đối xứng', 0], ['Bất đối xứng', 0.55], ['Đảo (overturned)', 1.25], ['Đơn nghiêng (monocline)', -1]];
  panels.forEach((pn, i) => {
    const ox = (i % 2) * 360, oy = Math.floor(i / 2) * 190, sh = pn[1], mono = sh < 0;
    const h = t => mono ? 44 * (1 - Math.tanh((t - 150) / 26)) / 2 : A * Math.cos(k * (t - 150));
    const pt = (t, l) => { const yy = 88 + 19 * l - h(t); return mono ? [t, yy] : [t - sh * (yy - 88), yy]; };
    s += `<g transform="translate(${ox},${oy})">${F_ti(170, 18, pn[0])}<clipPath id="ft${u}${i}"><rect x="10" y="28" width="320" height="150" rx="8"/></clipPath><rect x="10" y="28" width="320" height="150" rx="8" fill="var(--bg)" stroke="var(--line)"/><g clip-path="url(#ft${u}${i})">`;
    for (let l = 0; l < 9; l++) {
      const a = [], b = []; for (let t = -60; t <= 420; t += 4) { a.push(pt(t, l)); b.push(pt(t, l + 1)); }
      s += `<polygon points="${PT(a.concat(b.reverse()))}" fill="${STR[l % 5]}" stroke="#6b4226" stroke-opacity=".45"/>`;
    }
    if (!mono) { const c0 = pt(150, 0), c1 = pt(150, 5); s += `<line x1="${c0[0] + (c0[0] - c1[0]) * 0.35}" y1="${c0[1] - 20}" x2="${c1[0]}" y2="${c1[1]}" stroke="#d24545" stroke-width="2" stroke-dasharray="6 4"/>`; }
    s += '</g></g>';
  });
  s += F_t(20, 388, 'Đường đỏ nét đứt: mặt trục. Đối xứng: mặt trục thẳng đứng, hai cánh dốc bằng nhau · Bất đối xứng: mặt trục nghiêng,', 'font-size="12" fill-opacity=".85"') + F_t(20, 406, 'hai cánh dốc khác nhau · Đảo: một cánh bị lộn ngược · Đơn nghiêng: lớp gần ngang hai bên, gấp dốc ở giữa.', 'font-size="12" fill-opacity=".85"');
  return [720, 414, s];
};

/* ---- Ch5: cơ chế uốn gập ---- */
FIGS.buckling = u => {
  let s = F_defs(u); const st = [['Ban đầu', 0, 34, 196], ['Bắt đầu mất ổn định', 8, 42, 188], ['Nếp uốn phát triển', 21, 56, 174]];
  st.forEach((c, i) => {
    const a = c[1], xa = c[2], xb = c[3], L = 62, pts = [];
    for (let x = xa; x <= xb; x += 2) pts.push([x, 98 + a * Math.sin(2 * Math.PI * (x - xa) / L)]);
    s += `<g transform="translate(${i * 240},0)">${F_ti(120, 20, c[0])}<rect x="30" y="38" width="170" height="120" rx="8" fill="#e9e4d8" stroke="#bfb8a4"/><polyline points="${PT(pts)}" fill="none" stroke="#7a4a34" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>` +
      (i ? F_ar(u, 2, 98, 27, 98, 'r', 4) + F_ar(u, 228, 98, 203, 98, 'r', 4) : '') + '</g>';
  });
  s += F_t(36, 182, 'Nền mềm (độ nhớt thấp, μM)', 'font-size="12"') + F_t(36, 198, 'Lớp cứng (độ nhớt cao, μL) – bị rút ngắn song song với lớp', 'font-size="12" fill="#7a4a34" font-weight="700"');
  return [720, 210, s];
};

/* ---- Ch5: vòm và bồn trũng ---- */
FIGS.domeBasin = u => {
  const cols = ['#96593a', '#b57444', '#cf9a58', '#e2c17c'], names = ['A (cổ nhất)', 'B', 'C', 'D (trẻ nhất)'];
  let s = F_defs(u);
  [['Vòm (dome): cổ ở giữa', 175, 1], ['Bồn trũng (basin): trẻ ở giữa', 545, -1]].forEach(([t, cx, sg], p) => {
    s += F_ti(cx, 20, t);
    const rx = [130, 95, 60, 28], ry = [78, 57, 37, 16], cy = 105, order = sg > 0 ? [3, 2, 1, 0] : [0, 1, 2, 3];
    rx.forEach((r, j) => { s += `<ellipse cx="${cx}" cy="${cy}" rx="${r}" ry="${ry[j]}" fill="${cols[order[j]]}" stroke="#4a2f1c"/>`; });
    for (let a = 0; a < 8; a++) {
      const ang = a * Math.PI / 4 + 0.4, r0 = [rx[1] * 1.0, ry[1]], x0 = cx + r0[0] * Math.cos(ang) * 0.92, y0 = cy + r0[1] * Math.sin(ang) * 0.92, dx = Math.cos(ang) * 16, dy = Math.sin(ang) * 16 * 0.7;
      s += sg > 0 ? F_ar(u, x0, y0, x0 + dx, y0 + dy, 'k', 2) : F_ar(u, x0 + dx, y0 + dy, x0, y0, 'k', 2);
    }
    const g = x => 46 * Math.exp(-Math.pow((x - cx) / 78, 2));
    for (let l = 0; l < 4; l++) {
      const a = F_ex(x => 318 - 14 * l - sg * g(x), [cx - 150, cx + 150, 5]), b = F_ex(x => 318 - 14 * (l + 1) - sg * g(x), [cx - 150, cx + 150, 5]).reverse();
      const colr = sg > 0 ? cols[l] : cols[3 - l];
      s += `<polygon points="${PT(a.concat(b))}" fill="${cols[l]}" stroke="#4a2f1c" stroke-opacity=".5"/>`;
    }
    s += F_tm(cx, 386, sg > 0 ? 'Mặt cắt: các lớp cong lên, cổ ở lõi' : 'Mặt cắt: các lớp cong xuống, trẻ ở lõi', 'font-size="12"');
  });
  cols.forEach((c, i) => { s += `<rect x="${230 + i * 62}" y="398" width="14" height="14" rx="3" fill="${c}" stroke="#4a2f1c"/>` + F_t(248 + i * 62, 410, names[i].split(' ')[0], 'font-size="12"'); });
  s += F_t(20, 410, 'Tuổi (A cổ → D trẻ):', 'font-size="12"') + F_t(500, 410, 'Mũi tên: hướng dốc của lớp', 'font-size="12"');
  return [720, 420, s];
};

/* ---- Ch6: thuận – nghịch – bằng ---- */
FIGS.faultTypes = u => {
  let s = F_defs(u);
  const band = (i, x0, x1, y0, n) => { let r = ''; for (let l = 0; l < n; l++) r += `<rect x="${x0}" y="${y0 + l * 24}" width="${x1 - x0}" height="24" fill="${STR[l % 4]}"/>`; return r; };
  ['n', 'r'].forEach((k, i) => {
    const ox = i * 240, sg = k === 'n' ? 1 : -1, dx = 15 * sg, dy = 26 * sg, fx = y => 95 + (y - 40) / 1.732;
    s += `<g transform="translate(${ox},0)">${F_ti(115, 20, k === 'n' ? 'Đứt gãy thuận' : 'Đứt gãy nghịch')}<clipPath id="fw${u}${i}"><rect x="10" y="40" width="210" height="200"/></clipPath><clipPath id="fl${u}${i}"><polygon points="10,40 95,40 ${fx(400)},400 10,400"/></clipPath><clipPath id="fh${u}${i}"><polygon points="95,40 400,40 400,400 ${fx(400)},400"/></clipPath>
     <g clip-path="url(#fw${u}${i})"><rect x="10" y="40" width="210" height="200" fill="#e3e6ee"/><g clip-path="url(#fl${u}${i})">${band(0, 0, 300, 40, 9)}</g><g transform="translate(${dx},${dy})"><g clip-path="url(#fh${u}${i})">${band(0, 0, 300, 40, 9)}</g></g>
     <line x1="95" y1="40" x2="${fx(260)}" y2="260" stroke="#d24545" stroke-width="3"/></g>`;
    const hx = 160, hy = 118;
    s += F_ar(u, hx, hy, hx + 20 * sg * 0.5, hy + 20 * sg * 0.866, 'k', 3) + F_ar(u, 118, 140, 118 - 10 * sg, 140 - 17 * sg, 'k', 3);
    s += F_t(150, 62, 'vách treo', 'font-size="12" font-weight="700" style="paint-order:stroke;stroke:#fff;stroke-width:3px"') + F_t(22, 228, 'vách nằm', 'font-size="12" font-weight="700" style="paint-order:stroke;stroke:#fff;stroke-width:3px"');
    s += (k === 'n' ? F_ar(u, 60, 32, 20, 32, 'b', 3) + F_ar(u, 170, 32, 210, 32, 'b', 3) : F_ar(u, 20, 32, 60, 32, 'r', 3) + F_ar(u, 210, 32, 170, 32, 'r', 3));
    s += F_tm(115, 262, k === 'n' ? 'vách treo trượt xuống · kéo giãn' : 'vách treo trượt lên · ép ngắn', 'font-size="12"') + '</g>';
  });
  s += `<g transform="translate(480,0)">${F_ti(115, 20, 'Đứt gãy bằng phải')}<rect x="10" y="40" width="210" height="200" rx="6" fill="#efe9d6"/>
   <rect x="10" y="108" width="105" height="14" fill="#8b93a3"/><rect x="115" y="134" width="105" height="14" fill="#8b93a3"/>
   <line x1="115" y1="40" x2="115" y2="240" stroke="#d24545" stroke-width="3"/>${F_ar(u, 62, 195, 62, 160, 'k', 3)}${F_ar(u, 168, 70, 168, 105, 'k', 3)}
   ${F_tm(115, 262, 'nhìn sang khối đối diện: lệch về bên phải', 'font-size="12"')}</g>`;
  return [720, 276, s];
};

/* ---- Ch6: địa luỹ – địa hào ---- */
FIGS.horstGraben = u => {
  let s = F_defs(u); const tn = Math.tan(70 * Math.PI / 180), U = y => (y - 40) / tn, X0 = [120, 280, 440, 600], sg = [1, -1, 1, -1], D = 38;
  const fx = (i, y) => X0[i] + sg[i] * U(y);
  const e = D / tn, regs = [[null, 0, [-2 * e, 0]], [0, 1, [-e, D]], [1, 2, [0, 0]], [2, 3, [e, D]], [3, null, [2 * e, 0]]];
  s += `<clipPath id="hw${u}"><rect x="10" y="40" width="700" height="200"/></clipPath><g clip-path="url(#hw${u})"><rect x="10" y="40" width="700" height="200" fill="#e3e6ee"/>`;
  regs.forEach((r, i) => {
    const L = r[0] === null ? [[-200, 40], [-200, 400]] : [[fx(r[0], 40), 40], [fx(r[0], 400), 400]], Rr = r[1] === null ? [[900, 40], [900, 400]] : [[fx(r[1], 40), 40], [fx(r[1], 400), 400]];
    let b = ''; for (let l = 0; l < 10; l++) b += `<rect x="-300" y="${40 + l * 26}" width="1400" height="26" fill="${STR[l % 4]}"/>`;
    s += `<clipPath id="hr${u}${i}"><polygon points="${PT([L[0], Rr[0], Rr[1], L[1]])}"/></clipPath><g transform="translate(${r[2][0]},${r[2][1]})"><g clip-path="url(#hr${u}${i})">${b}</g></g>`;
  });
  for (let i = 0; i < 4; i++) { const o = [-2 * e, 0, 0, 2 * e][i]; s += `<line x1="${fx(i, 40) + o}" y1="40" x2="${fx(i, 240) + o}" y2="240" stroke="#d24545" stroke-width="3"/>`; }
  s += '</g>';
  s += F_ar(u, 205, 32, 205, 32, 'k', 0);
  [[200, 'Địa hào (graben)'], [360, 'Địa luỹ (horst)'], [520, 'Địa hào (graben)']].forEach(([x, t]) => { s += F_tm(x, 34, t, 'font-weight="700" font-size="13"'); });
  s += F_ar(u, 20, 20, 10, 20, 'b', 0) + F_ar(u, 640, 258, 700, 258, 'b', 3) + F_ar(u, 80, 258, 20, 258, 'b', 3) + F_tm(360, 262, 'Kéo giãn vỏ: nhiều đứt gãy thuận kề nhau tạo địa luỹ và địa hào xen kẽ', 'font-size="12"');
  return [720, 272, s];
};

/* ---- Ch7: ba kiểu bất chỉnh hợp ---- */
FIGS.unconform = u => {
  let s = F_defs(u); const surf = (x, y0) => y0 + 5 * Math.sin(x / 9) + 3 * Math.sin(x / 3.3);
  const tp = [['Bất chỉnh hợp góc', 132], ['Giả chỉnh hợp', 140], ['Không chỉnh hợp', 140]];
  tp.forEach((c, i) => {
    const ox = i * 240, y0 = c[1], sp = F_ex(x => surf(x, y0), [10, 220, 3]);
    let low = '';
    if (i === 0) { for (let l = -8; l < 10; l++) low += `<rect x="-120" y="${100 + l * 22}" width="460" height="22" fill="${['#9aa5b8', '#c8d0de'][((l % 2) + 2) % 2]}" transform="rotate(-28 115 150)"/>`; }
    else if (i === 1) { for (let l = 0; l < 6; l++) low += `<rect x="0" y="${y0 - 10 + l * 24}" width="240" height="24" fill="${['#9aa5b8', '#c8d0de'][l % 2]}"/>`; }
    else low = `<rect x="0" y="${y0 - 10}" width="240" height="130" fill="url(#gr${u})"/>`;
    let up = ''; for (let l = 0; l < 6; l++) up += `<rect x="0" y="${y0 + 12 - (l + 1) * 22}" width="240" height="22" fill="${['#e2c17c', '#cf9a58'][l % 2]}"/>`;
    s += `<g transform="translate(${ox},0)">${F_ti(115, 22, c[0])}<clipPath id="uw${u}${i}"><rect x="10" y="40" width="210" height="200" rx="6"/></clipPath><clipPath id="ul${u}${i}"><polygon points="${PT(sp.concat([[220, 260], [10, 260]]))}"/></clipPath><clipPath id="uu${u}${i}"><polygon points="${PT(sp.concat([[220, 0], [10, 0]]))}"/></clipPath>
     <g clip-path="url(#uw${u}${i})"><rect x="10" y="40" width="210" height="200" fill="var(--bg)"/><g clip-path="url(#ul${u}${i})">${low}</g><g clip-path="url(#uu${u}${i})">${up}</g>
     <polyline points="${PT(sp)}" fill="none" stroke="#d24545" stroke-width="3"/>`;
    if (i !== 1) for (let p = 0; p < 9; p++) s += `<circle cx="${28 + p * 22}" cy="${surf(28 + p * 22, y0) - 4}" r="${3 + (p % 3)}" fill="#f6efe0" stroke="#6b4226"/>`;
    s += '</g>' + F_t(100, y0 + 62, 'mặt bất chỉnh hợp', 'display="none"') + '</g>';
  });
  const cap = ['Lớp dưới nghiêng, bị cắt cụt|lớp trên nằm ngang', 'Lớp trên và dưới song song,|ngăn bởi mặt bào mòn', 'Trầm tích phủ lên đá|magma/biến chất bị bào mòn'];
  cap.forEach((t, i) => t.split('|').forEach((ln, j) => { s += F_tm(i * 240 + 115, 260 + j * 16, ln, 'font-size="12"'); }));
  s += F_t(20, 300, 'Đường đỏ: mặt bất chỉnh hợp · Các hạt tròn sáng: cuội kết cơ sở (basal conglomerate) nằm ngay trên mặt bào mòn', 'font-size="12" fill-opacity=".85"');
  return [720, 310, s];
};

/* ---- Ch7: quan hệ xuyên cắt ---- */
FIGS.crossCut = u => {
  let s = F_defs(u); const sf = x => 165 + 5 * Math.sin(x / 40) + 3 * Math.sin(x / 13), sp = F_ex(sf, [10, 710, 5]);
  let A = ''; for (let l = -20; l < 24; l++) A += `<rect x="-500" y="${l * 24}" width="1800" height="24" fill="${['#9aa5b8', '#c8d0de'][((l % 2) + 2) % 2]}" transform="rotate(-22 360 180)"/>`;
  let C = '', E = ''; for (let l = 0; l < 4; l++) C += `<rect x="0" y="${105 + l * 20}" width="720" height="20" fill="${['#e2c17c', '#cf9a58'][l % 2]}"/>`; for (let l = 0; l < 3; l++) E += `<rect x="0" y="${30 + l * 25}" width="720" height="25" fill="${['#cfe6c6', '#a8cf9f'][l % 2]}"/>`;
  s += `<clipPath id="cw${u}"><rect x="10" y="30" width="700" height="270" rx="8"/></clipPath><clipPath id="ccl${u}"><polygon points="${PT(sp.concat([[710, 300], [10, 300]]))}"/></clipPath><clipPath id="ccu${u}"><polygon points="${PT(sp.concat([[710, 105], [10, 105]]))}"/></clipPath>
   <g clip-path="url(#cw${u})"><rect x="10" y="30" width="700" height="270" fill="var(--bg)"/>${A}
   <g clip-path="url(#ccl${u})"><ellipse cx="230" cy="245" rx="135" ry="72" fill="url(#gr${u})" stroke="#8a4b45" stroke-width="2"/></g>
   <g clip-path="url(#ccu${u})">${C}</g>
   <polygon points="412,300 428,300 520,105 504,105" fill="#2f6b3f" stroke="#1d4527"/>
   ${E}
   <line x1="600" y1="30" x2="548" y2="300" stroke="#d24545" stroke-width="4"/></g>`;
  const lab = (x, y, t, c = '#111') => `<circle cx="${x}" cy="${y}" r="13" fill="#fff" stroke="${c}" stroke-width="2"/>` + F_tm(x, y + 5, t, 'font-weight="700" font-size="14" fill="#111"');
  s += lab(90, 238, 'A') + lab(240, 250, 'B') + lab(150, 145, 'C') + lab(470, 220, 'D', '#1d4527') + lab(300, 68, 'E') + lab(586, 220, 'F', '#d24545');
  s += F_ar(u, 660, 190, 660, 220, 'k', 3) + F_ar(u, 640, 245, 640, 215, 'k', 3);
  s += F_t(20, 318, 'Từ trẻ đến cổ: F → E → D → C → B → A  (F cắt tất cả; E phủ C và D; D cắt A, B, C; C phủ mặt bào mòn của A, B; B cắt A)', 'font-size="12" fill-opacity=".9"');
  return [720, 326, s];
};


/* ---- Ch7: sơ đồ tư duy thang thời gian ---- */
FIGS.mindmap = u => {
  const T = ['Trái Đất', '≈ 4567 Ma', null, [
    ['Hadean', 'Minh cổ · 4567–4000', '#8c4a3c', []],
    ['Archean', 'Thái cổ · 4000', '#b3562f', [['Eoarchean', '4000'], ['Paleoarchean', '3600'], ['Mesoarchean', '3200'], ['Neoarchean', '2800']]],
    ['Proterozoic', 'Nguyên sinh · 2500', '#3f7f6b', [
      ['Paleoproterozoic', '2500', [['Siderian', '2500'], ['Rhyacian', '2300'], ['Orosirian', '2050'], ['Statherian', '1800']]],
      ['Mesoproterozoic', '1600', [['Calymmian', '1600'], ['Ectasian', '1400'], ['Stenian', '1200']]],
      ['Neoproterozoic', '1000', [['Tonian', '1000'], ['Cryogenian', '720'], ['Ediacaran', '635']]]]],
    ['Phanerozoic', 'Hiển sinh · 541', '#2a7bbf', [
      ['Paleozoic', 'Cổ sinh · 541', [['Cambrian', '541'], ['Ordovician', '485,4'], ['Silurian', '443,8'], ['Devonian', '419,2'], ['Carboniferous', '358,9'], ['Permian', '298,9']]],
      ['Mesozoic', 'Trung sinh · 252,2', [['Triassic', '252,2'], ['Jurassic', '201,3'], ['Cretaceous', '145']]],
      ['Cenozoic', 'Tân sinh · 66', [['Paleogene', '66'], ['Neogene', '23,03'], ['Quaternary', '2,58']]]]]]];
  const RH = 27, X = [8, 178, 410, 650], Wd = [130, 196, 190, 190];
  let row = 0, out = '', nodes = '';
  const node = (lv, x, y, name, sub, col, fillMode) => {
    const w = Wd[lv], h = 22, fill = fillMode ? col : col + '22';
    return `<rect x="${x}" y="${y - h / 2}" width="${w}" height="${h}" rx="${h / 2}" fill="${fill}" stroke="${col}" stroke-width="1.6"/>` +
      `<text x="${x + 10}" y="${y + 4.5}" font-size="${lv === 0 ? 14 : 12.5}" font-weight="${lv < 2 ? 700 : 600}" fill="${fillMode ? '#fff' : 'currentColor'}">${name}<tspan font-weight="400" font-size="11" dx="5" fill="${fillMode ? '#ffffffcc' : 'currentColor'}" fill-opacity="${fillMode ? 1 : .7}">${sub}</tspan></text>`;
  };
  const link = (x1, y1, x2, y2, col) => `<path d="M${x1},${y1} C${(x1 + x2) / 2},${y1} ${(x1 + x2) / 2},${y2} ${x2},${y2}" fill="none" stroke="${col}" stroke-width="2.2" stroke-opacity=".75"/>`;
  // bố cục: mỗi lá một hàng
  const place = (n, lv, col) => { // trả về y
    const kids = lv === 1 ? n[3] : lv === 2 ? (n[2] || []) : [];
    if (!kids.length) { const y = 20 + (row++) * RH; return y; }
    return null;
  };
  const eons = T[3], ys = { eon: [] };
  const layout = [];
  eons.forEach(eo => {
    const eraKids = eo[3];
    const e = { eo, eras: [] };
    if (!eraKids.length) { e.y = 20 + (row++) * RH; }
    else {
      eraKids.forEach(er => {
        const pk = er[2] || [], E = { er, per: [] };
        if (!pk.length) E.y = 20 + (row++) * RH;
        else { pk.forEach(p => E.per.push({ p, y: 20 + (row++) * RH })); E.y = (E.per[0].y + E.per[E.per.length - 1].y) / 2; }
        e.eras.push(E);
      });
      e.y = (e.eras[0].y + e.eras[e.eras.length - 1].y) / 2;
    }
    layout.push(e);
  });
  const rootY = (layout[0].y + layout[layout.length - 1].y) / 2;
  layout.forEach(e => {
    const col = e.eo[2];
    out += link(X[0] + Wd[0], rootY, X[1], e.y, col);
    nodes += node(1, X[1], e.y, e.eo[0], e.eo[1], col, true);
    e.eras.forEach(E => {
      out += link(X[1] + Wd[1], e.y, X[2], E.y, col);
      nodes += node(2, X[2], E.y, E.er[0], E.er[1], col, false);
      E.per.forEach(P => { out += link(X[2] + Wd[2], E.y, X[3], P.y, col); nodes += node(3, X[3], P.y, P.p[0], P.p[1], col, false); });
    });
  });
  nodes += node(0, X[0], rootY, T[0], T[1], '#444', true).replace('font-size="14"', 'font-size="13.5"');
  const H = 20 + row * RH + 6;
  return [860, H + 24, `<g transform="translate(0,4)">${out}${nodes}</g><text x="8" y="${H + 16}" font-size="12" fill-opacity=".75">Số cuối mỗi nút: thời điểm bắt đầu (triệu năm trước, Ma). Cột: liên đại → đại → kỷ.</text>`];
};

W.fig = el => {
  const f = FIGS[el.dataset.name]; if (!f) throw new Error('không có hình ' + el.dataset.name);
  const u = ++FIGU, [w, h, body] = f(u);
  el.innerHTML = `<figure class="fig"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${el.dataset.cap || ''}" xmlns="http://www.w3.org/2000/svg" fill="currentColor" style="color:var(--ink);font-family:'Segoe UI',system-ui,sans-serif">${body}</svg>${el.dataset.cap ? `<figcaption>${el.dataset.cap}</figcaption>` : ''}</figure>`;
};

</script>
<script>
/* Khung ứng dụng: mục lục, định tuyến theo hash, tiến độ học, giao diện sáng/tối.
   Đổi SITE.title / SITE.sub cho từng môn. Không chứa câu hỏi kiểm tra (quiz làm ở web khác). */
const SITE = { title: 'Địa chất kiến trúc & Đo vẽ bản đồ địa chất', sub: 'ĐCKT & ĐVBĐĐC · ĐH Bách khoa TP.HCM · Khoa Kỹ thuật Địa chất & Dầu khí' };
const CH = window.CHAPTERS;
const $ = (s, r = document) => r.querySelector(s);
const side = $('#side'), main = $('#main');
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let done = store.get('done', {});
const colors = ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--accent)'];
const col = i => colors[i % colors.length];

function buildSide() {
  const total = CH.reduce((n, c) => n + c.sections.length, 0), got = Object.keys(done).length;
  side.innerHTML = `<h1>${SITE.title}</h1><div class="sub">${SITE.sub}</div>
  <div class="bar"><i style="width:${Math.round(got / total * 100)}%"></i></div>
  <div class="sub" style="margin-top:4px">Đã học ${got}/${total} mục</div>
  <div class="chap"><button data-go="home"><span class="num" style="background:var(--accent)">⌂</span>Trang chủ</button></div>` +
    CH.map((c, i) => `<div class="chap" data-c="${c.id}"><button data-toggle="${c.id}"><span class="num" style="background:${col(i)}">${c.num}</span>${c.title}</button>
    <div class="sec">${c.sections.map(s => `<a href="#${c.id}/${s.id}" data-s="${c.id}/${s.id}"><span>${s.title}</span><span class="tick">${done[c.id + '/' + s.id] ? '✓' : ''}</span></a>`).join('')}</div></div>`).join('') +
    `<div class="tools"><button id="theme">🌓 Sáng/Tối</button><button id="reset">↺ Xoá tiến độ</button></div>`;
}
side.addEventListener('click', e => {
  const t = e.target.closest('[data-toggle]');
  if (t) { t.parentElement.classList.toggle('open'); return; }
  const g = e.target.closest('[data-go]');
  if (g) { location.hash = ''; side.classList.remove('on'); }
  if (e.target.closest('a')) side.classList.remove('on');
  if (e.target.id === 'theme') { const d = document.documentElement.dataset.theme === 'dark'; document.documentElement.dataset.theme = d ? '' : 'dark'; store.set('theme', d ? '' : 'dark'); }
  if (e.target.id === 'reset' && confirm('Xoá toàn bộ tiến độ học?')) { done = {}; store.set('done', done); buildSide(); route(); }
});
$('#menuBtn').onclick = () => side.classList.toggle('on');
document.documentElement.dataset.theme = store.get('theme', '');

function mark(key) { if (!done[key]) { done[key] = 1; store.set('done', done); buildSide(); openActive(); } }
function openActive() {
  const h = location.hash.slice(1), cid = h.split('/')[0];
  document.querySelectorAll('.chap').forEach(c => c.classList.toggle('open', c.dataset.c === cid));
  document.querySelectorAll('.sec a').forEach(a => a.classList.toggle('active', a.dataset.s === h));
}
function home() {
  main.innerHTML = `<div class="hero"><span class="pill">Web học tập tương tác</span><h2>${SITE.title}</h2><p>Bảy chương đi từ bối cảnh kiến tạo, biến dạng, thế nằm, nếp uốn – đứt gãy đến địa tầng học, với hình minh hoạ và công cụ tính tương tác.</p></div>
  <div class="grid">${CH.map((c, i) => `<a class="mini click" style="text-decoration:none;color:inherit;border-top:5px solid ${col(i)}" href="#${c.id}/${c.sections[0].id}"><h4>Chương ${c.num}. ${c.title}</h4><div style="font-size:14px;color:var(--muted)">${c.blurb || ''}</div><div style="margin-top:8px;font-size:13px"><b>${c.sections.length}</b> bài</div></a>`).join('')}</div>`;
  mountWidgets(main); openActive();
}
function chapterPage(c, s) {
  const i = c.sections.indexOf(s), prev = c.sections[i - 1], next = c.sections[i + 1];
  main.innerHTML = `<div class="crumb">Chương ${c.num} · ${c.title}</div><h2 class="st">${s.title}</h2>${s.html}
  <div class="pager">${prev ? `<a class="btn" href="#${c.id}/${prev.id}">← ${prev.title}</a>` : '<span></span>'}${next ? `<a class="btn primary" href="#${c.id}/${next.id}">${next.title} →</a>` : '<span></span>'}</div>`;
  mountWidgets(main); mark(c.id + '/' + s.id);
}
function route() {
  const h = location.hash.slice(1); window.scrollTo(0, 0);
  if (!h) home();
  else {
    const [cid, sid] = h.split('/'), c = CH.find(x => x.id === cid);
    if (!c) home(); else chapterPage(c, c.sections.find(x => x.id === sid) || c.sections[0]);
  }
  openActive();
}
window.addEventListener('hashchange', route);
buildSide(); route();

</script>
</body>
</html>
