// Vẽ hệ tọa độ phẳng: x hướng lên (Bắc), y hướng sang phải (Đông)
function plotXY(g, W_, H_, pts, lines, labels) {
  const xs = pts.map(p => p[1]), ys = pts.map(p => p[0]);
  let minY = Math.min(...xs), maxY = Math.max(...xs), minX = Math.min(...ys), maxX = Math.max(...ys);
  const pad = Math.max(maxX - minX, maxY - minY, 1) * .18, k = Math.min((W_ - 80) / (maxY - minY + 2 * pad), (H_ - 60) / (maxX - minX + 2 * pad));
  const px = y => 40 + (y - minY + pad) * k, py = x => H_ - 30 - (x - minX + pad) * k;
  g.clearRect(0, 0, W_, H_); g.strokeStyle = CL.grey; g.lineWidth = 1; g.beginPath(); g.moveTo(10, H_ - 12); g.lineTo(W_ - 10, H_ - 12); g.moveTo(14, H_ - 8); g.lineTo(14, 8); g.stroke(); txt(g, 'y (Đông) →', W_ - 12, H_ - 16, CL.grey, 11, 'right'); txt(g, '↑ x (Bắc)', 20, 16, CL.grey, 11);
  lines.forEach(([a, b, col, dash]) => { g.strokeStyle = col; g.lineWidth = 2.5; g.setLineDash(dash ? [5, 4] : []); g.beginPath(); g.moveTo(px(a[1]), py(a[0])); g.lineTo(px(b[1]), py(b[0])); g.stroke(); }); g.setLineDash([]);
  pts.forEach((p, i) => { g.fillStyle = CL.red; g.beginPath(); g.arc(px(p[1]), py(p[0]), 5, 0, 7); g.fill(); txt(g, labels[i], px(p[1]) + 8, py(p[0]) - 8, ink(), 14); });
  return { px, py };
}

// Mia đo cao và số đọc
W.staff = el => {
  mk(el, `<div class="two"><div><canvas width="260" height="340" style="width:100%;max-width:260px"></canvas></div><div>` + slider('r', 'Số đọc trên mia', 0.5, 3, 0.001, 1.045, ' m') + `<button class="btn" id="pre">Số đọc 1,045 m</button><div class="res" id="out"></div></div></div>`);

    q(el, '#out').innerHTML = `Số đọc <b>${fmt(r, 3)} m</b> = ${m} m + ${dm} dm + ${cmv} cm + ${mmv} mm.<br>Mét, đề-xi-mét đọc theo số ghi trên mia; xen kẽ đen/đỏ; cm đếm theo vạch; mm ước lượng bằng mắt.`;

  q(el, '#pre').onclick = () => { q(el, '#r').value = 1.045; q(el, '#rv').textContent = '1,045 m'; draw(); }; q(el, '#rv').textContent = '1,045 m'; draw();

// Thử nghiệm hai mốc (two-peg test)
W.twoPeg = el => {
  const PRE = { 'Ví dụ trong bài (1,500 – 0,500 – 3,500 – 2,000)': [1.5, .5, 3.5, 2], 'Ví dụ 1 (3,458 – 2,116 – 4,244 – 2,914)': [3.458, 2.116, 4.244, 2.914] };
  mk(el, `<div class="mtab" id="pre">${Object.keys(PRE).map((k, i) => `<button data-k="${k}" class="${i ? '' : 'on'}">${k}</button>`).join('')}</div><div class="two"><div>${field('a1', 'a₁ (máy giữa, mia A)', 1.5)}${field('b1', 'b₁ (máy giữa, mia B)', 0.5)}${field('dab', 'Khoảng cách AB (m)', 20)}</div><div>${field('a2', 'a₂ (máy tại C, mia A)', 3.5)}${field('b2', 'b₂ (máy tại C, mia B)', 2)}${field('dbc', 'Khoảng cách BC (m)', 10)}</div></div><div class="res" id="out"></div><canvas width="600" height="270" style="width:100%"></canvas>`);
  const g = q(el, 'canvas').getContext('2d');
  const draw = () => {
    const a1 = num(el, 'a1', 0), b1 = num(el, 'b1', 0), a2 = num(el, 'a2', 0), b2 = num(el, 'b2', 0), dab = Math.max(1, num(el, 'dab', 20)), dbc = Math.max(1, num(el, 'dbc', 10));
    const dT = a1 - b1, dF = a2 - b2, err = dF - dT, e = err / dab, a4 = a2 - e * (dab + dbc), b4 = b2 - e * dbc, i = e * RHO;
    q(el, '#out').innerHTML = `ΔH<sub>TRUE</sub> = a₁ − b₁ = <b>${fmt(dT)} m</b> · ΔH<sub>FALSE</sub> = a₂ − b₂ = <b>${fmt(dF)} m</b><br>Sai số = ΔH<sub>FALSE</sub> − ΔH<sub>TRUE</sub> = <b>${fmt(err)} m</b> trong ${dab} m ${err === 0 ? '→ máy <b>không có</b> lỗi chuẩn trực' : (err > 0 ? '→ ΔH<sub>FALSE</sub> &gt; ΔH<sub>TRUE</sub>: đường ngắm <b>nghiêng lên</b>' : '→ ΔH<sub>FALSE</sub> &lt; ΔH<sub>TRUE</sub>: đường ngắm <b>nghiêng xuống</b>')}<br>Sai số trong ${dab + dbc} m (từ C đến A) = ${fmt(err)}×${dab + dbc}/${dab} = <b>${fmt(e * (dab + dbc))} m</b> ⇒ số đọc cần có trên mia A: a₄ = a₂ − ${e < 0 ? '(' + fmt(e * (dab + dbc)) + ')' : fmt(e * (dab + dbc))} = <b>${fmt(a4)} m</b><br>Mở rộng: kiểm tra chéo — mia B phải đọc b₄ = ${fmt(b4)} m và a₄ − b₄ = ${fmt(a4 - b4)} = ΔH<sub>TRUE</sub>. Góc lệch trục ngắm ≈ ${fmt(i, 0)}″ (ví dụ trong bài phóng đại để dễ tính).`;
    // vẽ
    const zA = 0, zB = dT, sl = dT / dab, xC = dab + dbc, zP = [zA + a2, zB + b2], sLOS = (zP[1] - zP[0]) / dab, zI = zP[1] + sLOS * dbc, zC = sl * xC;
    const zmin = Math.min(zA, zB, zC) - .3, zmax = Math.max(zA + a2 + .3, zB + b2 + .3, zI + .3, zA + 3.6), kx = 500 / (xC + 6), kz = 230 / (zmax - zmin), X = x => 50 + (x + 1) * kx, Z = z => 250 - (z - zmin) * kz;
    g.clearRect(0, 0, 600, 270); g.strokeStyle = CL.grey; g.lineWidth = 2; g.beginPath(); g.moveTo(X(-1), Z(sl * -1)); g.lineTo(X(xC + 3), Z(sl * (xC + 3))); g.stroke();
    [[0, zA, 'A', a2], [dab, zB, 'B', b2]].forEach(([x, z, n, rd]) => { g.fillStyle = 'rgba(200,170,90,.7)'; g.fillRect(X(x) - 3, Z(z + 3.6), 6, 3.6 * kz); txt(g, n, X(x) - 4, Z(z) + 16, ink(), 14); g.fillStyle = CL.red; g.beginPath(); g.arc(X(x), Z(z + rd), 4, 0, 7); g.fill(); });
    g.strokeStyle = CL.red; g.lineWidth = 1.5; g.beginPath(); g.moveTo(X(xC), Z(zI)); g.lineTo(X(0), Z(zP[0])); g.stroke();
    g.strokeStyle = CL.green; g.setLineDash([6, 4]); g.beginPath(); g.moveTo(X(xC), Z(zI)); g.lineTo(X(-0.5), Z(zI)); g.stroke(); g.setLineDash([]);
    g.fillStyle = CL.green; g.beginPath(); g.arc(X(0), Z(zI), 4, 0, 7); g.fill(); g.fillStyle = CL.blue; g.fillRect(X(xC) - 8, Z(zI) - 5, 16, 10); g.strokeStyle = CL.blue; g.beginPath(); g.moveTo(X(xC), Z(zI) + 5); g.lineTo(X(xC), Z(zC)); g.stroke(); txt(g, 'C', X(xC) - 4, Z(zC) + 16, ink(), 14);
    txt(g, 'Máy tại C. Đỏ: đường ngắm thực (có lỗi) · Xanh: đường ngắm nằm ngang đúng', 50, 16, ink(), 12);
    txt(g, 'a₂', X(0) + 8, Z(zP[0]) + 4, CL.red, 12); txt(g, 'a₄', X(0) + 8, Z(zI) + 14, CL.green, 12);
  };
  qa(el, 'input').forEach(i => i.oninput = draw);
  qa(el, '#pre button').forEach(b => b.onclick = () => { qa(el, '#pre button').forEach(x => x.classList.toggle('on', x === b)); const v = PRE[b.dataset.k]; ['a1', 'b1', 'a2', 'b2'].forEach((id, i) => q(el, '#' + id).value = v[i]); draw(); }); draw();
};

// Sơ đồ đo cao nguyên lý: BS, FS, HPC
W.hpcDemo = el => {
  mk(el, `<canvas width="600" height="250" style="width:100%"></canvas>` + slider('rl', 'RL của A', 90, 110, 0.5, 100, ' m') + slider('bs', 'Số đọc sau BS tại A', 1, 4, 0.05, 3, ' m') + slider('fs', 'Số đọc trước FS tại B', 0.5, 4, 0.05, 1, ' m') + `<div class="res" id="out"></div>`);
  const g = q(el, 'canvas').getContext('2d');
  const draw = () => {
    const rl = +q(el, '#rl').value, bs = +q(el, '#bs').value, fs = +q(el, '#fs').value, hpc = rl + bs, rb = hpc - fs, k = 22, yA = 165;
    const yB = yA - (rb - rl) * k, yH = yA - bs * k, gy = x => x < 110 ? yA : x > 430 ? yB : yA + (yB - yA) * (x - 110) / 320;
    g.clearRect(0, 0, 600, 250);
    g.strokeStyle = CL.grey; g.lineWidth = 2; g.beginPath(); g.moveTo(20, gy(20)); g.lineTo(110, gy(110)); g.lineTo(430, gy(430)); g.lineTo(580, gy(580)); g.stroke();
    g.fillStyle = 'rgba(200,170,90,.85)'; g.fillRect(106, yA - 3.8 * k, 8, 3.8 * k); g.fillRect(426, yB - 3.8 * k, 8, 3.8 * k);
    g.strokeStyle = CL.green; g.lineWidth = 1.5; g.setLineDash([6, 4]); g.beginPath(); g.moveTo(90, yH); g.lineTo(450, yH); g.stroke(); g.setLineDash([]);
    g.fillStyle = CL.blue; g.fillRect(262, yH - 10, 32, 12); g.strokeStyle = CL.blue; g.beginPath(); g.moveTo(270, yH + 2); g.lineTo(258, gy(258)); g.moveTo(286, yH + 2); g.lineTo(298, gy(298)); g.stroke();
    g.fillStyle = CL.red; [[110, yH], [430, yH]].forEach(([x, y]) => { g.beginPath(); g.arc(x, y, 4, 0, 7); g.fill(); });
    g.strokeStyle = CL.red; g.beginPath(); g.moveTo(122, yH); g.lineTo(122, yA); g.moveTo(418, yH); g.lineTo(418, yB); g.stroke();
    txt(g, 'A', 100, yA + 20, ink(), 14); txt(g, 'B', 424, yB + 20, ink(), 14); txt(g, 'HPC = ' + fmt(hpc, 3), 300, yH - 18, CL.green, 13, 'center');
    txt(g, 'BS = ' + fmt(bs, 2), 128, (yH + yA) / 2 + 4, CL.red, 12); txt(g, 'FS = ' + fmt(fs, 2), 340, (yH + yB) / 2 + 4, CL.red, 12);
    q(el, '#out').innerHTML = `HPC = RL<sub>A</sub> + BS = ${fmt(rl, 3)} + ${fmt(bs, 3)} = <b>${fmt(hpc, 3)} m</b> · RL<sub>B</sub> = HPC − FS = <b>${fmt(rb, 3)} m</b><br>BS − FS = ${fmt(bs - fs, 3)} → ${bs - fs >= 0 ? '<b>độ dâng (rise)</b> từ A đến B' : '<b>độ hạ (fall)</b> từ A đến B'} ⇒ RL<sub>B</sub> = RL<sub>A</sub> + (BS − FS) = ${fmt(rl + bs - fs, 3)} m`;
  };
  qa(el, 'input').forEach(i => i.addEventListener('input', () => { q(el, '#' + i.id + 'v').textContent = (+i.value).toFixed(2).replace('.', ',') + ' m'; draw(); })); draw();
};

// Sổ đo cao: Rise & Fall và HPC
W.levelBook = el => {
  const EX = [['1,5', '', '', 'TBM (60,5) · 1A'], ['', '2.5', '', '2A'], ['', '4.0', '', '3A'], ['3.0', '', '2.0', '4A (1B) · điểm chuyển'], ['', '5.5', '', '2B'], ['6.0', '', '1.0', '3B (1C) · điểm chuyển'], ['', '', '3.0', '2C · TBM (65,1)']];
  EX[0][0] = '1.5';
  let rows = EX.map(r => ({ bs: r[0], is: r[1], fs: r[2], nm: r[3] })), m = 'rf';
  mk(el, `<div class="mtab"><button data-m="rf" class="on">Rise &amp; Fall (độ dâng – độ hạ)</button><button data-m="hpc">HPC (mặt phẳng ngắm)</button></div>` + field('rl0', 'RL điểm đầu (m)', 60.5) + field('rle', 'RL đã biết của điểm cuối (m)', 65.1) + `<div class="tw"><table id="tb"></table></div><div class="mtab"><button id="reset">↺ Trả về ví dụ 2</button><button id="add">+ Thêm hàng</button><button id="del">− Bớt hàng</button></div><div class="res" id="out"></div>`);
  const cell = (i, k) => `<input type="number" step="any" data-i="${i}" data-k="${k}" value="${rows[i][k]}" style="width:66px;padding:3px 5px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)">`;
  const val = s => s === '' || s == null ? null : parseFloat(String(s).replace(',', '.'));
  const calc = () => {
    const rl0 = num(el, 'rl0', 0), out = []; let ok = true, msg = '';
    let prev = null, hpc = null, rlp = null;
    rows.forEach((r, i) => {
      const bs = val(r.bs), is = val(r.is), fs = val(r.fs), rd = fs != null ? fs : is, o = { rise: '', fall: '', hpc: '', rl: '' };
      if (i === 0) { if (bs == null) { ok = false; msg = 'Hàng đầu phải có số đọc sau (BS).'; } else { o.rl = rl0; prev = bs; hpc = rl0 + bs; o.hpc = hpc; } }
      else if (ok) {
        if (rd == null) { ok = false; msg = 'Mỗi hàng sau hàng đầu cần có số đọc giữa (IS) hoặc số đọc trước (FS).'; }
        else if (prev == null) { ok = false; msg = 'Thiếu dữ liệu.'; }
        else { const d = prev - rd; o.rise = d > 0 ? d : ''; o.fall = d < 0 ? -d : ''; o.rl = rlp + d; if (Math.abs(hpc - rd - o.rl) > 1e-9) { /* hai phương pháp phải trùng */ } o.rlH = hpc - rd; prev = bs != null ? bs : rd; if (bs != null) { hpc = o.rlH + bs; o.hpc = hpc; } }
      }
      if (i === 0) o.rlH = rl0; rlp = o.rl === '' ? rlp : o.rl; out.push(o);
    });
    return { out, ok, msg };
  };
  const draw = (keepFocus) => {
    const { out, ok, msg } = calc(), hp = m === 'hpc';
    if (!keepFocus) q(el, '#tb').innerHTML = `<tr><th>Ghi chú</th><th>BS</th><th>IS</th><th>FS</th>${hp ? '<th>HPC</th>' : '<th>Rise</th><th>Fall</th>'}<th>RL</th></tr>` + rows.map((r, i) => `<tr><td>${r.nm || ('Điểm ' + (i + 1))}</td><td>${cell(i, 'bs')}</td><td>${cell(i, 'is')}</td><td>${cell(i, 'fs')}</td>${hp ? `<td id="c${i}h"></td>` : `<td id="c${i}u"></td><td id="c${i}d"></td>`}<td id="c${i}r"></td></tr>`).join('');
    out.forEach((o, i) => { const s = (id, v) => { const t = q(el, '#' + id); if (t) t.textContent = v === '' || v == null ? '' : fmt(v, 3); }; s('c' + i + 'h', o.hpc); s('c' + i + 'u', o.rise); s('c' + i + 'd', o.fall); s('c' + i + 'r', ok ? (hp ? o.rlH : o.rl) : ''); });
    if (!ok) { q(el, '#out').innerHTML = '<span style="color:' + CL.red + '">' + msg + '</span>'; return; }
    const sum = k => rows.reduce((a, r) => a + (val(r[k]) || 0), 0), sBS = sum('bs'), sFS = sum('fs'), sIS = sum('is'), first = out[0].rl, last = out[out.length - 1].rlH;
    const sR = out.reduce((a, o) => a + (o.rise || 0), 0), sF = out.reduce((a, o) => a + (o.fall || 0), 0);
    // kiểm tra HPC: tổng RL (trừ điểm đầu) = tổng (HPC × số IS/FS lấy từ HPC đó) − (ΣIS + ΣFS)
    let cur = null, cnt = 0, sumH = 0; rows.forEach((r, i) => { if (i > 0 && (val(r.is) != null || val(r.fs) != null)) cnt++; if (val(r.bs) != null) { if (cur != null) sumH += cur * cnt; cur = out[i].hpc; cnt = 0; } }); if (cur != null) sumH += cur * cnt;
    const sRL = out.slice(1).reduce((a, o) => a + o.rlH, 0), c1 = Math.abs(sBS - sFS - (last - first)) < 1e-6, c2 = Math.abs(sR - sF - (last - first)) < 1e-6, c3 = Math.abs(sRL - (sumH - sIS - sFS)) < 1e-6, ble = num(el, 'rle', last);
    const mk1 = b => b ? '<span style="color:' + CL.green + '">✓</span>' : '<span style="color:' + CL.red + '">✗</span>';
    q(el, '#out').innerHTML = `ΣBS = ${fmt(sBS, 3)} · ΣFS = ${fmt(sFS, 3)} → ΣBS − ΣFS = <b>${fmt(sBS - sFS, 3)}</b> · RL cuối − RL đầu = <b>${fmt(last - first, 3)}</b> ${mk1(c1)}<br>Σrise − Σfall = ${fmt(sR, 3)} − ${fmt(sF, 3)} = <b>${fmt(sR - sF, 3)}</b> ${mk1(c2)} · Σ RL (trừ điểm đầu) = ${fmt(sRL, 3)}; ΣHPC·n − Σ(IS+FS) = ${fmt(sumH, 3)} − ${fmt(sIS + sFS, 3)} = ${fmt(sumH - sIS - sFS, 3)} ${mk1(c3)}<br>Sai số khép độ cao: RL tính được ở điểm cuối − RL đã biết = ${fmt(last, 3)} − ${fmt(ble, 3)} = <b>${fmt(last - ble, 3)} m</b>`;
  };
  el.addEventListener('input', e => { const t = e.target; if (t.dataset && t.dataset.i != null) { rows[+t.dataset.i][t.dataset.k] = t.value; draw(true); } else draw(true); });
  qa(el, '.mtab button[data-m]').forEach(b => b.onclick = () => { m = b.dataset.m; qa(el, '.mtab button[data-m]').forEach(x => x.classList.toggle('on', x === b)); draw(); });
  q(el, '#reset').onclick = () => { rows = EX.map(r => ({ bs: r[0], is: r[1], fs: r[2], nm: r[3] })); q(el, '#rl0').value = 60.5; q(el, '#rle').value = 65.1; draw(); };
  q(el, '#add').onclick = () => { rows.push({ bs: '', is: '', fs: '', nm: '' }); draw(); };
  q(el, '#del').onclick = () => { if (rows.length > 2) rows.pop(); draw(); };
  draw();
};

</script>
<script>
/* Khung ứng dụng: mục lục, định tuyến theo hash, tiến độ học, giao diện sáng/tối.
   Đổi SITE.title / SITE.sub cho từng môn. Không chứa câu hỏi kiểm tra (quiz làm ở web khác). */
const SITE = { title: 'TRẮC ĐỊA CÔNG TRÌNH', sub: 'Giảng viên: TS. Đào Hồng Hải' };
const CH = window.CHAPTERS;
const $ = (s, r = document) => r.querySelector(s);
const side = $('#side'), main = $('#main');
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let done = store.get('done', {});
const colors = ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--accent)'];
const col = i => colors[i % colors.length];

function buildSide() {
  const total = CH.reduce((n, c) => n + c.sections.length, 0), got = Object.keys(done).length;
  side.innerHTML = `<h1>${SITE.title}</h1><div class="sub">${SITE.sub}</div>
  <div class="bar"><i style="width:${Math.round(got / total * 100)}%"></i></div>
  <div class="sub" style="margin-top:4px">Đã học ${got}/${total} mục</div>
  <div class="chap"><button data-go="home"><span class="num" style="background:var(--accent)">⌂</span>Trang chủ</button></div>` +
    CH.map((c, i) => `<div class="chap" data-c="${c.id}"><button data-toggle="${c.id}"><span class="num" style="background:${col(i)}">${c.num}</span>${c.title}</button>
    <div class="sec">${c.sections.map(s => `<a href="#${c.id}/${s.id}" data-s="${c.id}/${s.id}"><span>${s.title}</span><span class="tick">${done[c.id + '/' + s.id] ? '✓' : ''}</span></a>`).join('')}</div></div>`).join('') +
    `<div class="tools"><button id="theme">🌓 Sáng/Tối</button><button id="reset">↺ Xoá tiến độ</button></div>`;
}
side.addEventListener('click', e => {
  const t = e.target.closest('[data-toggle]');
  if (t) { t.parentElement.classList.toggle('open'); return; }
  const g = e.target.closest('[data-go]');
  if (g) { location.hash = ''; side.classList.remove('on'); }
  if (e.target.closest('a')) side.classList.remove('on');
  if (e.target.id === 'theme') { const d = document.documentElement.dataset.theme === 'dark'; document.documentElement.dataset.theme = d ? '' : 'dark'; store.set('theme', d ? '' : 'dark'); }
  if (e.target.id === 'reset' && confirm('Xoá toàn bộ tiến độ học?')) { done = {}; store.set('done', done); buildSide(); route(); }
});
$('#menuBtn').onclick = () => side.classList.toggle('on');
document.documentElement.dataset.theme = store.get('theme', '');

function mark(key) { if (!done[key]) { done[key] = 1; store.set('done', done); buildSide(); openActive(); } }
function openActive() {
  const h = location.hash.slice(1), cid = h.split('/')[0];
  document.querySelectorAll('.chap').forEach(c => c.classList.toggle('open', c.dataset.c === cid));
  document.querySelectorAll('.sec a').forEach(a => a.classList.toggle('active', a.dataset.s === h));
}
function home() {
  main.innerHTML = `<div class="hero"><span class="pill">Web học tập tương tác</span><h2>${SITE.title}</h2><p>Bài giảng từng chương, có hình minh hoạ tương tác.</p></div>
  <div class="grid">${CH.map((c, i) => `<a class="mini click" style="text-decoration:none;color:inherit;border-top:5px solid ${col(i)}" href="#${c.id}/${c.sections[0].id}"><h4>Chương ${c.num}. ${c.title}</h4><div style="font-size:14px;color:var(--muted)">${c.blurb || ''}</div><div style="margin-top:8px;font-size:13px"><b>${c.sections.length}</b> bài</div></a>`).join('')}</div>`;
  mountWidgets(main); openActive();
}
function chapterPage(c, s) {
  const i = c.sections.indexOf(s), prev = c.sections[i - 1], next = c.sections[i + 1];
  main.innerHTML = `<div class="crumb">Chương ${c.num} · ${c.title}</div><h2 class="st">${s.title}</h2>${s.html}
  <div class="pager">${prev ? `<a class="btn" href="#${c.id}/${prev.id}">← ${prev.title}</a>` : '<span></span>'}${next ? `<a class="btn primary" href="#${c.id}/${next.id}">${next.title} →</a>` : '<span></span>'}</div>`;
  mountWidgets(main); mark(c.id + '/' + s.id);
}
function route() {
  const h = location.hash.slice(1); window.scrollTo(0, 0);
  if (!h) home();
  else {
    const [cid, sid] = h.split('/'), c = CH.find(x => x.id === cid);
    if (!c) home(); else chapterPage(c, c.sections.find(x => x.id === sid) || c.sections[0]);
  }
  openActive();
}
window.addEventListener('hashchange', route);
buildSide(); route();

</script>
</body>
</html>
