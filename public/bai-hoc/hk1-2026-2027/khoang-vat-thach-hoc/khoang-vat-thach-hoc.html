 sections:[
 {id:'magma-la-gi', title:'1. Magma và nguồn gốc magma', html:`
 <div class="card"><h3>Mục tiêu chương</h3><ul>
 <li>Giải thích magma là gì và magma hình thành như thế nào.</li>
 <li>Mô tả quá trình magma nguội và kết tinh.</li>
 <li>Nhận biết các thành phần hoá học chính của magma/đá magma và liên hệ với thành phần khoáng vật.</li>
 <li>Phân biệt các kiến trúc và cấu tạo phổ biến của đá magma.</li>
 <li>Dựa vào kiến trúc, cấu tạo và khoáng vật để suy luận sơ bộ điều kiện thành tạo.</li></ul></div>
 <h3>Magma là gì?</h3>
 <p><b>Magma</b> là vật chất nóng chảy tự nhiên tồn tại bên dưới bề mặt Trái Đất, gồm <b>ba pha chính: lỏng, rắn và khí</b>. Magma <b>không đơn thuần là chất lỏng nóng chảy</b> mà là một hệ đa pha.</p>
 <div class="tw"><table><tr><th>Pha</th><th>Đặc điểm</th><th>Tỷ lệ</th></tr>
 <tr><td><b>Pha lỏng (melt)</b></td><td>Silicate nóng chảy (dung thể magma); chứa các nguyên tố hoà tan (Si, Al, Mg, Ca, Na, K…)</td><td>Chiếm tỷ lệ lớn nhất (thường 70–90%)</td></tr>
 <tr><td><b>Pha rắn (crystals)</b></td><td>Tinh thể khoáng vật (olivine, pyroxene, plagioclase…); hình thành khi magma nguội dần</td><td>Thường 0–30%</td></tr>
 <tr><td><b>Pha khí (volatiles)</b></td><td>Các chất dễ bay hơi: H₂O, CO₂, SO₂, HCl, HF… Tồn tại dưới dạng bọt khí và khí hoà tan trong magma</td><td>Nhỏ (thường 0–10%)</td></tr></table></div>
 <div class="note"><b>Magma và dung nham</b>Magma ở dưới mặt đất; khi phun lên mặt đất, phần lỏng gọi là dung nham (lava). Magma nguội kết tinh thành đá magma: đá xâm nhập (nguội chậm ở sâu) hoặc đá phun trào (nguội nhanh gần/trên bề mặt).</div>
 <h3>Magma hình thành ở đâu?</h3>
 <p>Magma hình thành ở <b>thạch quyển và manti trên (quyển mềm)</b>, nhiều nhất ở ba môi trường kiến tạo. Bấm từng thẻ:</p>
 <div class="card"><div data-w="pick" data-k="setting"></div></div>
 <div class="tw"><table><tr><th></th><th>Ria tách giãn</th><th>Đới hút chìm</th><th>Điểm nóng</th></tr>
 <tr><td><b>Bối cảnh tạo</b></td><td>Các mảng tách nhau</td><td>Mảng đại dương hút chìm</td><td>Cột manti nóng</td></tr>
 <tr><td><b>Cơ chế nóng chảy</b></td><td>Giảm áp suất</td><td>Thêm chất bay hơi</td><td>Tăng nhiệt độ</td></tr>
 <tr><td><b>Thành phần magma chủ yếu</b></td><td>Mafic</td><td>Đa dạng (mafic → felsic)</td><td>Mafic</td></tr>
 <tr><td><b>Sản phẩm địa chất tiêu biểu</b></td><td>Sống núi giữa đại dương</td><td>Cung núi lửa</td><td>Chuỗi núi lửa điểm nóng</td></tr></table></div>
 <h3>Cơ chế tạo magma</h3>
 <p>Đá manti và vỏ nóng chảy <b>từng phần</b> (không phải toàn bộ). Có ba cách làm đá nóng chảy:</p>
 <div class="card"><div data-w="pick" data-k="origin"></div></div>
 <div class="key"><b>Tóm lại</b>Giảm áp → nóng chảy giảm áp · Thêm H₂O/CO₂ → hạ nhiệt độ nóng chảy · Tăng nhiệt độ → nóng chảy do truyền nhiệt. Cả ba đều dẫn đến <b>nóng chảy từng phần</b>.</div>`},

 {id:'tien-hoa', title:'2. Các loại magma và tiến hoá magma', html:`
 <p>Magma ban đầu không đứng yên: nó nguội, kết tinh, tương tác với đá vây quanh và có thể biến đổi thành phần. Bài này trả lời: <b>có những loại magma nào, và magma thay đổi thành phần như thế nào?</b></p>
 <h3>Các loại magma chính</h3>
 <div class="tw"><table><tr><th></th><th>Basalt (mafic)</th><th>Andesite (intermediate)</th><th>Rhyolite (felsic)</th></tr>
 <tr><td><b>Hàm lượng SiO₂</b></td><td>Thấp (≈ 45–52%)</td><td>Trung bình (≈ 52–63%)</td><td>Cao (≈ 63–77%)</td></tr>
 <tr><td><b>Giàu</b></td><td>Fe, Mg, Ca</td><td>Al, Ca, Na, K</td><td>K, Na, Al</td></tr>
 <tr><td><b>Nhiệt độ</b></td><td>Cao (≈ 1100–1200 °C)</td><td>Trung bình (≈ 800–1000 °C)</td><td>Thấp (≈ 650–800 °C)</td></tr>
 <tr><td><b>Độ nhớt</b></td><td>Thấp</td><td>Trung bình</td><td>Cao</td></tr>
 <tr><td><b>Hàm lượng khí</b></td><td>Ít khí hoà tan</td><td>Vừa phải</td><td>Nhiều</td></tr>
 <tr><td><b>Kiểu phun trào</b></td><td>Dễ (dung nham chảy xa)</td><td>Cả phun trào dễ và nổ; thường tạo núi lửa tầng (stratovolcano)</td><td>Thường là phun trào nổ mạnh, tạo tro, dòng pyroclastic</td></tr></table></div>
 <h3>Quá trình tiến hoá magma</h3>
 <p>Magma ban đầu có thể đổi thành phần theo nhiều cơ chế:</p>
 <div class="card"><div data-w="pick" data-k="evolve"></div></div>
 <h4>Hướng tiến hoá chung và kết quả</h4>
 <ul><li>Hướng chung: <b>Mafic → Felsic</b>: hàm lượng SiO₂ tăng, nhiệt độ giảm, độ nhớt tăng.</li>
 <li>Thành phần hoá học thay đổi (thường giàu SiO₂ hơn), nhiệt độ giảm, độ nhớt tăng, kiểu phun trào chuyển từ phun trào dễ → nổ mạnh.</li>
 <li>Tạo các loại đá magma khác nhau: <b>basalt – andesite – dacite – rhyolite</b> (từ mafic đến felsic).</li></ul>
 <div class="note"><b>Chuỗi tiến hoá ví dụ</b>Basalt (mafic: giàu Fe, Mg, Ca) → Andesite (trung gian) → Dacite (trung gian – giàu SiO₂ hơn) → Rhyolite (felsic: giàu SiO₂, K, Na).</div>
 <h3>Dãy phản ứng Bowen – nguyên tắc và ý nghĩa</h3>
 <p>(Hình tương tác ở bài 13 của Chương 3.) Dãy Bowen mô tả thứ tự kết tinh khoáng vật khi magma nguội từ từ ở điều kiện áp suất thấp (môi trường bề mặt).</p>
 <ul><li>Khoáng vật kết tinh sớm ở nhiệt độ cao, khoáng vật kết tinh muộn ở nhiệt độ thấp hơn.</li>
 <li>Hai nhánh: <b>không liên tục</b> (olivine → pyroxene → amphibole → biotite) và <b>liên tục</b> (plagioclase đổi từ giàu Ca → giàu Na).</li>
 <li>Các khoáng vật muộn: K-feldspar, quartz và muscovite.</li></ul>
 <div class="tw"><table><tr><th>Ý nghĩa địa chất</th></tr>
 <tr><td>Giải thích sự thay đổi thành phần khoáng vật của đá magma từ mafic đến felsic.</td></tr>
 <tr><td>Khoáng vật kết tinh sớm có nhiệt độ cao, giàu Mg, Fe (dễ bị phong hoá); khoáng vật kết tinh muộn nhiệt độ thấp, giàu Si, Na, K (ổn định hơn).</td></tr>
 <tr><td>Có thể dùng để dự đoán trình tự kết tinh khoáng vật, thành phần đá và quá trình phân hoá magma.</td></tr></table></div>
 <div class="card"><h3>Dãy phản ứng Bowen – kéo để làm nguội magma</h3><div data-w="bowen"></div></div>`},

 {id:'thanh-phan-hoa-hoc', title:'3. Thành phần hoá học của đá magma', html:`
 <p>Thành phần hoá học của magma/đá magma được biểu diễn chủ yếu bằng <b>các oxit</b>. Bài này trả lời: <b>có những oxit nào, chiếm bao nhiêu, và SiO₂ quyết định điều gì?</b></p>
 <h3>Các oxit chính trong đá magma</h3>
 <div class="tw"><table><tr><th>Oxit</th><th>Trung bình vỏ Trái Đất (%)</th><th>Trong đá magma điển hình (%)</th></tr>
 <tr><td>SiO₂</td><td>59,7</td><td>45–77</td></tr><tr><td>Al₂O₃</td><td>15,4</td><td>12–18</td></tr>
 <tr><td>FeO + Fe₂O₃ (tổng Fe)</td><td>7,7</td><td>2–15</td></tr><tr><td>MgO</td><td>4,9</td><td>0,5–12</td></tr>
 <tr><td>CaO</td><td>3,6</td><td>1–12</td></tr><tr><td>Na₂O</td><td>2,8</td><td>1–6</td></tr>
 <tr><td>K₂O</td><td>2,6</td><td>0,1–6</td></tr><tr><td>TiO₂</td><td>0,4</td><td>0,1–3</td></tr>
 <tr><td>MnO</td><td>0,1</td><td>0–0,3</td></tr><tr><td>P₂O₅</td><td>0,1</td><td>0–1</td></tr>
 <tr><td>Các oxit khác</td><td>2,7</td><td>&lt; 1</td></tr></table></div>
 <p>Cột trung bình cộng đủ 100%: 59,7 + 15,4 + 7,7 + 4,9 + 3,6 + 2,8 + 2,6 + 0,4 + 0,1 + 0,1 + 2,7 = 100,0%. SiO₂ chiếm tỷ lệ lớn nhất (gần 60%), tiếp theo là Al₂O₃.</p>
 <h3>Các nhóm nguyên tố trong đá magma</h3>
 <div class="tw"><table><tr><th>Nhóm</th><th>Hàm lượng</th><th>Nguyên tố</th></tr>
 <tr><td><b>Nguyên tố chính (major)</b></td><td>&gt; 1%</td><td>Si, Al, Fe, Mg, Ca, Na, K</td></tr>
 <tr><td><b>Nguyên tố thứ yếu (minor)</b></td><td>0,1–1%</td><td>Ti, Mn, P, …</td></tr>
 <tr><td><b>Nguyên tố vi lượng (trace)</b></td><td>&lt; 0,1%</td><td>Rb, Sr, Ba, Zr, Nb, Y, Th, U, REE, …</td></tr>
 <tr><td><b>Nguyên tố không động (immobile)</b></td><td>–</td><td>Ít bị di chuyển trong quá trình phong hoá (nhóm HFSE): Zr, Ti, Nb, Y, …</td></tr></table></div>
 <h3>Thành phần hoá học theo loại magma (trung bình, % khối lượng)</h3>
 <div class="card"><div data-w="oxides"></div></div>
 <div class="tw"><table><tr><th>Loại magma</th><th>SiO₂</th><th>Al₂O₃</th><th>FeO+Fe₂O₃</th><th>MgO</th><th>CaO</th><th>Na₂O+K₂O</th></tr>
 <tr><td>Ultramafic</td><td>&lt; 45</td><td>2–8</td><td>8–18</td><td>18–38</td><td>6–14</td><td>&lt; 2</td></tr>
 <tr><td>Mafic</td><td>45–52</td><td>12–18</td><td>8–14</td><td>4–12</td><td>8–14</td><td>2–6</td></tr>
 <tr><td>Intermediate</td><td>52–63</td><td>15–18</td><td>5–10</td><td>2–6</td><td>4–8</td><td>4–8</td></tr>
 <tr><td>Felsic</td><td>63–77</td><td>12–16</td><td>1–6</td><td>&lt; 2</td><td>1–4</td><td>6–10</td></tr></table></div>
 <div class="key"><b>Xu hướng mafic → felsic</b>SiO₂, Na₂O + K₂O tăng; FeO + Fe₂O₃, MgO, CaO giảm. Tính chất: mafic giàu Fe–Mg–Ca; felsic giàu Si–Na–K; intermediate ở giữa.</div>
 <div class="note"><b>Biểu đồ TAS (Total Alkali–Silica)</b>Phân loại đá phun trào theo SiO₂ (trục ngang) và tổng kiềm Na₂O + K₂O (trục dọc): các trường basalt, andesite, dacite, rhyolite xếp từ thấp đến cao theo SiO₂.</div>`},

 {id:'sio2', title:'4. Hàm lượng SiO₂ và tính chất magma', html:`
 <p>SiO₂ là “chìa khoá” để hiểu magma. Bài này trả lời: <b>SiO₂ quyết định tên gọi, độ nhớt, nhiệt độ và kiểu phun trào của magma như thế nào?</b></p>
 <h3>Vai trò của SiO₂</h3>
 <ul><li>SiO₂ là oxit chính, chiếm tỷ lệ lớn nhất trong hầu hết các đá magma.</li>
 <li>Ảnh hưởng đến <b>độ nhớt, nhiệt độ kết tinh và kiểu phun trào</b>.</li>
 <li>Quyết định thành phần khoáng vật chính và tên gọi của đá magma.</li>
 <li>Hàm lượng SiO₂ càng cao → độ nhớt càng lớn, magma khó chảy hơn và dễ phun trào nổ.</li></ul>
 <h3>Phân loại theo hàm lượng SiO₂</h3>
 <div class="tw"><table><tr><th>Loại đá magma</th><th>SiO₂ (% khối lượng)</th><th>Ví dụ đá</th><th>Màu sắc</th></tr>
 <tr><td>Ultramafic</td><td>&lt; 45</td><td>Peridotite, komatiite</td><td>Sẫm</td></tr>
 <tr><td>Mafic</td><td>45–52</td><td>Basalt, gabbro</td><td>Sẫm</td></tr>
 <tr><td>Intermediate</td><td>52–63</td><td>Andesite, diorite</td><td>Trung bình</td></tr>
 <tr><td>Felsic</td><td>63–77</td><td>Dacite, rhyolite, granite</td><td>Sáng</td></tr></table></div>
 <p>Cụ thể hơn: peridotite ≈ 40–44%, basalt ≈ 45–52%, andesite ≈ 52–63%, dacite ≈ 63–69%, granite/rhyolite ≈ 70–77%.</p>
 <h3>Kéo thanh trượt để xem tính chất</h3>
 <div class="card"><div data-w="silica"></div></div>
 <h3>Tóm tắt mối quan hệ SiO₂ – tính chất magma</h3>
 <div class="tw"><table><tr><th>Đặc điểm</th><th>Mafic (45–52% SiO₂)</th><th>Intermediate (52–63%)</th><th>Felsic (63–77%)</th></tr>
 <tr><td>Độ nhớt</td><td>Thấp</td><td>Trung bình</td><td>Cao</td></tr>
 <tr><td>Nhiệt độ magma (°C)</td><td>1100–1200</td><td>≈ 800–1000</td><td>650–800</td></tr>
 <tr><td>Tính lưu động</td><td>Cao (dễ chảy)</td><td>Trung bình</td><td>Thấp (khó chảy)</td></tr>
 <tr><td>Dễ thoát khí</td><td>Dễ</td><td>Hỗn hợp</td><td>Khó</td></tr>
 <tr><td>Kiểu phun trào thường gặp</td><td>Trào chảy (effusive)</td><td>Hỗn hợp (mixed)</td><td>Nổ (explosive)</td></tr>
 <tr><td>Ví dụ đá</td><td>Basalt</td><td>Andesite</td><td>Dacite, rhyolite</td></tr></table></div>
 <p>Dạng dung nham: basalt (SiO₂ ≈ 45–52%) → dung nham pahoehoe, độ nhớt thấp, dễ chảy, rộng, dạng mỏng; andesite → dung nham aa dày hơn, độ nhớt trung bình; rhyolite/dacite (SiO₂ cao) → dung nham ngắn, dày, độ nhớt cao, khó chảy, thường tạo vòm dung nham (dome), dễ nổ. Kiểu phun trào từ nhẹ đến mạnh: <b>trào chảy → Strombolian → Vulcanian → Plinian</b>.</p>
 <div class="warn"><b>Kết luận chính</b>SiO₂ càng cao → magma càng nhớt, nhiệt độ kết tinh thấp, dễ phun trào nổ. SiO₂ càng thấp → magma loãng, nhiệt độ kết tinh cao, thường phun trào trào chảy. Hàm lượng SiO₂ là tiêu chí quan trọng để phân loại đá magma.</div>`},

 {id:'khoang-vat-magma', title:'5. Thành phần khoáng vật của đá magma', html:`
 <p>Thành phần hoá học quyết định khoáng vật nào kết tinh. Bài này trả lời: <b>đá magma thường chứa những khoáng vật nào, và chúng thay đổi thế nào từ mafic đến felsic?</b></p>
 <h3>1. Khoáng vật tạo đá (silicate chính)</h3>
 <div class="tw"><table><tr><th>Nhóm</th><th>Khoáng vật · công thức</th><th>Ghi chú</th></tr>
 <tr><td>Olivine</td><td>(Mg,Fe)₂SiO₄</td><td>Thường gặp ở đá mafic; nhiệt độ kết tinh cao</td></tr>
 <tr><td>Pyroxene</td><td>(Ca,Mg,Fe)Si₂O₆</td><td>Phổ biến trong đá mafic và intermediate; nhiệt độ kết tinh cao đến trung bình</td></tr>
 <tr><td>Amphibole</td><td>(Ca,Na)₂(Mg,Fe,Al)₅Si₈O₂₂(OH)₂</td><td>Phổ biến trong đá intermediate; nhiệt độ kết tinh trung bình</td></tr>
 <tr><td>Mica (biotite)</td><td>K(Mg,Fe)₃AlSi₃O₁₀(OH)₂</td><td>Phổ biến trong đá intermediate và felsic; nhiệt độ kết tinh trung bình đến thấp</td></tr>
 <tr><td>Feldspar</td><td>K-feldspar KAlSi₃O₈; plagioclase (Na,Ca)(Al,Si)₄O₈</td><td>Rất phổ biến trong hầu hết đá magma; plagioclase thay đổi từ giàu Ca (mafic) đến giàu Na (felsic)</td></tr>
 <tr><td>Quartz</td><td>SiO₂</td><td>Đặc trưng của đá felsic; nhiệt độ kết tinh thấp</td></tr></table></div>
 <h3>2. Khoáng vật phụ (accessory minerals)</h3>
 <p>Magnetite (Fe₃O₄), ilmenite (FeTiO₃), apatite Ca₅(PO₄)₃(F,Cl,OH), zircon (ZrSiO₄), titanite (CaTiSiO₅), allanite…. Hàm lượng thường thấp (&lt; 5% thể tích); giàu các nguyên tố vết (Ti, Zr, P, REE…); có giá trị trong xác định nguồn gốc magma và quá trình kiến tạo.</p>
 <h3>3. Thành phần khoáng vật điển hình theo loại đá</h3>
 <div class="tw"><table><tr><th>Đá mafic (basalt)</th><th>Đá intermediate (andesite)</th><th>Đá felsic (dacite, rhyolite, granite)</th></tr>
 <tr><td>Plagioclase giàu Ca 40–60%; pyroxene 20–40%; olivine 5–15%; khoáng vật phụ (magnetite, ilmenite…) &lt; 5%</td><td>Plagioclase trung gian 40–60%; amphibole 10–30%; pyroxene 0–20%; biotite (thường ít); khoáng vật phụ &lt; 5%</td><td>Quartz 20–35%; K-feldspar 20–40%; plagioclase giàu Na 20–40%; biotite, muscovite; khoáng vật phụ (zircon, apatite…) &lt; 5%</td></tr></table></div>
 <h3>4. Xu hướng thay đổi theo SiO₂</h3>
 <ul><li><b>Mafic (SiO₂ thấp):</b> olivine, pyroxene (đá điển hình: basalt, gabbro).</li>
 <li><b>Intermediate:</b> amphibole (andesite, diorite).</li>
 <li><b>Felsic (SiO₂ cao):</b> biotite, K-feldspar, quartz (dacite, rhyolite, granite).</li></ul>
 <div class="key"><b>Kết luận</b>Thành phần khoáng vật của đá magma phụ thuộc chủ yếu vào thành phần hoá học (đặc biệt là SiO₂) và điều kiện kết tinh. Magma mafic giàu olivine, pyroxene; magma felsic giàu K-feldspar, plagioclase Na và quartz. Sự thay đổi thành phần khoáng vật là kết quả trực tiếp của quá trình kết tinh sớm → muộn (kết tinh phân đoạn magma theo chuỗi phản ứng Bowen).</div>
 <h3>Sự thay đổi thành phần và tính chất: tổng hợp</h3>
 <div class="tw"><table><tr><th></th><th>Felsic</th><th>Intermediate</th><th>Mafic</th><th>Ultramafic</th></tr>
 <tr><td>Đá ví dụ</td><td>Granite / rhyolite (63–77% SiO₂)</td><td>Diorite / andesite (52–63%)</td><td>Gabbro / basalt (45–52%)</td><td>Peridotite (&lt; 45%)</td></tr>
 <tr><td>Khoáng vật chính</td><td>Quartz, K-feldspar, mica (giàu khoáng vật sáng)</td><td>Plagioclase trung gian, amphibole, biotite (hỗn hợp sáng và tối)</td><td>Plagioclase giàu Ca, pyroxene, olivine (giàu khoáng vật tối)</td><td>Olivine, pyroxene (rất giàu khoáng vật tối)</td></tr>
 <tr><td>Nhiệt độ kết tinh (°C)</td><td>650–800</td><td>≈ 800–1000</td><td>1100–1200</td><td>&gt; 1200</td></tr>
 <tr><td>Độ nhớt</td><td>Cao</td><td>Trung bình</td><td>Thấp</td><td>Rất thấp</td></tr>
 <tr><td>Kiểu phun trào</td><td>Nổ (explosive)</td><td>Hỗn hợp (mixed)</td><td>Trào chảy (effusive)</td><td>Trào chảy (hiếm; dung nham rất nóng)</td></tr></table></div>
 <p>Theo hướng Felsic → Mafic → Ultramafic: SiO₂ và Na₂O + K₂O giảm dần, Fe, Mg, Ca tăng dần.</p>
 <h3>Hai nhóm đá magma lớn</h3>
 <div class="tw"><table><tr><th>Đặc điểm</th><th>Đá felsic (granite, rhyolite)</th><th>Đá mafic (gabbro, basalt)</th></tr>
 <tr><td>Hàm lượng SiO₂</td><td>Cao (63–77%)</td><td>Thấp (45–52%)</td></tr>
 <tr><td>Màu sắc</td><td>Sáng (trắng, xám, hồng)</td><td>Sẫm (xám, đen)</td></tr>
 <tr><td>Khoáng vật chính</td><td>Quartz, K-feldspar, plagioclase Na, mica (muscovite, biotite)</td><td>Plagioclase Ca, pyroxene, olivine, amphibole</td></tr>
 <tr><td>Khoáng vật phụ</td><td>Zircon, apatite, magnetite, ilmenite…</td><td>Magnetite, ilmenite, apatite, chrome spinel…</td></tr>
 <tr><td>Độ nhớt magma</td><td>Cao</td><td>Thấp</td></tr>
 <tr><td>Nhiệt độ kết tinh</td><td>650–800 °C</td><td>1100–1200 °C</td></tr>
 <tr><td>Kiểu phun trào thường gặp</td><td>Nổ (explosive)</td><td>Trào chảy (effusive)</td></tr></table></div>
 <div class="note"><b>Phân bố trong vỏ Trái Đất</b>Theo diện tích bề mặt vỏ Trái Đất, đá mafic chiếm phần lớn (~70%), chủ yếu ở vỏ đại dương; đá felsic chiếm khoảng 30%, chủ yếu ở vỏ lục địa. Sự khác biệt này phản ánh vai trò của thành phần hoá học magma và quá trình tiến hoá vỏ Trái Đất.</div>
 <div class="card"><h3>Xem trực quan: thành phần khoáng vật và chỉ số màu</h3><div data-w="rockmix"></div></div>`},

 {id:'kien-truc', title:'6. Kiến trúc của đá magma', html:`
 <p><b>Kiến trúc (texture)</b> là đặc điểm về <b>kích thước, hình dạng và quan hệ giữa các tinh thể</b> trong đá. Nó cho biết magma đã nguội như thế nào: nhanh hay chậm, sâu hay nông. Bài này trả lời: <b>có những kiến trúc nào và mỗi kiến trúc nói lên điều gì?</b></p>
 <div class="card"><h3>Sáu kiến trúc chính (bấm để xem minh hoạ)</h3><div data-w="texture"></div></div>
 <div class="tw"><table><tr><th>Kiến trúc</th><th>Đặc điểm chính</th><th>Ví dụ đá</th></tr>
 <tr><td><b>Hiển tinh (phaneritic)</b></td><td>Tinh thể lớn (&gt; 1 mm), dễ quan sát bằng mắt thường; hình thành do magma nguội chậm ở sâu</td><td>Granite, diorite, gabbro, peridotite</td></tr>
 <tr><td><b>Ẩn tinh (aphanitic)</b></td><td>Tinh thể rất nhỏ (&lt; 1 mm), không quan sát được bằng mắt thường; do magma nguội nhanh gần bề mặt. Có thể có một khối ẩn tinh hoàn toàn hoặc chứa các tinh thể lớn rải rác</td><td>Basalt, andesite, rhyolite, scoria</td></tr>
 <tr><td><b>Nổi ban (porphyritic)</b></td><td>Hai cỡ hạt rõ rệt: tinh thể lớn (phenocryst) trong nền hạt mịn (groundmass). Do thay đổi tốc độ nguội: nguội chậm ở sâu (tạo phenocryst), sau đó magma lên gần bề mặt và nguội nhanh (tạo nền mịn)</td><td>Andesite porphyritic, granite porphyry, basalt porphyritic, rhyolite porphyritic</td></tr>
 <tr><td><b>Thuỷ tinh (glassy)</b></td><td>Không có tinh thể (vô định hình); bề mặt nhẵn, bóng; vết vỡ vỏ sò; thường có màu sẫm (đen, nâu, xám). Magma nguội cực nhanh ngay tại bề mặt</td><td>Obsidian, thuỷ tinh núi lửa, tachylite</td></tr>
 <tr><td><b>Lỗ hổng (vesicular)</b></td><td>Có rất nhiều lỗ rỗng (vesicle) hình thành trong đá do khí thoát ra khi magma nguội nhanh gần bề mặt. Lỗ rỗng thường tròn, bầu dục hoặc không đều; có thể được lấp đầy bởi khoáng vật thứ sinh (calcite, zeolite, thạch anh…)</td><td>Scoria, pumice, vesicular basalt, vesicular andesite</td></tr>
 <tr><td><b>Mảnh vụn núi lửa (pyroclastic)</b></td><td>Cấu tạo từ các mảnh vụn núi lửa phun trào trong các vụ nổ; sau đó rơi xuống, lắng đọng và kết dính hoặc hàn kết, chứ không phải kết tinh trực tiếp từ magma</td><td>Tuff, tuff hàn kết, breccia núi lửa</td></tr></table></div>
 <div class="key"><b>Liên hệ tốc độ nguội</b>Tinh thể lớn (&gt; 1 mm) ← nguội chậm (ở sâu) · Tinh thể rất nhỏ/không có tinh thể ← nguội nhanh (gần bề mặt) · Mảnh vụn núi lửa ← nổ núi lửa.</div>
 <h4>Kích thước mảnh vụn núi lửa</h4>
 <div class="tw"><table><tr><th>Loại</th><th>Kích thước</th></tr><tr><td>Tro núi lửa (ash)</td><td>&lt; 2 mm</td></tr><tr><td>Lapilli</td><td>2–64 mm</td></tr><tr><td>Bom núi lửa (volcanic bomb)</td><td>&gt; 64 mm (thường tròn/thoi)</td></tr><tr><td>Khối núi lửa (block)</td><td>&gt; 64 mm (thường góc cạnh)</td></tr></table></div>
 <p>Đá mảnh vụn núi lửa thường có thành phần khoáng vật giống magma nguồn, có thể gồm các mảnh với kích thước khác nhau; mức độ gắn kết thay đổi (rời rạc → kết dính → hàn kết). Nó giúp nhận biết kiểu phun trào và mức độ nổ của núi lửa, môi trường lắng đọng và đánh giá nguy cơ núi lửa.</p>
 <h3>Ý nghĩa của kiến trúc</h3>
 <ul><li><b>Phản ánh tốc độ nguội:</b> hiển tinh (chậm) → ẩn tinh (nhanh) → thuỷ tinh (cực nhanh).</li>
 <li><b>Chỉ thị môi trường:</b> hiển tinh gặp trong đá xâm nhập; ẩn tinh, thuỷ tinh, lỗ hổng gặp trong đá phun trào.</li>
 <li><b>Lỗ hổng</b> cho biết magma có khí hoà tan; <b>nổi ban</b> cho biết lịch sử nguội hai giai đoạn; <b>mảnh vụn</b> cho biết núi lửa phun nổ.</li></ul>
 <div class="note"><b>Tổng hợp</b>Kích thước hạt và tốc độ nguội: tinh thể lớn (&gt; 1 mm) – nguội chậm (ở sâu); tinh thể nhỏ (&lt; 1 mm) đến không có tinh thể – nguội nhanh (gần bề mặt); mảnh vụn có kích thước khác nhau – phun nổ (núi lửa).</div>`},

 {id:'cau-tao', title:'7. Cấu tạo của đá magma', html:`
 <p><b>Cấu tạo (structure)</b> mô tả cách các thành phần của đá phân bố trong không gian ở quy mô lớn hơn (mẫu tay, lộ đá). Nếu kiến trúc là chuyện “cỡ hạt”, thì cấu tạo là chuyện “hình thái và sự sắp xếp”. Bài này trả lời: <b>10 cấu tạo phổ biến của đá magma là gì?</b></p>
 <div class="card"><h3>Mười cấu tạo (bấm để xem)</h3><div data-w="pick" data-k="struct"></div></div>
 <div class="tw"><table><tr><th>#</th><th>Cấu tạo</th><th>Đá thường gặp</th></tr>
 <tr><td>1</td><td>Hạt đều (equigranular)</td><td>Đá xâm nhập như granite</td></tr>
 <tr><td>2</td><td>Không đều (inequigranular)</td><td>Đá xâm nhập như diorite, gabbro</td></tr>
 <tr><td>3</td><td>Porphyritic (hai pha hạt)</td><td>Andesite, basalt porphyritic</td></tr>
 <tr><td>4</td><td>Thuỷ tinh (glassy)</td><td>Obsidian</td></tr>
 <tr><td>5</td><td>Lỗ hổng (vesicular)</td><td>Scoria, pumice, vesicular basalt</td></tr>
 <tr><td>6</td><td>Mảnh vụn núi lửa (pyroclastic)</td><td>Tuff, tuff hàn kết, breccia núi lửa</td></tr>
 <tr><td>7</td><td>Dòng (flow structure)</td><td>Basalt, rhyolite</td></tr>
 <tr><td>8</td><td>Amygdaloidal (hốc thạch anh)</td><td>Basalt</td></tr>
 <tr><td>9</td><td>Tầng (layering)</td><td>Gabbro, complex xâm nhập dạng tầng</td></tr>
 <tr><td>10</td><td>Cột (columnar jointing)</td><td>Basalt</td></tr></table></div>
 <h3>Cách “đọc” đá magma: tổng hợp</h3>
 <div class="key"><b>Dựa vào kiến trúc, cấu tạo và khoáng vật để suy luận sơ bộ điều kiện thành tạo</b>
 <ol><li><b>Khoáng vật + màu sắc</b> → thuộc loại felsic, intermediate hay mafic (và SiO₂ khoảng bao nhiêu).</li>
 <li><b>Kiến trúc (cỡ hạt)</b> → tốc độ nguội: sâu hay nông; có hai giai đoạn nguội (porphyritic) hay không.</li>
 <li><b>Cấu tạo (lỗ hổng, dòng, mảnh vụn, cột…)</b> → phun trào hay xâm nhập, có khí hay không, kiểu phun trào (trào chảy hay nổ).</li></ol></div>
 <p><b>Ví dụ suy luận:</b> một mẫu đá màu sẫm, nhiều lỗ hổng, nền ẩn tinh, có olivine và pyroxene → magma <b>mafic</b>, nguội nhanh gần/trên mặt đất, giàu khí → khả năng là <b>basalt lỗ hổng/scoria</b>, từ dung nham trào chảy hoặc phun trào nhẹ.</p>`}

    { id: 'mm-khai-niem', title: '8. Đá magma: khái niệm, độ nhớt và kết tinh', html: `
 <p>Bài này đặt khung cho phần còn lại của chương: <b>đá magma là gì, nằm ở đâu, và vì sao cùng một magma lại cho ra những đá trông khác nhau?</b></p>
 <div class="key"><b>Định nghĩa</b><b>Đá magma</b> hình thành do <b>magma nguội lạnh</b>. <b>Magma</b> là dung thể chủ yếu là <b>silicate nóng chảy</b>, thường ở nhiệt độ cao (≈ 600–1200 °C) và áp suất lớn, nên các <b>chất bốc</b> (H₂O, CO₂, S…) được giữ lại và hoà tan trong dung thể. Magma có thể chứa pha rắn (tinh thể) hoặc pha khí.</div>
 <h3>Độ nhớt quyết định khả năng di chuyển</h3>
 <p>Khả năng di chuyển của magma phụ thuộc vào <b>độ nhớt</b>. Độ nhớt lại phụ thuộc vào:</p>
 <div class="grid"><div class="mini"><h4>Độ acid</h4>Magma acid (nhiều SiO₂) nhớt hơn magma bazơ.</div><div class="mini"><h4>Hàm lượng chất bốc</h4>Nhiều chất bốc làm magma loãng hơn, di chuyển dễ hơn.</div><div class="mini"><h4>Nhiệt độ</h4>Nhiệt độ cao → ít nhớt.</div><div class="mini"><h4>Áp suất</h4>Áp suất giữ chất bốc trong dung thể.</div><div class="mini"><h4>Lượng tinh thể</h4>Nhiều tinh thể đã kết tinh → nhớt hơn.</div></div>
 <div class="note"><b>Magma và dung nham</b>Magma trào ra trên bề mặt Trái Đất gọi là <b>dung nham</b>. Từ magma đến đá magma, nhiệt độ giảm dần, áp suất giảm dần và lượng chất bốc còn lại ít hơn.</div>
 <h3>Xâm nhập hay phun trào?</h3>
 <div class="tw"><table><tr><th>Loại</th><th>Nơi thành tạo</th><th>Chi tiết</th></tr>
 <tr><td><b>Đá magma xâm nhập</b></td><td>Dưới mặt đất</td><td>Xâm nhập <b>sâu</b>: độ sâu lớn (&gt; 5 km); xâm nhập <b>nông</b>: gần mặt đất (&lt; 5 km)</td></tr>
 <tr><td><b>Đá magma phun trào</b></td><td>Trên mặt đất</td><td>Dung nham nguội nhanh ở bề mặt</td></tr></table></div>
 <h3>Vị trí của đá magma trong chu trình đá</h3>
 <div class="card"><p style="margin-top:0">Bấm từng quá trình để xem đá magma, trầm tích và biến chất chuyển hoá cho nhau thế nào (sơ đồ này dùng chung cho Chương 4–6).</p><div data-w="rockcycle"></div></div>
 <h3>Kết tinh: trình tự và tốc độ</h3>
 <ul><li><b>Kết tinh</b>: quá trình vật chất kết tinh từ khí, dung dịch hoặc trạng thái phân tán tạo thành tinh thể.</li>
 <li><b>Phân dị kết tinh</b>: do thay đổi điều kiện hoá lý, một số tinh thể được tách ra và tập trung lại.</li>
 <li><b>Trình tự kết tinh</b>: thứ tự các khoáng vật kết tinh trong cùng một mẫu theo thời gian → quyết định <b>hình dạng khoáng vật</b> (liệt phản ứng Bowen, xem bài 13 – Chương 3).</li>
 <li><b>Tốc độ kết tinh</b>: mức độ hình thành khoáng vật nhanh hay chậm → quyết định <b>kích thước khoáng vật</b>.</li>
 <li><b>Chất bốc</b> (H₂O, H₂S, SO₂, CO₂, CO…): hàm lượng rất lớn, gây biến chất trao đổi.</li>
 <li><b>Trạng thái thuỷ tinh</b>: khi nhiệt độ hạ thấp dưới nhiệt độ kết tinh, dung thể không còn dẻo nữa → thuỷ tinh.</li></ul>
 <div class="key"><b>Ghi nhớ</b>Một quá trình kết tinh ở mỗi giai đoạn nhiệt độ nhất định sẽ cho <b>cấu tạo, kiến trúc</b> nhất định. Hai “đòn bẩy” cần nhớ: <b>trình tự kết tinh → hình dạng</b> khoáng vật; <b>tốc độ kết tinh → kích thước</b> khoáng vật.</div>`},

    { id: 'mm-dang-nam', title: '9. Dạng nằm của đá magma', html: `
 <p>Dạng nằm trả lời câu hỏi: <b>khối đá magma có hình dạng, kích thước thế nào, quan hệ ra sao với đá vây quanh và nằm ở đâu trong khu vực?</b></p>
 <h3>Các yếu tố ảnh hưởng</h3>
 <ul><li><b>Hoạt tính của magma</b>: độ nhớt, chất bốc, chênh lệch tỷ trọng giữa magma và đá vây quanh, áp suất.</li>
 <li><b>Cấu trúc và chuyển động của đá vây quanh</b>: đứt gãy, hệ khe nứt toả tia, vòm nếp uốn.</li></ul>
 <h3>Thử ngay: sơ đồ khối các dạng nằm</h3>
 <div class="card"><p style="margin-top:0">Chọn một dạng ở danh sách bên phải; khối tương ứng trên sơ đồ được tô nổi bật. Phần trên mặt đất là đá phun trào, phần dưới mặt đất là đá xâm nhập.</p><div data-w="landform"></div></div>
 <h3>Phân loại theo hình thái</h3>
 <div class="tw"><table><tr><th>Đá xâm nhập</th><th>Chỉnh hợp / bất chỉnh hợp</th><th>Đặc điểm</th></tr>
 <tr><td>Thể vỉa (sill)</td><td>Chỉnh hợp</td><td>Hai mặt tiếp xúc song song; dày vài chục – vài trăm m; rộng đến hàng trăm km</td></tr>
 <tr><td>Thể chậu (lopolith)</td><td>Chỉnh hợp</td><td>Hai mặt tiếp xúc đều lõm, mỏng dần ở rìa; dày ≈ 1/20 đường kính</td></tr>
 <tr><td>Thể nấm (laccolith)</td><td>Chỉnh hợp</td><td>Mặt trên lồi, mỏng dần ở rìa; dày &gt; 1/7 đường kính</td></tr>
 <tr><td>Thể thấu kính</td><td>Chỉnh hợp</td><td>Mặt trên lồi, mặt dưới lõm; dày ≈ 1/20 đường kính</td></tr>
 <tr><td>Thể tường (dyke)</td><td>Bất chỉnh hợp</td><td>Hai mặt song song, dốc lớn; dài hàng chục m – hàng trăm km; dày vài cm – vài m</td></tr>
 <tr><td>Thể cán (stock)</td><td>Bất chỉnh hợp</td><td>Kích thước lớn, đẳng thước, to dần xuống sâu, thường không có đáy</td></tr>
 <tr><td>Thể nền / batholith</td><td>Bất chỉnh hợp</td><td>Như thể cán nhưng lớn hơn (thường &gt; 100–200 km²)</td></tr></table></div>
 <div class="tw"><table><tr><th>Đá phun trào</th><th>Kiểu phun</th><th>Đặc điểm</th></tr>
 <tr><td>Dạng lớp phủ</td><td>Chảy tràn trên diện rộng</td><td>Diện rộng, dày nhỏ, độ dốc nhỏ</td></tr>
 <tr><td>Dạng dòng chảy</td><td>Phun trào khe nứt hoặc trung tâm</td><td>Dài (đến vài chục km), thường hẹp, bề dày nhỏ</td></tr>
 <tr><td>Dạng vòm, dạng kim</td><td>Phun trào trung tâm</td><td>Dung nham nhớt dồn đống</td></tr>
 <tr><td>Cổ / họng núi lửa</td><td>Phun trào trung tâm</td><td>Ống dẫn magma, để lại khối trụ</td></tr></table></div>
 <div class="note"><b>Nhận biết ngoài thực địa</b>Dạng cột nứt (cột lăng trụ) trong basalt, dòng dung nham dạng thừng (pahoehoe), cột tro núi lửa… là những dấu hiệu của đá phun trào; <b>thể dị li</b> (xenolith) là mảnh đá lạ còn sót trong đá xâm nhập.</div>`},

    { id: 'mm-thanh-phan', title: '10. Thành phần vật chất của đá magma', html: `
 <p>Đá magma được mô tả bằng <b>thành phần hoá học</b> (tỷ lệ % các oxit) và <b>thành phần khoáng vật</b>. Hai thứ này liên hệ chặt chẽ nhưng không đồng nhất.</p>
 <h3>Thành phần hoá học</h3>
 <ul><li><b>Hợp phần chủ yếu</b> (chiếm vài phần trăm trở lên): SiO₂, Al₂O₃, Fe₂O₃, FeO, MgO, CaO, Na₂O, K₂O, H₂O…</li>
 <li><b>Hợp phần thứ yếu</b> (rất nhỏ): TiO₂, ZrO₂, MnO₂, P₂O₅, BaO…</li>
 <li><b>Hợp phần phụ</b>: không phổ biến ở mọi đá, chỉ có trong vài loại đá riêng biệt (Cu, Ni, Co, Cr, Au, Sn, Mo, W, Th…), có khi chỉ tập trung ở các thể dị li hoặc trong pegmatite.</li></ul>
 <div class="tw"><table><tr><th>Oxit</th><th>% trung bình</th><th>% thông thường</th></tr>
 <tr><td>SiO₂</td><td>59,12</td><td>24 – 80</td></tr><tr><td>Al₂O₃</td><td>15,34</td><td>0 – 20</td></tr><tr><td>Fe₂O₃</td><td>3,08</td><td>0 – 13</td></tr><tr><td>FeO</td><td>3,80</td><td>0 – 15</td></tr>
 <tr><td>MgO</td><td>3,49</td><td>0 – 30</td></tr><tr><td>CaO</td><td>5,08</td><td>0 – 17</td></tr><tr><td>Na₂O</td><td>3,84</td><td>0 – 14</td></tr><tr><td>K₂O</td><td>3,13</td><td>0 – 13</td></tr><tr><td>H₂O</td><td>1,15</td><td>0 – 3</td></tr></table></div>
 <div class="note"><b>Chiều hướng</b>Giàu Mg, Fe, Ca → đá <b>mafic</b> (bazơ); giàu Al, Na, K (và nhiều Si) → đá <b>felsic</b> (acid). Chín oxit này cộng lại ≈ 98% khối lượng (59,12 + 15,34 + 3,08 + 3,80 + 3,49 + 5,08 + 3,84 + 3,13 + 1,15 = 98,03%); phần còn lại là các oxit thứ yếu.</div>
 <h3>Thành phần khoáng vật: phân loại theo nhiều tiêu chí</h3>
 <div class="tw"><table><tr><th>Tiêu chí</th><th>Các loại</th></tr>
 <tr><td><b>Màu</b></td><td>Khoáng vật <b>sáng màu</b> (salic) và <b>sẫm màu</b> (femic)</td></tr>
 <tr><td><b>Nguồn gốc</b></td><td><b>Nguyên sinh</b>, <b>thứ sinh</b>, <b>biến sinh</b>, <b>tha sinh</b></td></tr>
 <tr><td><b>Hàm lượng</b></td><td><b>Chính</b> (chủ yếu, thứ yếu) và <b>phụ</b></td></tr></table></div>
 <div class="two"><div class="card"><h3>Salic (sáng màu)</h3>Chứa chủ yếu Si, Al, Ca, Na, K; thường trắng, nhạt; tỷ trọng nhỏ (&lt; 2,77). Gồm thạch anh và các biến thể, albite, orthoclase, anorthite…</div>
 <div class="card"><h3>Femic (sẫm màu)</h3>Chứa chủ yếu Fe và Mg; tỷ trọng lớn (&gt; 2,77). Gồm pyroxene, amphibole, olivine, mica, oxit Fe, khoáng vật quặng (magnetite, ilmenite, hematite)…</div></div>
 <h3>Chỉ số màu</h3>
 <p><b>Chỉ số màu</b> = % khoáng vật sẫm màu trong đá: &lt; 30% đá sáng màu (<i>leuco-</i>); 30–60% màu vừa (<i>meso-</i>); 60–90% sẫm màu (<i>mela-</i>); &gt; 90% rất sẫm màu. Chọn một đá điển hình (granite, diorite, gabbro) để xem thành phần khoáng vật và chỉ số màu:</p>
 <div class="card"><div data-w="rockmix"></div></div>
 <div class="warn"><b>Lưu ý</b>Số liệu thành phần của granite, diorite, gabbro ở trên là giá trị điển hình để minh hoạ; mỗi thân đá thực tế có thể khác. Diorite và gabbro có chỉ số màu quanh ranh giới 30–35%, nên được xếp là đá màu vừa.</div>
 <h3>Nguồn gốc khoáng vật: nguyên sinh – thứ sinh – biến sinh – tha sinh</h3>
 <div class="card"><p style="margin-top:0">Khoáng vật đá magma kết tinh qua nhiều giai đoạn khác nhau. Bấm từng giai đoạn:</p><div data-w="pick" data-k="mmstage"></div></div>
 <ul><li><b>Nguyên sinh</b>: kết tinh từ magma, không có vật liệu bên ngoài, không có các quá trình ngoại sinh.</li>
 <li><b>Thứ sinh</b>: do khoáng vật nguyên sinh bị biến đổi (khí hoá, nhiệt dịch, phong hoá); <b>không ảnh hưởng phân loại đá</b>. Ví dụ: sét hoá trên orthoclase, saussurite hoá trên plagioclase.</li></ul>
 <h3>Khoáng vật chính và phụ</h3>
 <ul><li><b>Khoáng vật chính</b>: hàm lượng vài % trở lên; <b>khoáng vật chủ yếu</b> (&gt; 5%) → <b>gọi tên đá</b>; khoáng vật thứ yếu → chia nhóm đá chi tiết hơn.</li>
 <li><b>Khoáng vật phụ</b>: hàm lượng rất nhỏ → phân chia các <b>phức hệ</b> (zircon, apatite…).</li></ul>
 <div class="note"><b>Một khoáng vật, hai vai trò</b>Một khoáng vật có thể là khoáng vật chính trong đá này nhưng lại là khoáng vật phụ trong đá khác. Mỗi loại đá có thành phần khoáng vật chủ yếu khác nhau.</div>
 <h3>Độ nhớt, kết tinh và phân dị</h3>
 <p>Độ nhớt (do độ acid, chất bốc/chất khoáng hoá, nhiệt độ, áp suất, lượng tinh thể đã kết tinh) quyết định <b>kết tinh – phân dị</b>, khả năng di chuyển, mức độ khuếch tán của các nguyên tố, sự <b>xâm nhập hay phun trào</b> và kích thước tinh thể.</p>`},

    { id: 'mm-cau-tao-kien-truc', title: '11. Cấu tạo và kiến trúc của đá magma', html: `
 <p>Hai thuật ngữ dễ lẫn: <b>cấu tạo</b> (structure) là sự phân bố (khả năng lấp đầy) trong không gian của các hợp phần tạo đá; <b>kiến trúc</b> (texture) là hình dạng, kích thước, mức độ kết tinh và quan hệ trong không gian của các hợp phần.</p>
 <h3>Cấu tạo</h3>
 <div class="tw"><table><tr><th>Nhóm</th><th>Nguyên nhân</th><th>Các kiểu cấu tạo</th></tr>
 <tr><td><b>Nội sinh</b></td><td>Đặc điểm kết tinh của chính đá</td><td>Cấu tạo (khối) đồng nhất, cấu tạo dị li, cấu tạo taxit, cấu tạo cầu…</td></tr>
 <tr><td><b>Ngoại sinh</b></td><td>Trọng lực, di chuyển magma, dòng đối lưu, áp suất</td><td>Cấu tạo định hướng, dải, dòng chảy, lỗ hổng, bọt, xỉ, hạnh nhân…</td></tr>
 <tr><td><b>Khối nứt</b></td><td>Co ngót khi nguội</td><td>Khối nứt nguyên sinh; dạng cột (lăng trụ), dạng vỉa, dạng nêm</td></tr></table></div>
 <div class="card"><p style="margin-top:0">Các cấu tạo phổ biến (bấm để xem mô tả):</p><div data-w="pick" data-k="struct"></div></div>
 <div class="note"><b>Phân biệt lỗ hổng – bọt – xỉ</b>Cùng là cấu tạo nhiều lỗ rỗng do khí thoát ra: <b>lỗ hổng</b> (vesicular basalt), <b>bọt</b> (pumice – đá bọt), <b>xỉ</b> (scoria – xỉ núi lửa).</div>
 <h3>Kiến trúc</h3>
 <div class="tw"><table><tr><th>Tiêu chí</th><th>Các kiểu</th></tr>
 <tr><td><b>Trình độ kết tinh</b></td><td>Toàn tinh, nửa thuỷ tinh, thuỷ tinh</td></tr>
 <tr><td><b>Kích thước tuyệt đối</b></td><td>Hiển tinh (hạt lớn, vừa, nhỏ), ẩn tinh</td></tr>
 <tr><td><b>Kích thước tương đối</b></td><td>Hạt đều, hạt không đều, porphyr, dạng porphyr</td></tr>
 <tr><td><b>Hình dạng</b></td><td>Toàn tự hình, nửa tự hình, toàn tha hình</td></tr>
 <tr><td><b>Mọc xen</b></td><td>Pegmatite (vân chữ, chữ cổ, granophyre), myrmekite, perthite</td></tr></table></div>
 <div class="card"><p style="margin-top:0">Các kiến trúc đặc biệt – bấm để xem sơ đồ lát mỏng:</p><div data-w="itex"></div></div>
 <ul><li><b>Kiến trúc khảm</b>: các tinh thể tự hình của khoáng vật này được gắn bởi một tinh thể lớn tha hình hơn; <b>khảm – ophit</b> khi plagioclase xếp chéo, khoảng trống lấp đầy bởi pyroxene tha hình.</li>
 <li><b>Pilotaxit</b>: khoảng trống giữa các plagioclase chéo nhau là thuỷ tinh. <b>Aphia</b>: không có ban tinh. <b>Aplite</b>: hạt nhỏ, rất nhỏ, tha hình. <b>Pegmatoid</b>: hạt khoáng vật kích thước lớn sắp xếp không có quy luật.</li>
 <li>Số lượng tương đối giữa vi tinh và thuỷ tinh: <b>gian phiến/intersertal</b> (vi tinh ≈ 75%), <b>hyalopilit</b> (≈ 50%), <b>vitrophyr</b> (≈ 25%).</li></ul>
 <div class="key"><b>Nhớ</b>Trong <b>một loại đá</b> có thể có nhiều kiểu kiến trúc và cấu tạo khác nhau. Tên gọi đá xét tổng hợp thành phần, kiến trúc, cấu tạo.</div>`},

    { id: 'mm-phan-loai-mo-ta', title: '12. Phân loại và mô tả đá magma', html: `
 <p>Gọi tên đá magma là bước cuối cùng, sau khi đã quan sát thành phần, kiến trúc, cấu tạo. Bài này nêu <b>nguyên tắc phân loại</b> và <b>trình tự mô tả</b> một mẫu đá.</p>
 <div class="card"><p style="margin-top:0">Bấm vào từng ô đá để xem mô tả; hàng trên là đá xâm nhập (hạt thô), hàng dưới là đá phun trào cùng thành phần (hạt mịn):</p><div data-w="rockgrid"></div></div>
 <h3>Phân loại dựa trên các nguyên tắc</h3>
 <ul><li>Hàm lượng (tỷ lệ %) khoáng vật chủ yếu, thứ yếu…</li><li>Nguồn gốc: khoáng vật nguyên sinh, thứ sinh…</li><li>Thành phần hoá học: hợp phần chủ yếu, thứ yếu…</li><li>Chỉ số màu; hàm lượng silicat; hàm lượng SiO₂</li><li>Thành phần khoáng vật; dạng nằm của đá; kiến trúc của đá</li></ul>
 <div class="two"><div class="card"><h3>Xâm nhập (nguội chậm)</h3>Gabbro · Diorite · Granite</div><div class="card"><h3>Phun trào (nguội nhanh) tương ứng</h3>Basalt · Andesite · Rhyolite</div></div>
 <p>Ba cặp đá phổ biến: <b>gabbro – basalt</b> (mafic), <b>diorite – andesite</b> (trung tính), <b>granite – rhyolite</b> (acid/felsic). Cặp có cùng thành phần hoá học và khoáng vật nhưng khác kiến trúc do tốc độ nguội khác nhau.</p>
 <h3>Mô tả đá magma: các bước</h3>
 <ol><li><b>Màu sắc.</b></li><li><b>Thành phần khoáng vật (%)</b>: khoáng vật chủ yếu, thứ yếu, phụ (theo thứ tự hàm lượng giảm dần). Với đá phun trào, mô tả thêm khoáng vật <b>ban tinh</b> (%) và khoáng vật <b>nền</b> (%).</li><li><b>Cấu tạo, kiến trúc</b>: từ phổ biến đến ít gặp.</li><li><b>Các biến đổi thứ sinh</b>: khoáng vật nguyên sinh, thứ sinh, mức độ và vị trí biến đổi.</li><li><b>Khoáng sản liên quan.</b></li><li><b>Phân loại và gọi tên đá.</b></li></ol>
 <h3>Phương pháp nghiên cứu</h3>
 <ul><li><b>Ngoài thực địa</b>: vết lộ, công trình khai đào, lỗ khoan.</li><li><b>Trong phòng</b>: kính hiển vi phân cực (thành phần, kiến trúc, cấu tạo), phân tích hoá, phương pháp nhúng…</li></ul>
 <div class="note"><b>Ví dụ trong nước</b>Granite phức hệ Đèo Cả và rhyolite hệ tầng Nha Trang là hai ví dụ khu vực dùng để luyện tập mô tả đá granitoid và đá phun trào acid.</div>`}
  );
})();

<script>
window.CHAPTERS.push({
 id:'c5', num:5, title:'Đá trầm tích',
 blurb:'Khái niệm và quá trình thành đá, phân dị trầm tích, thành phần hoá học – khoáng vật, phân loại và gọi tên, kiến trúc, cấu tạo; mô tả cát kết, đá sét, đá vôi, laterite.',
 sections:[
 {id:'khai-niem', title:'1. Khái niệm và quá trình hình thành', html:`
 <div class="card"><h3>Nội dung chương</h3><ul><li>Khái niệm – quá trình hình thành và biến đổi đá trầm tích</li><li>Thành phần hoá học, thành phần khoáng vật</li><li>Phân loại và gọi tên; kiến trúc; cấu tạo</li><li>Mô tả cát kết, đá sét, đá vôi, laterite</li></ul></div>
 <div class="key"><b>Định nghĩa</b><b>Đá trầm tích</b> là những thể địa chất được hình thành <b>trên bề mặt vỏ Trái Đất</b> do tích tụ và biến đổi theo phương thức <b>cơ lý và hoá học</b> các sản phẩm phong hoá, kiến tạo, núi lửa và sinh vật, trong điều kiện <b>nhiệt độ và áp suất bình thường</b>.</div>
 <h3>Sơ đồ các giai đoạn hình thành</h3>
 <div class="card"><p style="margin-top:0">Bấm từng giai đoạn:</p><div data-w="pick" data-k="sedstage"></div></div>
 <p>Tóm tắt dòng chảy: <b>đá có trước → phong hoá → vật liệu vụn và dung dịch → vận chuyển, tích tụ, lắng đọng, ngưng keo → trầm tích → tạo đá (nén ép, mất nước, tạo khoáng vật mới) → đá trầm tích</b>. Nếu bị biến đổi mạnh nhưng vẫn còn nét đặc trưng của trầm tích, đó là giai đoạn biến chất sớm.</p>
 <h3>Bốn giai đoạn thành đá</h3>
 <p>Trong giai đoạn thành đá xảy ra: nén ép, chặt xít, mất nước, gắn kết, tái kết tinh, thành tạo khoáng vật mới và phân bố lại thành phần vật chất. Quá trình chia thành 4 giai đoạn:</p>
 <div class="card"><div data-w="pick" data-k="lithif"></div></div>
 <h3>Sự phân bố của đá trầm tích</h3>
 <ul><li>Vị trí: bề mặt vỏ Trái Đất (lớp dày ≈ 16 km). Khối lượng: ≈ <b>5%</b>. Diện tích phủ: ≈ <b>75%</b>. Bề dày không đều.</li>
 <li>Phân bố giữa các loại đá không đều: <b>sét kết + cát kết + đá vôi ≈ 98%</b>.</li></ul>
 <div class="card"><div data-w="sedpie"></div></div>
 <h3>Ý nghĩa</h3>
 <ul><li>Khoáng sản gắn chặt với đá trầm tích: bauxite, than, dầu khí, sắt, mangan, muối, phosphorit, titan, vàng, thiếc, crôm…</li><li>Bản thân đá trầm tích cũng là khoáng sản: cát, sét, đá vôi… Giá trị và sản lượng gấp nhiều lần đá magma.</li></ul>
 <h3>Phương pháp nghiên cứu</h3>
 <div class="tw"><table><tr><th>Ở đâu</th><th>Phương pháp</th></tr>
 <tr><td>Ngoài thực địa</td><td>Phương pháp địa chất; chú ý mặt cắt địa chất, khoáng vật, kiến trúc, cấu tạo, màu sắc, phong hoá, di tích hữu cơ…</td></tr>
 <tr><td>Phòng thí nghiệm</td><td>Lát mỏng (khoáng vật, kiến trúc, cấu tạo, sự biến đổi); phân tích độ hạt bằng rây (đá bở rời hoặc gắn kết yếu: cấp độ hạt, độ chọn lọc); phân tích khoáng vật nặng (xác định tỷ trọng bằng dung dịch); độ lỗ rỗng, độ thấm, hàm lượng bitum (phục vụ tìm kiếm dầu khí)</td></tr></table></div>`},

 {id:'phan-di', title:'2. Phân dị trầm tích: cơ học và hoá học', html:`
 <p><b>Tác dụng phân dị trầm tích</b> xảy ra từ lúc đá bắt đầu bị phong hoá cho đến khi lắng đọng – một dạng “tuyển lựa của tự nhiên”. Có hai kiểu: phân dị <b>cơ học</b> và phân dị <b>hoá học</b>.</p>
 <div class="tw"><table><tr><th></th><th>Phân dị cơ học</th><th>Phân dị hoá học</th></tr>
 <tr><td><b>Vùng ưu thế</b></td><td>Vùng lạnh, núi cao</td><td>Vùng nóng ẩm, đồng bằng, biển</td></tr>
 <tr><td><b>Yếu tố chính</b></td><td>Kích thước, tỷ trọng, hình dạng, thành phần vật liệu; động lực học môi trường vận chuyển</td><td>Điều kiện địa lý tự nhiên, sinh vật, động lực học… nhưng chủ yếu là <b>độ hoà tan</b></td></tr>
 <tr><td><b>Sản phẩm</b></td><td>Mỏ sa khoáng (vàng, bạch kim, thiếc, crôm, titan…)</td><td>Mỏ trầm tích hoá học (nhôm, sắt, muối, mangan…)</td></tr></table></div>
 <h3>Phân dị cơ học 1: kích thước giảm dần theo dòng chảy</h3>
 <p>Ở thượng lưu dòng nước mạnh nên chỉ vật liệu lớn mới lắng; khi về trung lưu và hạ lưu tốc độ giảm dần nên vật liệu lắng đọng nhỏ dần. Kéo con trỏ dọc sông:</p>
 <div class="card"><div data-w="river"></div></div>
 <h3>Phân dị cơ học 2: tỷ trọng và hình dạng</h3>
 <ul><li>Khoáng vật có <b>tỷ trọng lớn lắng trước, nhỏ lắng sau</b>: vàng → cassiterite → magnetite → corundum → kim cương → garnet → feldspar → thạch anh.</li><li>Hạt dạng <b>cầu</b> lắng đọng trước, hạt dạng <b>tấm vảy</b> lắng sau.</li></ul>
 <div class="card"><div data-w="heavy"></div></div>
 <h3>Phân dị hoá học: theo độ hoà tan</h3>
 <p>Hợp chất <b>khó hoà tan lắng đọng trước</b> (oxit Fe, Al) rồi mới tới hợp chất <b>dễ hoà tan lắng đọng sau</b> (sulphate, chloride). Thứ tự độ hoà tan tăng dần: Al → Fe → Mn → SiO₂ → P₂O₅ → CaCO₃ → CaSO₄ → NaCl → MgCl₂. Từ lục địa ra đại dương, trình tự lắng đọng là <b>oxit → phosphate – silicate → carbonate → sulphate → haloid</b>.</p>
 <div class="card"><div data-w="chemdiff"></div></div>
 <div class="note"><b>Ví dụ độ tan</b>Ở 20 °C halite tan 36 g/100 g nước, thạch cao 0,24, calcite (25 °C) chỉ 0,0014; thạch anh và feldspar gần như không tan (feldspar dạng bột &lt; 0,002 mm thì dễ hoà tan hơn trong nước và HCl).</div>`},

 {id:'thanh-phan', title:'3. Thành phần hoá học và khoáng vật', html:`
 <h3>Thành phần hoá học</h3>
 <ul><li>Các oxit thường <b>đơn giản và ít hơn</b> đá magma: đá vôi dolomite CaMg(CO₃)₂; cát kết thạch anh SiO₂.</li><li>Fe³⁺ nhiều hơn đá magma; Fe²⁺ ít hơn đá magma.</li><li>Hàm lượng oxit <b>biến thiên không giới hạn</b>: cát kết thạch anh có khi SiO₂ đạt 99%; sét kaolin có Al₂O₃ đạt 40%.</li><li>Na₂O ít hơn đá magma, tỷ lệ K₂O/Na₂O &gt; 1; H₂O, CO₂, S nhiều hơn đá magma.</li></ul>
 <h3>Thành phần khoáng vật: bốn nguồn</h3>
 <div class="tw"><table><tr><th>Nhóm</th><th>Nguồn gốc</th><th>Vai trò</th></tr>
 <tr><td><b>Khoáng vật tha sinh (vụn)</b></td><td>Phong hoá cơ học</td><td>Chủ yếu trong đá trầm tích cơ học; thứ yếu trong đá hoá học và sinh hoá. Bền ngoài mặt đất: thạch anh, muscovite, zircon, cassiterite…; ít nhiều bị mài tròn, chọn lọc</td></tr>
 <tr><td><b>Khoáng vật tự sinh (tại sinh)</b></td><td>Lắng đọng, ngưng keo</td><td>Chủ yếu trong đá hoá học và sinh hoá; là <b>xi măng</b> trong đá cơ học; nhiều khoáng vật chỉ gặp trong đá trầm tích</td></tr>
 <tr><td><b>Vật liệu núi lửa</b></td><td>Phun trào núi lửa</td><td>Thuỷ tinh, mảnh thuỷ tinh, mảnh đá, khoáng vật…; tuff chứa &gt; 90%; tuffit 90–30%; tuffogen 30–10%</td></tr>
 <tr><td><b>Di tích hữu cơ</b></td><td>Sinh vật</td><td>Trực tiếp (xương, vỏ chồng chất tạo đá: đá vôi san hô, diatomit, than) hoặc gián tiếp (tạo môi trường thuận lợi cho lắng đọng)</td></tr></table></div>
 <h3>Khoáng vật tự sinh là “chỉ thị môi trường”</h3>
 <ul><li><b>Môi trường hoá lý</b>: silic và kaolinite → acid; hydromica → trung tính – kiềm yếu; dolomite → kiềm yếu – kiềm; pyrite → khử; Fe(OH)₃ → oxy hoá.</li><li><b>Độ muối</b>: dolomite lắng khi độ mặn vào khoảng 30–32‰. Dolomite, hydromica, montmorillonite thường gặp ở môi trường vũng vịnh.</li><li><b>Mức độ biến đổi của đá</b>: sericite, chlorite… thường thành tạo trong giai đoạn biến chất sớm.</li></ul>
 <h3>Độ vững bền của khoáng vật khi phong hoá</h3>
 <div class="tw"><table><tr><th>Độ bền</th><th>Khoáng vật tạo đá</th><th>Khoáng vật phụ</th></tr>
 <tr><td>Rất bền</td><td>Thạch anh, limonite, sét</td><td>Zircon, tourmaline, rutile, topaz, spinel, kim cương</td></tr>
 <tr><td>Bền</td><td>Muscovite, orthoclase, microcline, plagioclase acid</td><td>Garnet, monazite, epidote, cassiterite, titanite, ilmenite, leucoxene, sillimanite</td></tr>
 <tr><td>Không bền</td><td>Biotite, plagioclase trung tính, pyroxene, amphibole, calcite, dolomite, glauconite</td><td>Apatite, barite, andalusite, staurolite, disthene</td></tr>
 <tr><td>Rất không bền</td><td>Plagioclase bazơ, gypsum, anhydrite, siderite, halite, olivine, feldspar</td><td>Pyrite, pyrrhotite, sulphate Fe</td></tr></table></div>
 <div class="card"><p style="margin-top:0">Mô phỏng: khoáng vật nào “sống sót” sau phong hoá?</p><div data-w="stab"></div></div>
 <div class="note"><b>Liên hệ</b>Bảng này tương ứng với dãy bền phong hoá Goldich ở Chương 3: khoáng vật càng khác điều kiện bề mặt càng kém bền. Độ bền còn phụ thuộc thành phần, kiến trúc, độ hoà tan, tính chất cơ lý và mức độ phân tán của khoáng vật.</div>`},

 {id:'phan-loai', title:'4. Phân loại và cách gọi tên', html:`
 <p>Phân loại đá trầm tích dựa vào <b>nguồn gốc, điều kiện thành tạo, thành phần, cấu tạo, kiến trúc, mối quan hệ giữa các đá</b> và nên đơn giản.</p>
 <div class="grid"><div class="mini"><h4>Nhóm I</h4>Đá trầm tích cơ học (vụn)</div><div class="mini"><h4>Nhóm II</h4>Đá sét (cơ học và hoá học)</div><div class="mini"><h4>Nhóm III</h4>Đá trầm tích hoá học và sinh hoá</div></div>
 <h3>Cách gọi tên</h3>
 <ul><li>Đá có <b>nhiều thành phần</b> được gọi tên riêng: arkose, graywacke…</li>
 <li>Đá có 2 hoặc 3 thành phần: gọi theo khoáng vật với <b>số lượng giảm dần</b>; nếu số lượng &lt; 10% thì ghép chữ <b>“chứa”</b> (hoặc trước thành phần thứ ba cũng ghép “chứa”). Ví dụ: cát thạch anh 70% + bột thạch anh 30% ⇒ <i>cát – bột kết thạch anh</i>; sét 50%, calcite 30%, cát 20% ⇒ <i>sét – vôi chứa cát</i>.</li>
 <li>Theo <b>nguồn gốc ban đầu</b>: calcite 80% + dolomite 20%; nếu dolomite hình thành từ calcite (thay thế) ⇒ <i>đá vôi dolomit hoá</i>, không gọi là “đá vôi dolomite”.</li>
 <li>Theo <b>điều kiện thành tạo</b>: cát kết thạch anh chứa glauconite. Theo <b>mức độ biến đổi</b>: đá vôi tái kết tinh, đá vôi dạng cẩm thạch.</li>
 <li>Theo <b>ý nghĩa thực tiễn</b>: các đá có giá trị công nghiệp (Al, Fe, Cu, PO₄, kaolinite…) được ưu tiên trong tên gọi; ví dụ trong cát kết thạch anh – feldspar, nếu kaolinite có giá trị công nghiệp thì gọi là <i>kaolin chứa cát</i>.</li></ul>
 <div class="card"><h3>Thử tự gọi tên</h3><div data-w="sedname"></div></div>`},

 {id:'kien-truc', title:'5. Kiến trúc đá trầm tích', html:`
 <h3>A. Kiến trúc của đá trầm tích vụn</h3>
 <p>Được xét trên hạt vụn (khoáng vật tha sinh): <b>kích thước</b> (độ hạt), <b>hình dạng</b> hạt vụn, và <b>xi măng</b>.</p>
 <div class="tw"><table><tr><th>Cỡ hạt (thang ≈)</th><th>Tên hạt</th><th>Nhóm</th></tr>
 <tr><td>&gt; 1 m</td><td>Khối</td><td rowspan="4">Cuội (psephite)</td></tr><tr><td>1 dm – 1 m</td><td>Tảng</td></tr><tr><td>1 cm – 1 dm</td><td>Cuội (tròn cạnh), dăm (góc cạnh)</td></tr><tr><td>1 mm – 1 cm</td><td>Sỏi, sạn</td></tr>
 <tr><td>0,1 – 1 mm</td><td>Cát</td><td>Cát (psammite)</td></tr><tr><td>0,01 – 0,1 mm</td><td>Bột</td><td>Bột (aleurite)</td></tr><tr><td>&lt; 0,01 mm</td><td>Sét</td><td>Sét (pelite)</td></tr></table></div>
 <h4>Độ chọn lọc và độ mài tròn</h4>
 <p><b>Độ chọn lọc</b>: mức đồng đều về kích thước hạt vụn (rất tốt → rất kém). <b>Độ mài tròn</b>: hình dạng hạt vụn; theo mức độ mài tròn có các loại: tròn cạnh, nửa tròn cạnh, nửa góc cạnh, góc cạnh; ngoài ra còn kiểu gặm mòn và tái sinh. Quãng đường vận chuyển càng dài, hạt càng tròn.</p>
 <div class="card"><div data-w="grains"></div></div>
 <h4>Xi măng – kiểu gắn kết hạt vụn</h4>
 <p>Xi măng (khoáng vật tự sinh) <b>gắn kết hạt vụn</b>, thường có nguồn gốc tự sinh, thành tạo trong mọi giai đoạn. Phân loại theo hình dạng kiến trúc: vô định hình, ẩn tinh, tái kết tinh, hoá hạt, thay thế. Theo <b>mối quan hệ với hạt vụn</b> có các kiểu: cơ sở, lấp đầy, tiếp xúc, nén ép, khảm, kết vỏ, tái sinh, gặm mòn.</p>
 <div class="card"><div data-w="cement"></div></div>
 <h3>B. Kiến trúc đá trầm tích hoá học và sinh hoá</h3>
 <ul><li>Theo hình dạng: vô định hình, ẩn tinh, tái kết tinh, hoá hạt, thay thế, tha hình, tự hình sinh vật, tàn tích sinh vật.</li><li>Theo kích thước: hạt đều, hạt không đều, hạt thô, hạt lớn, hạt vừa, hạt nhỏ, hạt mịn, vi hạt, dạng keo.</li></ul>
 <h3>C. Kiến trúc đá sét</h3>
 <ul><li><b>Kiến trúc sét</b>: &gt; 50% khoáng vật có kích thước sét. <b>Sét – cát</b>: sét &gt; 50% và cát 5–25%. <b>Sét – bột</b>: sét &gt; 50% và bột 5–25%.</li><li><b>Ẩn tinh</b>: 0,01–0,001 mm. <b>Dạng keo</b>: &lt; 0,001 mm. <b>Toàn tinh</b>: các phần tử tạo đá kết tinh hoàn toàn.</li><li>Các kiến trúc khác: sét – thực vật (phytopelit), sét – động vật, tóc rối, mạng lưới, sét biến dư, ban biến dư, sét tàn dư, dạng cuội kết – dăm kết, hạt đậu, trứng cá.</li></ul>`},

 {id:'cau-tao', title:'6. Cấu tạo đá trầm tích', html:`
 <p>Cấu tạo trầm tích gồm hai nhóm: <b>cấu tạo trên mặt lớp</b> (dấu vết để lại trên bề mặt) và <b>cấu tạo trong lớp</b> (sự sắp xếp bên trong lớp). Chọn từng kiểu để xem hình mặt cắt hoặc mặt lớp:</p>
 <div class="card"><div data-w="bedding"></div></div>
 <h3>A. Cấu tạo trên mặt lớp</h3>
 <ul><li>Dấu vết <b>gợn sóng</b> (do dòng nước, sóng biển, gió).</li><li>Dấu vết <b>khe nứt khô</b>.</li><li>Vết hằn <b>giọt mưa</b>; vết hằn <b>sinh học</b>.</li></ul>
 <h3>B. Cấu tạo trong lớp</h3>
 <ul><li><b>Cấu tạo khối (đồng nhất)</b>: không thành lớp, đồng nhất theo các phương.</li><li><b>Cấu tạo dòng chảy, vò nhàu</b>: định hướng, uốn lượn thành dãy theo dòng chảy; thường gặp ở sét, carbonate.</li><li><b>Cấu tạo phân lớp</b> (phổ biến và đặc trưng nhất cho đá trầm tích): <b>nằm ngang, lượn sóng, dạng dải, dạng nhịp, xiên đơn, xiên chéo</b>.</li><li><b>Cấu tạo spherolite</b> (toả tia), <b>stylolite</b> (đường khâu), <b>hạnh nhân</b>, <b>trứng cá</b>, <b>kết hạch</b>, <b>turbidite</b> (dòng đục – hạt thô dưới, mịn dần lên trên).</li></ul>
 <div class="key"><b>Ý nghĩa</b>Cấu tạo cho biết <b>động lực của môi trường lắng đọng</b>: lớp ngang song song → nước tĩnh; lớp xiên → dòng chảy một hướng; xiên chéo → dòng đổi hướng; gợn sóng → có sóng/dòng nông; khe nứt khô → từng lộ ra khô cạn; turbidite → dòng đục chảy sườn dốc.</div>`},

 {id:'mo-ta', title:'7. Mô tả: cát kết, đá sét, đá vôi, laterite', html:`
 <h3>A. Cát kết</h3>
 <div class="tw"><table><tr><th>Loại</th><th>Thạch anh</th><th>Thành phần khác</th><th>Nguồn gốc</th></tr>
 <tr><td><b>Đơn khoáng – cát kết thạch anh</b></td><td>&gt; 90%</td><td>Feldspar, mảnh đá, khoáng vật nặng; xi măng sét, sắt, calcit…</td><td>SiO₂ rất cao</td></tr>
 <tr><td><b>Ít khoáng – dạng arkose</b></td><td>50–90%</td><td>Feldspar 10–50% (plagioclase acid, orthoclase); khoáng vật phụ và mảnh đá granitoid, silic</td><td>Phá huỷ khối granitoid</td></tr>
 <tr><td><b>Ít khoáng – dạng graywacke</b></td><td>50–90%</td><td>Khoáng vật màu &gt; 10%; các mảnh đá</td><td>Phá huỷ đá magma bazơ</td></tr>
 <tr><td><b>Đa khoáng – arkose</b></td><td>&lt; 50%</td><td>Feldspar 50–90%; độ mài tròn và chọn lọc kém; phân bố gần đá gốc</td><td>Phá huỷ đá magma acid</td></tr>
 <tr><td><b>Đa khoáng – greywacke</b></td><td>&lt; 50%</td><td>Plagioclase trung tính – bazơ 20–30%; khoáng vật màu, mảnh đá magma bazơ, biến chất, tuff &gt; 25%</td><td>Phá huỷ đá magma bazơ</td></tr></table></div>
 <div class="card"><h3>Phân loại cát kết theo Q – F – L</h3><div data-w="qfl"></div></div>
 <p>Màu sắc cát kết phụ thuộc xi măng và khoáng vật hỗn hợp: <b>trắng</b> – xi măng kaolinite; <b>đen, xám đen</b> – vật chất than, thực vật; <b>nâu, đỏ, vàng</b> – có sắt. Các kiểu xi măng thường gặp: cơ sở, lấp đầy, gặm mòn, tái sinh, tiếp xúc.</p>
 <h3>B. Đá sét</h3>
 <div class="card"><div data-w="pick" data-k="clay"></div></div>
 <h3>C. Đá vôi</h3>
 <p>Thành phần chủ yếu là <b>calcite</b>, lẫn sét, silic, dolomite, sắt, vật chất than, thạch anh, feldspar, vật liệu vụn. Hoá học: chủ yếu CaO, CO₂, có thể MgO, SiO₂. Kiến trúc: tha hình, sinh vật, tàn tích sinh vật, vi hạt; cấu tạo khối, trứng cá. Di tích sinh vật rất phong phú, môi trường thành tạo đa dạng từ lục địa đến biển sâu; nguồn gốc có thể hoá học thuần tuý, <b>sinh hoá</b> hoặc trầm tích vụn.</p>
 <div class="card"><p style="margin-top:0">Các kiểu đá vôi (bấm để xem):</p><div data-w="pick" data-k="limest"></div></div>
 <div class="card"><h3>Hạt trứng cá lớn dần</h3><div data-w="ooid"></div></div>
 <h3>D. Laterite</h3>
 <ul><li><b>Trầm tích hoá học</b>, giàu oxit sắt, nhôm, titan; nghèo oxit silic, kiềm và kiềm thổ.</li><li>Chủ yếu khoáng vật nhôm (gibbsite, boehmite, diaspore) lẫn thạch anh, kaolinite.</li><li>Thường có màu <b>nâu đỏ, vàng</b>, bị phủ lớp xám đen mỏng; cấu tạo kết hạch, hạt đậu; độ rỗng lớn nhưng rắn chắc. Dưới kính hiển vi rất khó xác định thành phần vì khoáng vật rất nhỏ, dạng keo, lẫn sắt → độ trong suốt kém, chỉ thấy được trong khe nứt, lỗ rỗng.</li></ul>
 <div class="card"><p style="margin-top:0"><b>Điều kiện thành tạo laterite</b> – bấm từng điều kiện:</p><div data-w="pick" data-k="laterite"></div></div>
 <div class="note"><b>Liên hệ</b>Phong hoá hoá học mạnh trong khí hậu nhiệt đới để lại sản phẩm laterite (ví dụ ở Đồng Nai) và bauxite (ví dụ ở Lâm Đồng) – cùng các sản phẩm phong hoá đã học ở Chương 3 (kaolinite, goethite, gibbsite).</div>`}
 ]
});

</script>
<script>
window.CHAPTERS.push({
 id:'c6', num:6, title:'Đá biến chất',
 blurb:'Khái niệm, các yếu tố biến chất (nhiệt độ, áp suất, dung dịch, thời gian), các kiểu biến chất và tướng biến chất, thành phần khoáng vật, cấu tạo – kiến trúc, phân loại, mô tả đá cà nát và đá biến chất nhiệt.',
 sections:[
 {id:'khai-niem', title:'1. Khái niệm và so sánh điều kiện thành tạo', html:`
 <div class="key"><b>Định nghĩa</b><b>Đá biến chất</b> thành tạo từ sự biến đổi của các <b>đá có trước</b> trong các điều kiện: ở <b>trạng thái rắn</b>; nằm ở phần sâu của vỏ Trái Đất; chịu các yếu tố nội lực (nhiệt độ, áp suất, dung dịch biến chất…). Đá có trước bị thay đổi về <b>thành phần, kiến trúc, cấu tạo</b>.</div>
 <h3>So sánh ba nhóm đá</h3>
 <div class="tw"><table><tr><th></th><th>Đá magma</th><th>Đá biến chất</th><th>Đá trầm tích</th></tr>
 <tr><td><b>Trạng thái vật chất</b></td><td>Lỏng (magma nguội kết tinh)</td><td>Cứng (rắn)</td><td>Vật liệu lắng đọng</td></tr>
 <tr><td><b>Xu hướng T và P</b></td><td>T ↘ và P ↘</td><td>T ↗ và P ↗</td><td>T và P bình thường</td></tr>
 <tr><td><b>Yếu tố</b></td><td>Nội lực</td><td>Nội lực</td><td>Ngoại lực</td></tr></table></div>
 <div class="note"><b>Phạm vi biến chất</b>T khoảng <b>300 → 1000 °C</b>; P khoảng <b>250–300 bar → 15–20 kbar</b>; độ sâu nằm dưới đới phong hoá và đới trầm tích.</div>
 <h3>Chu trình đá: đá biến chất nằm ở đâu?</h3>
 <div class="card"><p style="margin-top:0">Bấm các quá trình có “Biến chất” và “Nóng chảy”.</p><div data-w="rockcycle"></div></div>`},

 {id:'yeu-to', title:'2. Các yếu tố biến chất', html:`
 <p>Có bốn yếu tố: <b>nhiệt độ, áp suất, dung dịch biến chất, thời gian biến chất</b>.</p>
 <h3>Nhiệt độ</h3>
 <ul><li><b>Tác dụng</b>: gây các phản ứng hoá học giữa các vật chất tạo đá; thúc đẩy tác dụng vật lý của dung dịch tuần hoàn trong đá; làm thay đổi tính chất vật lý của đá; ở nhiệt độ cao các ion, nguyên tử di chuyển làm sắp xếp lại các tinh thể.</li>
 <li><b>Nguồn gốc</b>: hoạt động của magma (gần khối magma hay họng núi lửa luôn có lượng nhiệt lớn); <b>gradient địa nhiệt</b> – trong vỏ Trái Đất càng xuống sâu nhiệt độ càng tăng (trung bình ≈ <b>30 °C/km</b>, tức ≈ 1 °C mỗi 33 m; vùng núi lửa hoạt động ≈ 35 °C/km); chuyển động kiến tạo (các đứt gãy dịch chuyển theo mặt trượt); sự tập trung chất phóng xạ nồng độ cao. Gradient địa nhiệt thời Tiền Cambri (Thái cổ) cao hơn ngày nay rất nhiều.</li></ul>
 <h3>Áp suất</h3>
 <p>Áp suất biến chất phức tạp, gồm: <b>áp suất thuỷ tĩnh</b> (địa tĩnh, tải trọng), <b>áp suất định hướng</b> và áp suất của dung dịch khí hay nước tuần hoàn → <b>áp suất tổng</b>.</p>
 <div class="tw"><table><tr><th></th><th>Áp suất thuỷ tĩnh (Pₗ)</th><th>Áp suất định hướng (Pₛ)</th></tr>
 <tr><td><b>Nguyên nhân</b></td><td>Trọng lượng các lớp đá phía trên</td><td>Hoạt động kiến tạo; chỉ tồn tại trong vật liệu rắn</td></tr>
 <tr><td><b>Độ sâu</b></td><td>Phổ biến ở độ sâu lớn; <b>tăng</b> theo độ sâu</td><td>Chủ yếu ở phần nông của vỏ; càng xuống sâu càng <b>giảm</b></td></tr>
 <tr><td><b>Tác dụng</b></td><td>Làm <b>nâng cao</b> nhiệt độ kết tinh của khoáng vật; tạo khoáng vật đặc xít hơn</td><td>Phá vỡ đá, làm biến dạng, tạo khe nứt, đổi cấu tạo – kiến trúc; làm <b>giảm</b> nhiệt độ kết tinh; tạo thuận lợi cho dung dịch di chuyển và thúc đẩy phản ứng</td></tr></table></div>
 <div class="card"><h3>Áp suất định hướng sắp xếp lại khoáng vật</h3><p style="margin-top:0">Kéo thanh trượt để nén ngang: hạt khoáng vật bị ép dẹt và xếp theo phương vuông góc với lực nén.</p><div data-w="stress"></div></div>
 <div class="card"><h3>Áp suất cao tạo khoáng vật đặc xít hơn</h3><p style="margin-top:0">Ví dụ: forsterite + anorthite → garnet. Thể tích phân tử giảm.</p><div data-w="garnetvol"></div></div>
 <h3>Dung dịch biến chất và thời gian</h3>
 <ul><li><b>Dung dịch biến chất</b> tồn tại ở chỗ tiếp xúc giữa các khoáng vật, trong bao thể hoặc vi khe nứt; có thể ở trạng thái lỏng hoặc khí (tuỳ nhiệt độ); thành phần chủ yếu H₂O, CO₂. Tác dụng: tạo <b>áp suất hơi nước (P<sub>H₂O</sub>)</b> và <b>áp suất thán khí (P<sub>CO₂</sub>)</b>; bổ sung áp suất thuỷ tĩnh; là môi trường để ion và nguyên tử di chuyển.</li>
 <li><b>Phản ứng có dung dịch</b>: muscovite + thạch anh ↔ orthoclase + sillimanite + nước; calcite + thạch anh ↔ wollastonite + CO₂; forsterite + thạch anh = enstatite; talc + calcite → tremolite.</li></ul>
 <h3>Nhiệt độ – áp suất – độ sâu: tướng biến chất</h3>
 <p>Mỗi tập hợp khoáng vật trong đá biến chất chỉ thị cho một điều kiện T–P nhất định. <b>Tướng biến chất</b> là sự thể hiện một trình độ biến chất tương ứng với một giới hạn nhất định về T và P; các đá thành tạo trong cùng điều kiện T–P thuộc <b>cùng một tướng</b>.</p>
 <div class="card"><p style="margin-top:0">Kéo độ sâu hoặc bấm vào biểu đồ để chọn điểm (T, P) và xem tướng biến chất tương ứng; đổi gradient địa nhiệt để thấy vì sao đới hút chìm cho schist lam, còn quanh khối magma cho đá sừng.</p><div data-w="ptfacies"></div></div>
 <div class="note"><b>Mở rộng</b>Tên các tướng (greenschist, amphibolite, granulite, blueschist, eclogite, hornfels) và vị trí gần đúng trên biểu đồ là kiến thức bổ sung để dễ hình dung; ranh giới thực tế phụ thuộc thành phần đá. Áp suất ≈ 0,265 kbar mỗi km chiều sâu (đá tỷ trọng ≈ 2,7).</div>`},

 {id:'kieu', title:'3. Các kiểu biến chất', html:`
 <div class="card"><p style="margin-top:0">Chọn từng kiểu để xem sơ đồ mặt cắt minh hoạ:</p><div data-w="mtypes"></div></div>
 <div class="tw"><table><tr><th>Kiểu</th><th>Yếu tố chính</th><th>Đặc điểm</th></tr>
 <tr><td><b>Biến chất động lực (cà nát)</b></td><td>Áp suất định hướng (Pₛ)</td><td>Dọc các đứt gãy kiến tạo; đá nguyên thuỷ bị cà nát cơ học, đổi kiến trúc và cấu tạo (chỉ bị vỡ vụn)</td></tr>
 <tr><td><b>Biến chất nhiệt động</b></td><td>Cả ba: nhiệt độ + áp suất + dung dịch</td><td>Đổi kiến trúc, cấu tạo, thành phần khoáng vật và đôi khi cả thành phần hoá học. Phạm vi lớn (miền địa máng) → <b>biến chất khu vực</b>; phạm vi nhỏ (dọc đứt gãy) → biến chất địa phương</td></tr>
 <tr><td><b>Biến chất nhiệt (tiếp xúc nhiệt)</b></td><td>Nhiệt từ khối xâm nhập đang kết tinh</td><td>Ở nơi tiếp xúc giữa đá magma xâm nhập và đá vây quanh → <b>đới biến chất tiếp xúc</b>; đổi thành phần khoáng vật, kiến trúc, cấu tạo</td></tr>
 <tr><td><b>Biến chất trao đổi</b></td><td>Dung dịch thoát ra từ khối magma đã kết tinh (dung dịch sau magma)</td><td>Đá hai bên tiếp xúc có thành phần hoá học khác hẳn đá ban đầu do trao đổi nguyên tố giữa khối xâm nhập và đá vây quanh. Phạm vi lớn: trao đổi khu vực; quanh khối xâm nhập: tiếp xúc trao đổi</td></tr>
 <tr><td><b>Siêu biến chất / biến chất phức</b></td><td>Nhiệt độ, áp suất, dung dịch</td><td>Siêu biến chất: phần biến chất cao của biến chất nhiệt động làm <b>tái nóng chảy từng phần</b>. Một khu vực có thể gồm nhiều kiểu biến chất chồng lên nhau và độc lập (biến chất phức)</td></tr>
 <tr><td><b>Biến chất giật lùi (tự biến chất)</b></td><td>T, P hạ thấp</td><td>Đá biến chất mức cao → mức thấp; do dung dịch sau magma cùng nguồn, xảy ra bên trong khối magma đã kết tinh; gồm cả biến đổi thứ sinh (khí thành nhiệt dịch)</td></tr></table></div>`},

 {id:'thanh-phan', title:'4. Thành phần vật chất và đặc điểm kết tinh', html:`
 <p>Hợp phần hoá học chủ yếu tạo đá biến chất tương tự đá magma nhưng <b>không mang tính quy luật</b>. Đá biến chất chứa nhiều khoáng vật mà đá magma hầu như không có.</p>
 <h3>Thành phần khoáng vật</h3>
 <ul><li><b>Khoáng vật chính</b> ≥ 5%; <b>khoáng vật phụ</b> &lt; 5%.</li></ul>
 <div class="tw"><table><tr><th>Đá</th><th>Khoáng vật</th></tr>
 <tr><td>Chỉ gặp trong đá biến chất</td><td>Andalusite, disthene (kyanite), sillimanite, cordierite, garnet, staurolite…</td></tr>
 <tr><td>Cả đá magma và biến chất</td><td>Olivine, augite, hornblende, plagioclase, orthoclase, thạch anh, biotite, muscovite, phlogopite, ilmenite, magnetite, chlorite, actinolite, tremolite, wollastonite, jadeite…</td></tr></table></div>
 <ul><li><b>Disthene</b> dạng tấm dài, có một phương cát khai. <b>Sillimanite</b> dạng tấm dài (một phương cát khai và nhiều đường nứt ngang) hoặc dạng bó sợi (<i>fibrolite</i>). <b>Cordierite</b> thường tha hình và có song tinh đa hợp. <b>Garnet</b> thường dạng đẳng thước; có màu xanh lục và hồng nhạt…</li></ul>
 <h3>Chỉ thị mức biến chất</h3>
 <p>Khi mức biến chất tăng, tập hợp khoáng vật thay đổi: sét → chlorite → muscovite → biotite → garnet → staurolite → kyanite → sillimanite; đá chuyển từ đá sét (shale) qua slate, phyllite, schist, gneiss tới migmatite (nóng chảy từng phần). Kéo thanh trượt:</p>
 <div class="card"><div data-w="mgrade"></div></div>
 <h3>Đặc điểm kết tinh</h3>
 <ul><li><b>Hình dạng</b>: kết tinh đồng thời nên các khoáng vật tha hình ở mức độ như nhau (ví dụ đá hoa, quartzite).</li><li><b>Tính phân đới</b> và <b>tính định hướng</b> của khoáng vật.</li><li><b>Nhiệt độ và áp suất</b>: mỗi tập hợp khoáng vật chỉ thị về điều kiện T, P nhất định.</li></ul>`},

 {id:'cau-tao', title:'5. Cấu tạo và kiến trúc', html:`
 <h3>Cấu tạo</h3>
 <p>Có hai nhóm: <b>cấu tạo sót</b> (dấu vết cấu tạo của đá nguyên thuỷ để lại) và <b>cấu tạo biến chất</b> (hình thành ngay trong quá trình biến chất) gồm cấu tạo khối và cấu tạo định hướng.</p>
 <div class="card"><div data-w="pick" data-k="mstruct"></div></div>
 <h3>Kiến trúc</h3>
 <ul><li><b>Kiến trúc sót</b>: kiến trúc của đá nguyên thuỷ và biến dư (ban biến dư, sét biến dư…).</li>
 <li><b>Kiến trúc biến tinh</b> – do quá trình biến chất và tái kết tinh: hạt nhỏ, vừa, lớn; biến tinh hạt đều, hạt không đều, <b>ban biến tinh</b>; <b>hạt biến tinh, men rạn, sừng</b> (khoáng vật đẳng thước tha hình); <b>granulite</b>; <b>vảy biến tinh</b> (khoáng vật dạng vảy, tấm chiếm ưu thế), <b>vảy – hạt biến tinh</b>; <b>que, sợi biến tinh</b> (khoáng vật dạng que, trụ xếp gần song song); <b>khảm biến tinh</b> (khoáng vật này khảm trên ban biến tinh lớn của khoáng vật khác).</li></ul>
 <div class="card"><p style="margin-top:0">Chọn kiến trúc để xem sơ đồ lát mỏng:</p><div data-w="mtex"></div></div>
 <div class="note"><b>Mylonite</b>là kiến trúc của đá cà nát mịn: các mảnh vỡ lớn nằm trong nền rất mịn có dạng dải (xem bài 7).</div>`},

 {id:'phan-loai', title:'6. Phân loại và tên gọi', html:`
 <h3>Dựa vào nguồn gốc và trình độ biến chất</h3>
 <ul><li>Theo <b>nguồn gốc</b>: đá biến chất động lực, nhiệt, nhiệt động, trao đổi.</li><li>Theo <b>trình độ biến chất</b> (tướng biến chất): nhóm đá biến chất <b>thấp</b>, <b>trung bình</b>, <b>cao</b>.</li></ul>
 <h3>Cách gọi tên đá biến chất</h3>
 <p>Tên đá thể hiện hai đặc điểm cơ bản: <b>cấu tạo</b> và <b>thành phần khoáng vật</b>.</p>
 <div class="tw"><table><tr><th>Tên chung</th><th>Đặc điểm</th><th>Ví dụ</th></tr>
 <tr><td><b>Đá sừng</b> (hornfels)</td><td>Cấu tạo khối, hạt mịn, sẫm màu; sản phẩm của biến chất nhiệt</td><td>Đá sừng Qz – biotite – cordierite</td></tr>
 <tr><td><b>Đá phiến</b> (schist)</td><td>Cấu tạo phân phiến</td><td>Đá phiến kết tinh Qz – mica có garnet; đá phiến Qz – mica – andalusite; đá phiến Qz – sericite</td></tr>
 <tr><td><b>Gneiss</b></td><td>Cấu tạo gneiss</td><td>Gneiss mica – granat; gneiss mica – disthen</td></tr>
 <tr><td><b>Dăm kết kiến tạo</b></td><td>Cấu tạo dăm thô</td><td>Do biến chất động lực</td></tr>
 <tr><td><b>Migmatite</b></td><td>Tên chung các đá siêu biến chất</td><td>—</td></tr>
 <tr><td>Theo thành phần khoáng vật; hoặc tên tuỳ tiện, hiếm</td><td>Skarn, marble (đá hoa), greisen…</td><td>—</td></tr>
 <tr><td>Theo quan hệ chuyển tiếp</td><td>Granite bị biến chất thành gneiss</td><td>Granitogneiss</td></tr></table></div>
 <h3>Theo nguồn gốc của đá gốc: para- và ortho-</h3>
 <ul><li><b>para-</b>: biến chất từ đá trầm tích; <b>ortho-</b>: biến chất từ đá magma.</li>
 <li>Paragneiss ← đá sét, arkose; paraamphibolit ← marn; orthogneiss ← đá magma acid; orthoamphibolit ← đá magma mafic.</li>
 <li>Tiếp đầu ngữ <b>meta-</b>, <b>apo-</b>: quá trình biến chất chưa hoàn toàn (metagabbro, apodunit…).</li></ul>
 <div class="card"><h3>Đá gốc → đá biến chất</h3><p style="margin-top:0">Chọn đá gốc và mức biến chất để xem tên đá.</p><div data-w="protolith"></div></div>
 <div class="note"><b>Mở rộng</b>Chuỗi tăng dần mức biến chất của đá sét (slate → phyllite → schist → gneiss) và tên các sản phẩm ở các mức khác của basalt, granite là kiến thức bổ sung để liên hệ với bảng tên gọi.</div>`},

 {id:'mo-ta', title:'7. Mô tả: đá cà nát và đá biến chất nhiệt', html:`
 <h3>A. Đá biến chất động lực (cà nát)</h3>
 <ul><li>Tác dụng chủ yếu của <b>áp suất định hướng</b>; ở phần tương đối nông của vỏ; liên quan đến chuyển động kiến tạo; đá bị cà nát dọc các đứt gãy; mặt phân phiến trùng với mặt dịch chuyển của đứt gãy.</li>
 <li>Khi nhiệt độ tương đối cao thì xảy ra tái kết tinh mạnh tạo khoáng vật mới; nếu có dung dịch biến chất thì gây biến đổi các khoáng vật nhiệt độ thấp.</li>
 <li>Phân bố dọc các phá huỷ kiến tạo; kích thước từ cm tới hàng trăm m; chiều dài phụ thuộc phá huỷ kiến tạo.</li></ul>
 <div class="card"><p style="margin-top:0">Kéo mức độ cà nát để thấy dăm kết kiến tạo → cataclasite → mylonite:</p><div data-w="crush"></div></div>
 <div class="tw"><table><tr><th></th><th>Dăm kết kiến tạo</th><th>Cataclasite</th><th>Mylonite</th></tr>
 <tr><td><b>Mức cà nát</b></td><td>Thấp</td><td>Cao hơn dăm kết</td><td>Cao hơn cataclasite</td></tr>
 <tr><td><b>Khoáng vật</b></td><td>Giống đá nguyên thuỷ</td><td>Giống đá nguyên thuỷ; có thể có khoáng vật mới cùng lúc cà nát</td><td>Tương tự đá gốc; có thể có epidote, chlorite, sericite</td></tr>
 <tr><td><b>Kiến trúc</b></td><td>Dăm thô: mảnh vụn kích thước không đều, sắc cạnh, mảnh lớn chiếm ưu thế</td><td>Dăm mịn: mảnh lớn thường không sắc cạnh, gắn bằng mảnh nhỏ cùng thành phần</td><td>Mylonite thô → mịn</td></tr>
 <tr><td><b>Cấu tạo</b></td><td>Khối</td><td>Khối hoặc phân phiến mờ</td><td>Phân phiến điển hình hay phân dãy song song</td></tr></table></div>
 <p>Phân biệt <b>dăm kết kiến tạo</b> với dăm kết trầm tích, dăm kết núi lửa; granite, đá vôi, quartzite dễ bị cà nát thành dăm kết kiến tạo. Tên đá: <i>tên đá nguyên thuỷ</i> thêm vào sau tên đá cà nát (ví dụ cataclasite granite).</p>
 <h3>B. Đá biến chất tiếp xúc nhiệt</h3>
 <ul><li>Do nhiệt thoát ra từ khối magma đang kết tinh; phân bố quanh khối xâm nhập lớn ở những độ sâu khác nhau, với thời gian tương đối ngắn hơn các dạng biến chất khác.</li>
 <li>Biến đổi về kiến trúc, cấu tạo, thành phần khoáng vật nhưng <b>không biến đổi thành phần hoá học</b>. Kiến trúc hạt mịn là chủ yếu; cấu tạo khối.</li>
 <li>Bề dày đới phụ thuộc: thành phần magma (acid/mafic), bề mặt tiếp xúc, đá vây quanh, kích thước khối magma.</li></ul>
 <div class="card"><p style="margin-top:0">Kéo khoảng cách ra xa khối xâm nhập và đổi loại đá vây quanh:</p><div data-w="aureole"></div></div>
 <div class="tw"><table><tr><th>Đá</th><th>Đá nguyên thuỷ</th><th>Đặc điểm</th></tr>
 <tr><td><b>Đá phiến đốm vết / đốm sần</b></td><td>Đá sét</td><td>Cấu tạo phân phiến</td></tr>
 <tr><td><b>Đá sừng</b></td><td>Đá sét, đá thạch anh – feldspar, đá magma siêu mafic và mafic</td><td>Cấu tạo khối, hạt mịn</td></tr>
 <tr><td><b>Đá hoa (marble)</b></td><td>Đá vôi hoặc dolomit</td><td>Cấu tạo khối, hạt lớn; chủ yếu calcite, có thể dolomit, tremolite, talc, sericit; kiến trúc hạt mịn – vừa; thường sáng màu (sẫm nếu có tạp chất); hay đi cùng đá phiến đốm vết/sần ở vành tiếp xúc ngoài rìa xâm nhập granitoid</td></tr>

const gg = (l, m, s1, s2) => Math.exp(-.5 * Math.pow((l - m) / (l < m ? s1 : s2), 2));
function xyz(l) { return [1.056 * gg(l, 599.8, 37.9, 31) + .362 * gg(l, 442, 16, 26.7) - .065 * gg(l, 501.1, 20.4, 26.2), .821 * gg(l, 568.8, 46.9, 40.5) + .286 * gg(l, 530.9, 16.3, 31.1), 1.217 * gg(l, 437, 11.8, 36) + .681 * gg(l, 459, 26, 13.8)]; }
const M_ = [[3.2406, -1.5372, -.4986], [-.9689, 1.8758, .0415], [.0557, -.204, 1.057]];
function rgbOf(Iof) {
  let X = 0, Y = 0, Z = 0; for (let l = 400; l <= 700; l += 5) { const c = xyz(l), i = Iof(l); X += c[0] * i; Y += c[1] * i; Z += c[2] * i; }
  return M_.map(r => r[0] * X + r[1] * Y + r[2] * Z);
}
const WHITE = rgbOf(() => 1);
function interfColor(R, bright = 1) {
  const lin = rgbOf(l => Math.sin(Math.PI * R / l) ** 2).map((v, i) => Math.max(0, Math.min(1, v / WHITE[i] * bright)));
  return 'rgb(' + lin.map(v => Math.round(255 * Math.pow(v, 1 / 2.2))).join(',') + ')';
}

    g.strokeStyle = 'rgba(255,255,255,.3)'; g.setLineDash([3, 3]); g.beginPath(); g.moveTo(-90, 0); g.lineTo(90, 0); g.stroke(); g.setLineDash([]); g.restore();

W.pick = el => {

/* ---------- Dãy phản ứng Bowen ---------- */
W.bowen = el => {
  // vị trí (0 = ~1200 °C, 100 = ~650 °C) mang tính minh hoạ theo sơ đồ
  const D = [['Olivine', 5, '#7aa63a'], ['Pyroxene', 25, '#4e6b4a'], ['Amphibole', 45, '#2f4a3a'], ['Biotite', 65, '#5b3a29']];
  const P = [['Plagioclase giàu Ca (anorthite)', 5], ['Plagioclase trung gian', 35], ['Plagioclase giàu Na (albite)', 65]];
  const L = [['K-feldspar', 78, '#e8a58b'], ['Muscovite', 88, '#d9c9a0'], ['Quartz', 95, '#cfd6dd']];
  mk(el, `<canvas width="640" height="330" style="width:100%"></canvas>` + slider('bt', 'Tiến trình nguội', 0, 100, 1, 0, '%') + `<div class="res" id="bi"></div>
  <div style="font-size:12px;color:var(--muted)">Thang nhiệt độ ≈ 1200 → 650 °C. Vị trí các khoáng vật trên sơ đồ chỉ mang tính minh hoạ trình tự, không phải mốc nhiệt độ chính xác.</div>`);
  const c = q(el, 'canvas'), g = c.getContext('2d');
  const draw = v => {
    g.clearRect(0, 0, 640, 330); g.font = '13px sans-serif';
    const y = p => 30 + p / 100 * 270;
    const T = 1200 - v / 100 * 550;
    // trục nhiệt độ
    const gr = g.createLinearGradient(0, 30, 0, 300); gr.addColorStop(0, '#d24545'); gr.addColorStop(1, '#1f5fbf');
    g.fillStyle = gr; g.fillRect(14, 30, 8, 270); g.fillStyle = ink(); g.fillText('~1200 °C', 28, 40); g.fillText('~650 °C', 28, 300);
    g.fillText('Nhánh không liên tục', 150, 18); g.fillText('Nhánh liên tục (plagioclase)', 400, 18);
    g.fillStyle = '#d24545'; const my = y(v); g.fillRect(8, my - 1, 20, 3);
    const box = (x, yy, w, t, on, col) => { g.globalAlpha = on ? 1 : .28; g.fillStyle = col || '#888'; g.beginPath(); g.roundRect(x, yy - 14, w, 28, 8); g.fill(); g.globalAlpha = 1; g.fillStyle = on ? '#fff' : ink(); g.fillText(t, x + 10, yy + 5); };
    D.forEach((m, i) => { box(120, y(m[1]) + 10, 130, m[0], v >= m[1], m[2]); if (i) { g.strokeStyle = ink(); g.globalAlpha = .4; g.beginPath(); g.moveTo(185, y(D[i - 1][1]) + 24); g.lineTo(185, y(m[1]) - 4); g.stroke(); g.globalAlpha = 1; } });
    P.forEach(m => box(350, y(m[1]) + 10, 260, m[0], v >= m[1], '#3a7bd5'));
    L.forEach(m => box(240, y(m[1]) + 10, 140, m[0], v >= m[1], m[2] === '#cfd6dd' ? '#8a96a3' : m[2] === '#d9c9a0' ? '#a8935a' : '#c8704e'));
    g.fillStyle = ink(); g.font = '12px sans-serif'; g.fillText('Hội tụ → khoáng vật kết tinh muộn', 240, 322);
    const on = [...D, ...L].filter(m => v >= m[1]).map(m => m[0]); const pi = P.filter(m => v >= m[1]).pop();
    q(el, '#bi').innerHTML = `Nhiệt độ ≈ <b>${T.toFixed(0)} °C</b>. Đã kết tinh: <b>${on.length ? on.join(', ') : '(chưa có)'}</b>${pi ? '; plagioclase: <b>' + pi[0] + '</b>' : ''}.<br>Magma sớm giàu Mg, Fe, Ca (nhiệt độ cao); magma muộn giàu Si, Na, K (nhiệt độ thấp).`;
  };
  bindSlider(el, 'bt', draw, '%'); draw(0);
};

/* ---------- Silicate theo cấu trúc ---------- */
W.silicate = el => {
  const S = [
    ['Silicate đảo (nesosilicate)', 'SiO₄⁴⁻', '4', 'Tứ diện độc lập', 'Olivine, garnet', 'island'],
    ['Silicate nhóm (sorosilicate)', 'Si₂O₇⁶⁻', '3,5', 'Hai (hoặc một nhóm nhỏ) tứ diện liên kết', 'Epidote', 'group'],
    ['Silicate vòng (cyclosilicate)', 'Si₆O₁₈¹²⁻', '3', 'Các tứ diện liên kết thành vòng', 'Beryl, tourmaline', 'ring'],
    ['Silicate mạch đơn (inosilicate)', '(SiO₃)²⁻', '3', 'Chuỗi đơn', 'Pyroxene', 'chain'],
    ['Silicate mạch kép (inosilicate)', '(Si₄O₁₁)⁶⁻', '2,75', 'Chuỗi kép', 'Amphibole', 'dchain'],
    ['Silicate lớp (phyllosilicate)', '(Si₂O₅)²⁻', '2,5', 'Liên kết thành lớp (mạng 2 chiều)', 'Mica, talc, khoáng vật sét', 'sheet'],
    ['Silicate khung (tectosilicate)', 'SiO₂ (trung hoà)', '2', 'Mạng không gian ba chiều', 'Feldspar, quartz', 'frame']];
  mk(el, `<div class="two"><div class="grid" style="grid-template-columns:1fr">${S.map((s, i) => `<div class="mini click ${i === 3 ? 'sel' : ''}" data-i="${i}"><h4>${s[0]}</h4><span style="font-size:13px">${s[4]}</span></div>`).join('')}</div><div><canvas width="340" height="220" style="width:100%"></canvas><div class="res" id="si"></div></div></div>
  <div style="font-size:12px;color:var(--muted)">Tỷ lệ O/Si và công thức đơn vị là kiến thức chuẩn bổ sung (mở rộng) để thấy xu hướng: liên kết giữa các tứ diện tăng dần → O/Si giảm dần.</div>`);
  const c = q(el, 'canvas'), g = c.getContext('2d');
  const tri = (x, y, s, col) => { g.beginPath(); g.moveTo(x, y - s); g.lineTo(x + s * .87, y + s * .5); g.lineTo(x - s * .87, y + s * .5); g.closePath(); g.fillStyle = col; g.globalAlpha = .75; g.fill(); g.globalAlpha = 1; g.strokeStyle = ink(); g.lineWidth = 1; g.stroke(); };
  const draw = i => {
    g.clearRect(0, 0, 340, 220); const t = S[i][5], col = '#1f5fbf', s = 17;
    if (t === 'island') [[70, 110], [140, 80], [210, 130], [270, 90]].forEach(p => tri(p[0], p[1], s, col));
    if (t === 'group') [[130, 110], [176, 110]].forEach(p => tri(p[0], p[1], s, col));
    if (t === 'ring') for (let k = 0; k < 6; k++) { const a = k / 6 * 6.283; tri(170 + 60 * Math.cos(a), 110 + 60 * Math.sin(a), 15, col); }
    if (t === 'chain') for (let k = 0; k < 7; k++) tri(40 + k * 42, 110 + (k % 2 ? 14 : -14), 17, col);
    if (t === 'dchain') for (let r = 0; r < 2; r++) for (let k = 0; k < 7; k++) tri(40 + k * 42, 70 + r * 70 + (k % 2 ? 12 : -12), 17, col);
    if (t === 'sheet') for (let r = 0; r < 4; r++) for (let k = 0; k < 7; k++) tri(30 + k * 44 + (r % 2) * 22, 40 + r * 44, 15, col);
    if (t === 'frame') { for (let r = 0; r < 4; r++) for (let k = 0; k < 7; k++) tri(30 + k * 44 + (r % 2) * 22, 40 + r * 44, 15, col); g.fillStyle = ink(); g.font = '12px sans-serif'; g.fillText('(mạng liên kết cả ba chiều, hình chỉ là lát cắt)', 40, 214); }
    q(el, '#si').innerHTML = `<b>${S[i][0]}</b><br>Đơn vị: ${S[i][1]} · O/Si ≈ <b>${S[i][2]}</b><br>${S[i][3]}<br>Khoáng vật tiêu biểu: <b>${S[i][4]}</b>`;
  };
  qa(el, '.mini.click').forEach(m => m.onclick = () => { qa(el, '.mini.click').forEach(x => x.classList.toggle('sel', x === m)); draw(+m.dataset.i); }); draw(3);
};

/* ---------- Thẻ khoáng vật phổ biến ---------- */

W.texture = el => {
  const X = [
    ['Hiển tinh (phaneritic)', 'Tinh thể lớn (> 1 mm), dễ quan sát bằng mắt thường; hình thành do magma nguội chậm ở sâu (đá xâm nhập).', 'Granite, diorite, gabbro, peridotite', 0.09, 1, 'slow'],
    ['Ẩn tinh (aphanitic)', 'Tinh thể rất nhỏ (< 1 mm), không quan sát được bằng mắt thường; hình thành do magma nguội nhanh gần bề mặt hoặc trên bề mặt (đá phun trào).', 'Basalt, andesite, rhyolite', 0.02, 1, 'fast'],
    ['Nổi ban (porphyr / porphyritic)', 'Hai cỡ hạt rõ rệt: tinh thể lớn (phenocryst) trong nền hạt mịn (groundmass). Hình thành do thay đổi tốc độ nguội: ban đầu nguội chậm ở sâu, sau đó magma lên gần bề mặt và nguội nhanh.', 'Andesite porphyritic, granite porphyry', 0.02, 1, 'two'],
