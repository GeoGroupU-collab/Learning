<script>
/* widgets chương 4: PCA và học tăng cường */

/* PCA: trục nào giữ được nhiều phương sai nhất */
W.pca = el => {
  const r = seedRand(2), P = []; for (let i = 0; i < 100; i++) { const a = 1.7 * gauss(r), b = .55 * gauss(r); P.push([a * Math.cos(.6) - b * Math.sin(.6), a * Math.sin(.6) + b * Math.cos(.6)]); }
  const mx = meanOf(P.map(p => p[0])), my = meanOf(P.map(p => p[1])), Q = P.map(p => [p[0] - mx, p[1] - my]);
  const sxx = varOf(Q.map(p => p[0])), syy = varOf(Q.map(p => p[1])), sxy = Q.reduce((s, p) => s + p[0] * p[1], 0) / (Q.length - 1);
  const th1 = .5 * Math.atan2(2 * sxy, sxx - syy), tr = sxx + syy, det = sxx * syy - sxy * sxy, l1 = tr / 2 + Math.sqrt(tr * tr / 4 - det), l2 = tr / 2 - Math.sqrt(tr * tr / 4 - det);
  const vAt = th => varOf(Q.map(p => p[0] * Math.cos(th) + p[1] * Math.sin(th)));
  mk(el, slider('a', 'hướng của trục (độ)', 0, 180, 1, 20, '°') + `<div class="lab"><button class="btn sm" id="pc1">Đặt trục = PC1</button><button class="btn sm" id="pc2">Đặt trục = PC2</button></div><div class="two"><canvas id="c1"></canvas><canvas id="c2"></canvas></div><div class="res" id="o"></div>`);
  const draw = deg => {
    const th = deg * D2R, c1 = q(el, '#c1'); c1.width = 400; c1.height = 340; c1.style.width = '100%'; const g = c1.getContext('2d'), F = frame(g, 400, 340, [-5, 5], [-4.25, 4.25]);
    const u = [Math.cos(th), Math.sin(th)];
    Q.forEach(p => { const t = p[0] * u[0] + p[1] * u[1], pr = [t * u[0], t * u[1]]; g.strokeStyle = 'rgba(214,39,40,.35)'; g.beginPath(); g.moveTo(F.X(p[0]), F.Y(p[1])); g.lineTo(F.X(pr[0]), F.Y(pr[1])); g.stroke(); });
    g.strokeStyle = ink(); g.lineWidth = 2.5; g.beginPath(); g.moveTo(F.X(-6 * u[0]), F.Y(-6 * u[1])); g.lineTo(F.X(6 * u[0]), F.Y(6 * u[1])); g.stroke(); g.lineWidth = 1;
    Q.forEach(p => { g.fillStyle = '#1f77d0'; g.beginPath(); g.arc(F.X(p[0]), F.Y(p[1]), 3.5, 0, 7); g.fill(); });
    Q.forEach(p => { const t = p[0] * u[0] + p[1] * u[1]; g.fillStyle = '#d62728'; g.beginPath(); g.arc(F.X(t * u[0]), F.Y(t * u[1]), 2.5, 0, 7); g.fill(); });
    const c2 = q(el, '#c2'); c2.width = 400; c2.height = 340; c2.style.width = '100%'; const g2 = c2.getContext('2d'), F2 = frame(g2, 400, 340, [0, 180], [0, l1 * 1.15], 40, 6);
    g2.strokeStyle = '#1f77b4'; g2.lineWidth = 2; g2.beginPath(); for (let d = 0; d <= 180; d += 2) { const v = vAt(d * D2R); d ? g2.lineTo(F2.X(d), F2.Y(v)) : g2.moveTo(F2.X(d), F2.Y(v)); } g2.stroke();
    const cur = vAt(th); g2.fillStyle = '#d62728'; g2.beginPath(); g2.arc(F2.X(deg), F2.Y(cur), 6, 0, 7); g2.fill(); g2.fillStyle = ink(); g2.fillText('phương sai của các điểm chiếu (đỏ) theo hướng trục', 44, 14);
    const pc1d = ((th1 / D2R) % 180 + 180) % 180;
    q(el, '#o').innerHTML = `Phương sai giữ lại = <b>${cur.toFixed(3)}</b> (${(cur / tr * 100).toFixed(1)}% tổng phương sai ${tr.toFixed(2)}).<br>PC1 nằm ở ≈ <b>${pc1d.toFixed(0)}°</b> giữ <b>${(l1 / tr * 100).toFixed(1)}%</b>; PC2 (vuông góc) giữ <b>${(l2 / tr * 100).toFixed(1)}%</b>. Các đoạn đỏ là thông tin bị bỏ đi khi chiếu xuống một chiều — PCA chọn trục làm đoạn đỏ ngắn nhất tổng cộng, tức phương sai giữ lại lớn nhất.`;
  };
  bindSlider(el, 'a', draw, '°'); const set = d => { q(el, '#a').value = Math.round(d); q(el, '#av').textContent = Math.round(d) + '°'; draw(Math.round(d)); };
  q(el, '#pc1').onclick = () => set(((th1 / D2R) % 180 + 180) % 180); q(el, '#pc2').onclick = () => set((((th1 / D2R) + 90) % 180 + 180) % 180); draw(20);
};

/* Học tăng cường: Q-learning trên lưới */
W.rl = el => {
  const N = 4, GOAL = 15, FIRE = [5, 11], A = [[-1, 0], [0, 1], [1, 0], [0, -1]], ARW = ['↑', '→', '↓', '←'];
  mk(el, `<div class="lab"><button class="btn sm" data-n="1">Huấn luyện 1 lượt</button><button class="btn sm" data-n="50">50 lượt</button><button class="btn sm" data-n="500">500 lượt</button><button class="btn sm" id="rs">↺ Xoá kinh nghiệm</button><span class="val" id="inf" style="min-width:200px"></span></div><canvas></canvas><div class="legend"><span>🤖 agent xuất phát ở góc trên-trái</span><span>💎 đích (+10)</span><span>🔥 lửa (−10)</span><span>mỗi bước −0.1</span></div><div class="res" id="o"></div>`);
  let Qt, ep, last; const rnd = seedRand(77);
  const reset = () => { Qt = Array.from({ length: N * N }, () => [0, 0, 0, 0]); ep = 0; last = null; draw(); };
  const stepEnv = (s, a) => { const r = Math.floor(s / N), c = s % N, nr = Math.max(0, Math.min(N - 1, r + A[a][0])), nc = Math.max(0, Math.min(N - 1, c + A[a][1])), ns = nr * N + nc; let rew = -.1, done = false; if (ns === GOAL) { rew = 10; done = true; } else if (FIRE.includes(ns)) { rew = -10; done = true; } return [ns, rew, done]; };
  const episode = () => { let s = 0, tot = 0; for (let t = 0; t < 60; t++) { const a = rnd() < .2 ? Math.floor(rnd() * 4) : Qt[s].indexOf(Math.max(...Qt[s])); const [ns, rw, done] = stepEnv(s, a); Qt[s][a] += .5 * (rw + .9 * (done ? 0 : Math.max(...Qt[ns])) - Qt[s][a]); tot += rw; s = ns; if (done) break; } ep++; last = tot; };
  const path = () => { let s = 0; const p = [0]; for (let t = 0; t < 20; t++) { const a = Qt[s].indexOf(Math.max(...Qt[s])); s = stepEnv(s, a)[0]; p.push(s); if (s === GOAL || FIRE.includes(s)) break; } return p; };
  const draw = () => {
    const g = cv(el, 400, 400), cs = 100, p = ep ? path() : [0]; el.querySelector('canvas').style.maxWidth = '420px'; g.font = '13px sans-serif'; g.textAlign = 'center';
    for (let s = 0; s < N * N; s++) { const r = Math.floor(s / N), c = s % N, x = c * cs, y = r * cs, mq = Math.max(...Qt[s]); g.fillStyle = s === GOAL ? 'rgba(27,154,91,.35)' : FIRE.includes(s) ? 'rgba(214,39,40,.35)' : `rgba(31,119,208,${Math.max(0, Math.min(.5, mq / 20))})`; g.fillRect(x, y, cs, cs); g.strokeStyle = ink(); g.strokeRect(x, y, cs, cs); g.fillStyle = ink();
      if (s === GOAL) g.fillText('💎 +10', x + 50, y + 55); else if (FIRE.includes(s)) g.fillText('🔥 −10', x + 50, y + 55); else { if (ep) { g.font = '28px sans-serif'; g.fillText(ARW[Qt[s].indexOf(mq)], x + 50, y + 55); g.font = '10px sans-serif'; g.fillText(mq.toFixed(1), x + 50, y + 90); g.font = '13px sans-serif'; } if (s === 0) g.fillText('🤖', x + 18, y + 20); } }
    if (ep) { g.strokeStyle = '#e8912d'; g.lineWidth = 4; g.beginPath(); p.forEach((s, i) => { const x = (s % N) * cs + 50, y = Math.floor(s / N) * cs + 50; i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.stroke(); g.lineWidth = 1; }
    g.textAlign = 'left'; q(el, '#inf').textContent = `lượt ${ep}${last === null ? '' : ' · phần thưởng lượt cuối = ' + last.toFixed(1)}`;
    const end = p[p.length - 1]; q(el, '#o').innerHTML = ep === 0 ? 'Agent chưa biết gì: chọn hành động ngẫu nhiên. Bấm huấn luyện để nó thử–sai và ghi lại giá trị Q của từng (trạng thái, hành động).' : `Đường cam = đường đi theo chính sách hiện tại (chọn hành động có Q lớn nhất): ${end === GOAL ? '<b>đã tới đích 💎</b>' : FIRE.includes(end) ? '<b>rơi vào lửa 🔥</b> — cần huấn luyện thêm' : 'chưa tới đích — cần huấn luyện thêm'}. Mũi tên và số trong ô: hành động tốt nhất và giá trị Q của nó.`;
  };
  qa(el, '[data-n]').forEach(b => b.onclick = () => { for (let i = 0; i < +b.dataset.n; i++) episode(); draw(); });
  q(el, '#rs').onclick = reset; reset();
};

</script>
<script>
/* Sắp lại chương theo 5 chuẩn đầu ra (L.O.1–L.O.5) của môn học. Chạy sau khi nạp mọi content*.js. */
(() => {
  const all = window.CHAPTERS, get = id => all.find(c => c.id === id);
  const c1 = get('c1'), c2 = get('c2'), c3 = get('c3'), c4 = get('c4');
  const libIds = ['ba-thu-vien', 'numpy', 'pandas-co-ban', 'matplotlib', 'bai-tich-hop'];
  const libs = c2.sections.filter(s => libIds.includes(s.id));
  c2.sections = c2.sections.filter(s => !libIds.includes(s.id));
  const mkc = (id, num, title, blurb, sections) => ({ id, num, title, blurb, sections });
  const out = [
    mkc('c1', 1, 'Khái niệm Data Science', 'L.O.1 · Mô tả và giải thích các khái niệm, thuật ngữ then chốt: dữ liệu, phân loại, vòng đời CRISP-DM, công cụ.', c1.sections),
    mkc('c2', 2, 'Python cơ bản', 'L.O.2 · Lệnh cơ bản và kiểu dữ liệu Python: toán tử, biến, vòng lặp, list/tuple/set/dict, hàm, file.', c2.sections),
    mkc('c3', 3, 'Thư viện Python phân tích dữ liệu', 'L.O.3 · NumPy, pandas, Matplotlib và một bài tích hợp PVT → lưu lượng giếng khí.', libs),
    mkc('c4', 4, 'Data Wrangling', 'L.O.4 · Nạp dữ liệu, khám phá (EDA), làm sạch, biến đổi, ghép, định hình lại và gộp nhóm.', c3.sections),
    mkc('c5', 5, 'Machine Learning', 'L.O.5 · Học có giám sát, không giám sát, tăng cường và scikit-learn.', c4.sections)
  ];
  out.forEach(c => c.sections.forEach((s, i) => { s.title = s.title.replace(/^\d+\.\s*/, ''); s.title = (i + 1) + '. ' + s.title; }));
  all.length = 0; out.forEach(c => all.push(c));
})();

</script>
<script>
/* Playground Python chạy ngay trong trình duyệt (Pyodide). Chỉ tải thư viện khi bạn bấm "Chạy" lần đầu → cần Internet lần đó;
   phần bài giảng và hình tương tác vẫn dùng ngoại tuyến bình thường. */
const PYODIDE_URL = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/';
let pyReady = null, pyRun = null;
const PY_HELPER = [
  'import sys, io, os, contextlib, base64, traceback, warnings',
  "warnings.filterwarnings('ignore', message='.*non-GUI backend.*')",
  "os.environ['MPLBACKEND'] = 'AGG'",
  'def _run(code, ns):',
  '    buf = io.StringIO(); imgs = []',
  '    with contextlib.redirect_stdout(buf), contextlib.redirect_stderr(buf):',
  '        try:',
  "            exec(compile(code, '<playground>', 'exec'), ns)",
  '        except BaseException:',
  '            traceback.print_exc(limit=-3)',
  '    if "matplotlib.pyplot" in sys.modules:',
  '        plt = sys.modules["matplotlib.pyplot"]',
  '        for n in plt.get_fignums():',
  '            b = io.BytesIO(); plt.figure(n).savefig(b, format="png", dpi=90, bbox_inches="tight")',
  '            imgs.append(base64.b64encode(b.getvalue()).decode())',
  '        plt.close("all")',
  '    return buf.getvalue(), imgs'
].join('\n');

function loadPy(setStatus) {
  if (pyReady) return pyReady;
  pyReady = new Promise((res, rej) => {
    setStatus && setStatus('Đang tải Python (lần đầu khoảng vài chục giây, cần Internet)…');
    const s = document.createElement('script'); s.src = PYODIDE_URL + 'pyodide.js';
    s.onerror = () => { pyReady = null; rej(new Error('Không tải được Python runtime. Hãy kiểm tra kết nối Internet rồi thử lại.')); };
    s.onload = async () => {
      try { const py = await loadPyodide({ indexURL: PYODIDE_URL }); py.runPython(PY_HELPER); pyRun = py.globals.get('_run'); res(py); }
      catch (e) { pyReady = null; rej(e); }
    };
    document.head.appendChild(s);
  });
  return pyReady;
}
const pyNs = {};   // mỗi bài một không gian tên: đoạn code sau dùng được biến của đoạn trước
async function runPy(code, key, setStatus) {
  const py = await loadPy(setStatus);
  setStatus && setStatus('Đang nạp thư viện cần dùng…');
  await py.loadPackagesFromImports(code);
  if (!pyNs[key]) pyNs[key] = py.runPython('{"__name__": "__main__"}');
  setStatus && setStatus('Đang chạy…');
  const r = pyRun(code, pyNs[key]).toJs();
  return { text: r[0], imgs: r[1] };
}
function showResult(box, r) {
  box.textContent = r.text || (r.imgs.length ? '' : '(không in gì)');
  r.imgs.forEach(b => { const i = new Image(); i.src = 'data:image/png;base64,' + b; i.style.cssText = 'max-width:100%;display:block;margin-top:8px;background:#fff;border-radius:8px'; box.appendChild(i); });
}
/* nút ▶ Chạy trên từng khối code trong bài (gọi từ enhance) */
const pyRan = {};   // các đoạn đã chạy, theo bài
function addRunButton(pre, raw) {
  const b = document.createElement('button'); b.className = 'cpy'; b.style.right = '62px'; b.textContent = '▶ Chạy'; pre.appendChild(b);
  let box = null;
  b.onclick = async () => {
    if (!box) { box = document.createElement('pre'); box.className = 'out live'; pre.insertAdjacentElement('afterend', box); }
    box.textContent = ''; const st = m => box.textContent = m; b.disabled = true;
    const key = location.hash, ran = pyRan[key] = pyRan[key] || new Set();
    try {
      // chạy trước (im lặng) các đoạn code phía trên trong cùng bài để có sẵn import và biến
      const blocks = [...pre.closest('main').querySelectorAll('pre.py')].filter(p => !p.closest('[data-w]'));
      for (const p of blocks) {
        if (p === pre) break;
        if (ran.has(p) || !p.dataset.raw) continue;
        ran.add(p); try { await runPy(p.dataset.raw, key, st); } catch (e) { /* bỏ qua lỗi của đoạn phụ */ }
      }
      ran.add(pre);
      showResult(box, await runPy(raw, key, st));
    } catch (e) { box.textContent = e.message; }
    b.disabled = false;
  };
}

const PLAY_SAMPLES = {
  'Xin chào Python': 'print("Hello, Python!")\nfor i in range(3):\n    print("bình phương của", i, "là", i ** 2)',
  'List, dict, comprehension': 'nums = [3, 1, 4, 1, 5, 9, 2, 6]\nprint(sorted(nums), sum(nums) / len(nums))\nd = {"a": 1, "b": 2}\nprint({k: v ** 2 for k, v in d.items()})\nprint([x for x in nums if x % 2 == 0])',
  'NumPy': 'import numpy as np\nm = np.arange(12).reshape(3, 4)\nprint(m)\nprint(m.sum(axis=0), m.mean(), m[m > 6])',
  'pandas: groupby': 'import pandas as pd\ndf = pd.DataFrame({"Dept": ["Sales", "Sales", "HR", "HR"], "Salary": [70, 80, 75, 78]})\nprint(df.groupby("Dept")["Salary"].agg(["mean", "max"]))',
  'Matplotlib: vẽ hình': 'import numpy as np\nimport matplotlib.pyplot as plt\nx = np.linspace(0, 2 * np.pi, 200)\nplt.plot(x, np.sin(x), "r--", label="sin")\nplt.plot(x, np.cos(x), "b-", label="cos")\nplt.legend(); plt.grid(); plt.title("Basic Plotting")\nplt.show()',
  'scikit-learn: hồi quy tuyến tính': 'import numpy as np\nfrom sklearn.linear_model import LinearRegression\nX = np.array([[1], [2], [3], [4], [5]]); y = np.array([2, 4, 5, 4, 5])\nm = LinearRegression().fit(X, y)\nprint("slope =", m.coef_[0], " intercept =", m.intercept_)\nprint("dự đoán x=6:", m.predict([[6]]))',
  'scikit-learn: KNN trên Iris': 'from sklearn.datasets import load_iris\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.neighbors import KNeighborsClassifier\nX, y = load_iris(return_X_y=True)\nXtr, Xte, ytr, yte = train_test_split(X, y, test_size=0.3, random_state=1)\nm = KNeighborsClassifier(5).fit(Xtr, ytr)\nprint("accuracy =", round(m.score(Xte, yte), 3))'
};
function playPage() {
  const names = Object.keys(PLAY_SAMPLES);
  main.innerHTML = `<div class="crumb">Công cụ</div><h2 class="st">Playground Python</h2>
  <div class="tldr"><b>Cách dùng</b>Gõ hoặc dán code Python, bấm <b>Chạy</b> (hoặc Ctrl + Enter). Python chạy ngay trong trình duyệt của bạn (Pyodide) với NumPy, pandas, Matplotlib, SciPy, scikit-learn. <b>Lần chạy đầu cần Internet</b> để tải Python (vài chục giây); các bài giảng khác vẫn dùng ngoại tuyến.</div>
  <div class="lab"><label>Mẫu <select id="pl-s">${names.map(n => `<option>${n}</option>`).join('')}</select></label><button class="btn primary" id="pl-run">▶ Chạy</button><button class="btn" id="pl-reset">↺ Xoá biến đã tạo</button><span id="pl-st" class="val" style="min-width:200px"></span></div>
  <textarea id="pl-code" spellcheck="false" style="width:100%;min-height:260px;font:14px/1.5 Consolas,monospace;background:#0f1524;color:#dbe3f7;border:1px solid #1f2a44;border-radius:10px;padding:12px;tab-size:4"></textarea>
  <pre class="out live" id="pl-out" style="margin-top:8px;border-radius:10px">(kết quả hiện ở đây)</pre>`;
  const ta = q(main, '#pl-code'), out = q(main, '#pl-out'), st = q(main, '#pl-st');
  const saved = store.get('playcode', ''); ta.value = saved || PLAY_SAMPLES[names[0]];
  q(main, '#pl-s').onchange = e => { ta.value = PLAY_SAMPLES[e.target.value]; store.set('playcode', ta.value); };
  ta.oninput = () => store.set('playcode', ta.value);
  ta.onkeydown = e => { if (e.key === 'Tab') { e.preventDefault(); const s = ta.selectionStart; ta.setRangeText('    ', s, ta.selectionEnd, 'end'); } if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); } };
  const run = async () => { out.textContent = ''; const btn = q(main, '#pl-run'); btn.disabled = true; try { showResult(out, await runPy(ta.value, 'playground', m => st.textContent = m)); st.textContent = 'Xong'; } catch (e) { out.textContent = e.message; st.textContent = ''; } btn.disabled = false; };
  q(main, '#pl-run').onclick = run;
  q(main, '#pl-reset').onclick = () => { delete pyNs.playground; st.textContent = 'Đã xoá biến'; };
}

</script>
<script>
/* Khung ứng dụng: mục lục, định tuyến theo hash, tiến độ học, giao diện sáng/tối.
   Đổi SITE.title / SITE.sub cho từng môn. Không chứa câu hỏi kiểm tra (quiz làm ở web khác). */
const SITE = { title: 'Khoa học dữ liệu', sub: 'GE1027 · ĐH Bách khoa TP.HCM' };
const CH = window.CHAPTERS;
const $ = (s, r = document) => r.querySelector(s);
const side = $('#side'), main = $('#main');
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let done = store.get('done', {});
const colors = ['var(--c1)', 'var(--c2)', 'var(--c3)', '#c2185b', 'var(--accent)'];
const col = i => colors[i % colors.length];

function buildSide() {
  const total = CH.reduce((n, c) => n + c.sections.length, 0), got = CH.reduce((n, c) => n + c.sections.filter(x => done[c.id + '/' + x.id]).length, 0);
  side.innerHTML = `<h1>${SITE.title}</h1><div class="sub">${SITE.sub}</div>
  <div class="bar"><i style="width:${Math.round(got / total * 100)}%"></i></div>
  <div class="sub" style="margin-top:4px">Đã học ${got}/${total} mục</div>
  <div class="chap"><button data-go="home"><span class="num" style="background:var(--accent)">⌂</span>Trang chủ</button></div><div class="chap"><a class="pl" href="#play" style="display:flex;gap:8px;align-items:center;padding:8px 10px;font:600 14px inherit;text-decoration:none;color:var(--ink)"><span class="num" style="background:#0e8a7d">▶</span>Playground Python</a></div>` +
    CH.map((c, i) => `<div class="chap" data-c="${c.id}"><button data-toggle="${c.id}"><span class="num" style="background:${col(i)}">${c.num}</span>${c.title}</button>
    <div class="sec">${c.sections.map(s => `<a href="#${c.id}/${s.id}" data-s="${c.id}/${s.id}"><span>${s.title}</span><span class="tick">${done[c.id + '/' + s.id] ? '✓' : ''}</span></a>`).join('')}</div></div>`).join('') +
    `<div class="tools"><button id="theme">🌓 Sáng/Tối</button><button id="reset">↺ Xoá tiến độ</button></div>`;
}
side.addEventListener('click', e => {
  const t = e.target.closest('[data-toggle]');
  if (t) { t.parentElement.classList.toggle('open'); return; }
  const g = e.target.closest('[data-go]');
  if (g) { location.hash = ''; side.classList.remove('on'); }
  if (e.target.closest('a')) side.classList.remove('on');
  if (e.target.id === 'theme') { const d = document.documentElement.dataset.theme === 'dark'; document.documentElement.dataset.theme = d ? '' : 'dark'; store.set('theme', d ? '' : 'dark'); }
  if (e.target.id === 'reset' && confirm('Xoá toàn bộ tiến độ học?')) { done = {}; store.set('done', done); buildSide(); route(); }
});
$('#menuBtn').onclick = () => side.classList.toggle('on');
document.documentElement.dataset.theme = store.get('theme', '');

function mark(key) { if (!done[key]) { done[key] = 1; store.set('done', done); buildSide(); openActive(); } }
function openActive() {
  const h = location.hash.slice(1), cid = h.split('/')[0];
  document.querySelectorAll('.chap').forEach(c => c.classList.toggle('open', c.dataset.c === cid));
  document.querySelectorAll('.sec a').forEach(a => a.classList.toggle('active', a.dataset.s === h));
}
function home() {
  const last = store.get('last', ''), all = flat(), total = all.length, lk = all.find(x => x.c.id + '/' + x.s.id === last);
  main.innerHTML = `<div class="hero"><span class="pill">Web học tập tương tác</span><h2>${SITE.title}</h2><p>Từ tổng quan, Python, xử lý dữ liệu với pandas đến Machine Learning — mỗi bài có <b>tóm tắt 30 giây</b>, ví dụ code đã chạy thử, và hình tự tay kéo–thả.</p>
  ${lk ? `<p style="margin-top:14px"><a class="btn primary" style="background:#fff;color:#0f3d82;border-color:#fff" href="#${last}">▶ Học tiếp: ${lk.s.title}</a></p>` : `<p style="margin-top:14px"><a class="btn primary" style="background:#fff;color:#0f3d82;border-color:#fff" href="#${CH[0].id}/${CH[0].sections[0].id}">▶ Bắt đầu bài 1</a></p>`}</div>
  <div class="grid">${CH.map((c, i) => `<a class="mini click" style="text-decoration:none;color:inherit;border-top:5px solid ${col(i)}" href="#${c.id}/${c.sections[0].id}"><h4>Chương ${c.num}. ${c.title}</h4><div style="font-size:14px;color:var(--muted)">${c.blurb || ''}</div><div style="margin-top:8px;font-size:13px"><b>${c.sections.length}</b> bài · đã học <b>${c.sections.filter(s => done[c.id + '/' + s.id]).length}</b></div></a>`).join('')}</div>
  <div class="card"><h3>Cách học</h3><ol><li>Đọc khung <b>Tóm tắt 30 giây</b> đầu bài — nếu đã biết thì lướt.</li><li>Nghịch thử hình tương tác: đó là chỗ hiểu nhanh nhất.</li><li>Đọc kết quả code (khung xanh); mọi đoạn code đều đã được chạy thật.</li><li>Cuối bài có <b>“Nhớ một câu”</b> để ôn nhanh trước giờ thi.</li></ol><p><a class="btn" href="#play">▶ Mở Playground Python</a> — tự gõ code và chạy ngay trong trình duyệt.</p><p style="color:var(--muted);font-size:14px;margin:0">Tổng cộng ${total} bài. Tiến độ lưu ngay trên trình duyệt của bạn (nút “Xoá tiến độ” ở cuối mục lục).</p></div>`;
  enhance(main); mountWidgets(main); openActive();
}
function flat() { return CH.flatMap(c => c.sections.map(s => ({ c, s }))); }
function chapterPage(c, s) {
  const all = flat(), k = all.findIndex(x => x.s === s), prev = all[k - 1], next = all[k + 1];
  const lab = x => (x.c === c ? '' : `Ch.${x.c.num} · `) + x.s.title;
  main.innerHTML = `<div class="crumb">Chương ${c.num} · ${c.title}</div><h2 class="st">${s.title}</h2>${s.html}
  <div class="pager">${prev ? `<a class="btn" href="#${prev.c.id}/${prev.s.id}">← ${lab(prev)}</a>` : '<span></span>'}${next ? `<a class="btn primary" href="#${next.c.id}/${next.s.id}">${lab(next)} →</a>` : '<span></span>'}</div>`;
  store.set('last', c.id + '/' + s.id);
  enhance(main); mountWidgets(main); mark(c.id + '/' + s.id);
}
function route() {
  const h = location.hash.slice(1); window.scrollTo(0, 0);
  if (!h) home();
  else if (h === 'play') playPage();
  else {
    const [cid, sid] = h.split('/'), c = CH.find(x => x.id === cid);
    if (!c) home(); else chapterPage(c, c.sections.find(x => x.id === sid) || c.sections[0]);
  }
  openActive();
}
window.addEventListener('hashchange', route);
buildSide(); route();

</script>
